<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Uploader</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5; min-height: 100vh; padding: 20px; color: #333;
        }
        .container { max-width: 1400px; margin: 0 auto; }

        .header {
            background: white; padding: 30px; border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1); margin-bottom: 20px; text-align: center;
        }
        .header h1 { font-size: 36px; color: #333; margin-bottom: 8px; }
        .header p { color: #666; font-size: 16px; }
        .header .subtitle { color: #999; font-size: 13px; font-style: italic; margin-top: 6px; }

        .toolbar {
            background: white; padding: 18px 20px; border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06); margin-bottom: 20px;
            display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
        }
        .toolbar input[type="search"] {
            flex: 1; min-width: 220px; padding: 11px 14px; border: 2px solid #eee;
            border-radius: 10px; font-size: 15px;
        }
        .btn {
            padding: 11px 18px; border: none; border-radius: 10px; font-size: 15px;
            font-weight: 600; cursor: pointer; transition: .15s; white-space: nowrap;
        }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-primary { background: #1a1a1a; color: #fff; }
        .btn-primary:hover:not(:disabled) { background: #000; }
        .btn-green { background: #2e7d32; color: #fff; }
        .btn-green:hover:not(:disabled) { background: #1b5e20; }
        .btn-light { background: #f0f0f0; color: #333; }
        .btn-light:hover:not(:disabled) { background: #e4e4e4; }
        .btn-undo { background: #fff3e0; color: #e65100; border: 1px solid #ffcc80; }
        .btn-undo:hover:not(:disabled) { background: #ffe0b2; }

        .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-left: auto; }
        .chip { padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }
        .chip.matched { background: #e8f5e9; color: #2e7d32; }
        .chip.sent { background: #eceff1; color: #607d8b; }
        .chip.unmatched { background: #fff8e1; color: #f57f17; }

        .status { text-align: center; color: #666; font-size: 14px; margin: 10px 0 18px; min-height: 20px; }

        .section-title { font-size: 15px; font-weight: 700; color: #888; text-transform: uppercase;
            letter-spacing: .5px; margin: 26px 4px 12px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

        .card {
            background: white; border-radius: 14px; overflow: hidden; position: relative;
            box-shadow: 0 4px 18px rgba(0,0,0,0.07); border: 2px solid transparent; transition: .15s;
            display: flex; flex-direction: column;
        }
        .card.matched { border-color: #c8e6c9; }
        .card.unmatched { border-color: #ffe082; background: #fffdf5; }
        .card.sent { opacity: .62; filter: grayscale(.4); }
        .card.busy { pointer-events: none; }

        .thumb { position: relative; width: 100%; aspect-ratio: 1/1; background: #111; overflow: hidden; }
        .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .thumb .play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,.85); font-size: 40px; pointer-events: none; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
        .thumb .checkwrap { position: absolute; top: 10px; left: 10px; }
        .thumb .checkwrap input { width: 22px; height: 22px; cursor: pointer; }
        .badge-pos { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,.65); color: #fff;
            font-size: 11px; padding: 3px 8px; border-radius: 6px; }

        .card-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .filename { font-size: 12px; color: #999; word-break: break-all; }
        .sku { font-size: 13px; font-weight: 700; color: #1a1a1a; }
        .sku span { display: inline-block; background: #eef2ff; color: #3949ab; padding: 2px 8px; border-radius: 6px; cursor: pointer; user-select: all; }
        .sku span:hover { background: #dfe6ff; }
        .sku span::after { content: " ⧉"; opacity: .45; font-size: 11px; }
        .ptitle { font-size: 14px; color: #333; line-height: 1.35; }
        .ptitle a { color: #1565c0; text-decoration: none; }
        .ptitle a:hover { text-decoration: underline; }
        .muted { color: #aaa; font-size: 13px; }
        .warn { color: #f57f17; font-size: 13px; font-weight: 600; }
        .note { color: #607d8b; font-size: 12px; background: #eceff1; padding: 6px 8px; border-radius: 6px; }

        .manual { display: flex; gap: 6px; margin-top: 4px; }
        .manual input { flex: 1; padding: 8px 10px; border: 2px solid #ffe082; border-radius: 8px; font-size: 13px; }

        .card-actions { margin-top: auto; display: flex; gap: 8px; padding-top: 6px; }
        .card-actions .btn { flex: 1; font-size: 14px; padding: 9px 10px; }

        .sent-stamp { font-size: 11px; color: #90a4ae; }
        .row-msg { font-size: 12px; padding: 4px 0; min-height: 16px; }
        .row-msg.err { color: #c62828; }
        .row-msg.ok { color: #2e7d32; }

        .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4);
            border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty { text-align: center; color: #999; padding: 40px; background: #fff; border-radius: 14px; }

        /* Etsy tab: video + listing side-by-side preview */
        .vpair { display: flex; gap: 8px; align-items: flex-start; }
        .vpair .vp { flex: 1; min-width: 0; }
        .vimg { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 10px; display: block; background: #111; border: 1px solid #eee; }
        span.vimg.ph { background: #f3f3f3; }
        .vplabel { font-size: 10px; color: #999; text-align: center; margin-top: 3px; text-transform: uppercase; letter-spacing: .4px; }
        .vmore { font-size: 11px; color: #607d8b; text-align: center; margin-top: 6px; background: #eceff1; padding: 4px 6px; border-radius: 6px; }
        /* Etsy tab: closest-listing picker */
        .closest-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        .closest-card { width: 108px; border: 1px solid #eee; border-radius: 8px; padding: 5px; cursor: pointer; background: #fff; text-align: center; }
        .closest-card:hover { border-color: #2e7d32; box-shadow: 0 1px 6px rgba(0,0,0,.1); }
        .cc-img { width: 100%; height: 80px; object-fit: cover; border-radius: 6px; border: 1px solid #eee; display: block; background: #f3f3f3; }
        span.cc-img.ph { display: block; }
        .cc-sku { font-size: 11px; font-weight: 700; margin-top: 4px; word-break: break-all; }
        .cc-title { font-size: 10px; color: #999; margin-top: 2px; line-height: 1.3; max-height: 26px; overflow: hidden; }
    </style>
</head>
<body>
    <script src="/auth-check.js"></script>
    <div class="container">
        <div class="header">
            <h1>🎬 Video Uploader</h1>
            <p>Push square videos from your Drive folder to the right product — placed as image&nbsp;2.</p>
            <div class="subtitle">v1.9 · Shopify + Send to Etsy · reads folder "SHOPIFY SQ VIDEOS" · matches by SKU for print files · "sent" = pushed by this tool only</div>
        </div>

        <div class="toolbar" style="justify-content:center; gap:8px">
            <button class="btn btn-primary" id="tabShopifyBtn" onclick="switchVTab('shopify')">Shopify</button>
            <button class="btn btn-light" id="tabEtsyBtn" onclick="switchVTab('etsy')">Send to Etsy</button>
        </div>

        <div id="shopifyTab">
        <div class="toolbar">
            <button class="btn btn-primary" id="loadBtn" onclick="loadVideos()">↻ Load videos</button>
            <input type="search" id="search" placeholder="Search SKU, product title or filename…" oninput="render()">
            <button class="btn btn-light" id="selectAllBtn" onclick="toggleSelectAll()">Select all unsent</button>
            <button class="btn btn-green" id="bulkBtn" onclick="sendSelected(false)" disabled>Send selected (0)</button>
            <button class="btn btn-undo" id="bulkReplaceBtn" onclick="sendSelected(true)" disabled>↺ Replace selected (0)</button>
            <div class="stats" id="stats"></div>
        </div>

        <div class="status" id="status">Click <b>Load videos</b> to begin.</div>

        <div id="unmatchedSection"></div>
        <div id="readySection"></div>
        <div id="sentSection"></div>
        </div><!-- /shopifyTab -->

        <div id="etsyTab" style="display:none">
            <div class="toolbar">
                <button class="btn btn-primary" id="etsyLoadBtn" onclick="loadEtsy()">↻ Load videos</button>
                <button class="btn btn-light" id="etsyRefreshBtn" onclick="etsyRefresh()" title="Read your Etsy listings and rebuild the SKU list">⟳ Refresh from Etsy</button>
                <input type="search" id="etsySearch" placeholder="Search SKU or filename…" oninput="renderEtsy()">
                <button class="btn btn-light" id="etsySelectAllBtn" onclick="etsyToggleSelectAll()">Select all unsent</button>
                <button class="btn btn-green" id="etsyBulkBtn" onclick="etsySendSelected()" disabled>Send selected (0)</button>
                <div class="stats" id="etsyStats"></div>
            </div>
            <div class="status" id="etsyStatus">Click <b>Load videos</b> to begin.</div>
            <div id="etsyConn"></div>
            <div id="etsyReadySection"></div>
            <div id="etsyNotSection"></div>
        </div><!-- /etsyTab -->
    </div>

<script>
const API = '/api/shopify-video';
let videos = [];          // full list from the backend
const selected = new Set(); // fileIds selected for bulk send

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function setStatus(msg){ document.getElementById('status').innerHTML = msg; }

// Click-to-copy SKU badge
function skuBadge(sku){
    return '<div class="sku">SKU <span title="Click to copy" onclick="copySku(this, \'' + esc(sku||'') + '\')">' + esc(sku||'—') + '</span></div>';
}
function copySku(el, sku){
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(sku);
    const orig = el.textContent;
    el.textContent = '✓ copied';
    setTimeout(function(){ el.textContent = orig; }, 900);
}

// A video counts as "sent" ONLY if it was pushed by this tool (github record).
// A pre-existing/different video on the product does NOT count — you can still send yours.
function isSent(v){ return v.matched && v.sentViaTool; }
function isReady(v){ return v.matched && !v.sentViaTool; }
function isUnmatched(v){ return !v.matched; }

async function loadVideos(){
    const btn = document.getElementById('loadBtn');
    btn.disabled = true;
    setStatus('<span class="spinner" style="border-top-color:#333"></span> Reading the Drive folder and matching products…');
    try {
        const r = await fetch(API + '?action=list');
        const d = await r.json();
        if (!d.ok) { setStatus('⚠️ ' + esc(d.error || 'Could not load')); btn.disabled = false; return; }
        videos = d.videos || [];
        selected.clear();
        setStatus('Loaded <b>' + videos.length + '</b> video' + (videos.length===1?'':'s') + '.');
        render();
    } catch(e){ setStatus('⚠️ ' + esc(e.message)); }
    btn.disabled = false;
}

function matchesSearch(v, q){
    if (!q) return true;
    q = q.toLowerCase();
    return (v.sku||'').toLowerCase().includes(q)
        || (v.fileName||'').toLowerCase().includes(q)
        || (v.product && v.product.title||'').toLowerCase().includes(q);
}

function updateStats(){
    const m = videos.filter(isReady).length;
    const s = videos.filter(isSent).length;
    const u = videos.filter(isUnmatched).length;
    document.getElementById('stats').innerHTML =
        '<span class="chip matched">' + m + ' ready</span>' +
        '<span class="chip sent">' + s + ' sent</span>' +
        '<span class="chip unmatched">' + u + ' not identified</span>';
    const bulk = document.getElementById('bulkBtn');
    bulk.textContent = 'Send selected (' + selected.size + ')';
    bulk.disabled = selected.size === 0;
    const bulkR = document.getElementById('bulkReplaceBtn');
    bulkR.textContent = '↺ Replace selected (' + selected.size + ')';
    bulkR.disabled = selected.size === 0;
}

function cardHTML(v){
    const cls = isSent(v) ? 'sent' : (isUnmatched(v) ? 'unmatched' : 'matched');
    const checkbox = isReady(v)
        ? '<div class="checkwrap"><input type="checkbox" ' + (selected.has(v.fileId)?'checked':'') +
          ' onchange="toggleSelect(\'' + v.fileId + '\', this.checked)"></div>'
        : '';
    let info = '';
    if (v.matched){
        const note = (isReady(v) && v.productHasVideo)
            ? '<div class="note">ℹ️ Product already has another video — sending adds yours as a 2nd one.</div>' : '';
        info = skuBadge(v.sku) +
               '<div class="ptitle"><a href="' + esc(v.product.url) + '" target="_blank" rel="noopener">' + esc(v.product.title) + '</a></div>' + note;
    } else {
        info = skuBadge(v.sku) +
               '<div class="warn">⚠ No product found for this SKU</div>' +
               '<div class="manual">' +
               '<input type="text" id="mf-' + v.fileId + '" placeholder="SKU, or paste the product URL" value="' + esc(v.sku||'') + '">' +
               '<button class="btn btn-light" onclick="manualMatch(\'' + v.fileId + '\')">Match</button></div>';
    }
    let actions = '';
    if (isSent(v)){
        const label = v.manual ? '✓ marked done' : '✓ sent with this tool';
        const stamp = v.sentAt ? '<div class="sent-stamp">' + label + ' · ' + new Date(v.sentAt).toLocaleString() + '</div>'
                               : '<div class="sent-stamp">' + label + '</div>';
        const clearBtn = v.manual
            ? '<button class="btn btn-undo" onclick="unmarkDone(\'' + v.fileId + '\')">Unmark done</button>'
            : '<button class="btn btn-undo" onclick="undo(\'' + v.fileId + '\')">↺ Undo (remove &amp; resend)</button>';
        actions = stamp + '<div class="card-actions">' + clearBtn + '</div>';
    } else if (isReady(v)){
        const markBtn = '<button class="btn btn-light" onclick="markDone(\'' + v.fileId + '\')">✓ Mark as done</button>';
        if (v.productHasVideo){
            actions = '<div class="card-actions">' +
                '<button class="btn btn-green" onclick="sendOne(\'' + v.fileId + '\', false)">Add as 2nd</button>' +
                '<button class="btn btn-undo" onclick="sendOne(\'' + v.fileId + '\', true)">↺ Replace</button>' +
                markBtn +
                '</div>';
        } else {
            actions = '<div class="card-actions">' +
                '<button class="btn btn-green" onclick="sendOne(\'' + v.fileId + '\', false)">Send to Shopify</button>' +
                markBtn +
                '</div>';
        }
    }
    return '<div class="card ' + cls + '" id="card-' + v.fileId + '">' +
        '<div class="thumb">' +
            '<img src="' + esc(v.thumbnail) + '" loading="lazy" alt="" onerror="this.style.display=\'none\'">' +
            '<div class="play">▶</div>' + checkbox +
            (isSent(v) ? '' : '<div class="badge-pos">→ image 2</div>') +
        '</div>' +
        '<div class="card-body">' +
            '<div class="filename">' + esc(v.fileName) + '</div>' + info +
            '<div class="row-msg" id="msg-' + v.fileId + '"></div>' + actions +
        '</div></div>';
}

function render(){
    const q = document.getElementById('search').value.trim();
    const shown = videos.filter(v => matchesSearch(v, q));
    const unmatched = shown.filter(isUnmatched);
    const ready = shown.filter(isReady);
    const sent = shown.filter(isSent);

    const secU = document.getElementById('unmatchedSection');
    const secR = document.getElementById('readySection');
    const secS = document.getElementById('sentSection');

    secU.innerHTML = unmatched.length
        ? '<div class="section-title">⚠ Not identified — add SKU manually (' + unmatched.length + ')</div><div class="grid">' + unmatched.map(cardHTML).join('') + '</div>'
        : '';
    secR.innerHTML = ready.length
        ? '<div class="section-title">Ready to send (' + ready.length + ')</div><div class="grid">' + ready.map(cardHTML).join('') + '</div>'
        : (videos.length && !q ? '' : '');
    secS.innerHTML = sent.length
        ? '<div class="section-title">Sent with this tool (' + sent.length + ')</div><div class="grid">' + sent.map(cardHTML).join('') + '</div>'
        : '';

    if (!videos.length) secR.innerHTML = '<div class="empty">No videos loaded yet.</div>';
    updateStats();
}

function toggleSelect(fileId, on){ if (on) selected.add(fileId); else selected.delete(fileId); updateStats(); }
function toggleSelectAll(){
    const q = document.getElementById('search').value.trim();
    const ready = videos.filter(v => isReady(v) && matchesSearch(v, q));
    const allSel = ready.every(v => selected.has(v.fileId));
    ready.forEach(v => { if (allSel) selected.delete(v.fileId); else selected.add(v.fileId); });
    render();
}

function find(fileId){ return videos.find(v => v.fileId === fileId); }
function setMsg(fileId, text, kind){ const el = document.getElementById('msg-' + fileId); if (el){ el.className = 'row-msg ' + (kind||''); el.innerHTML = text; } }

async function sendOne(fileId, replace, skipConfirm){
    const v = find(fileId); if (!v || !v.product) return false;
    if (replace && !skipConfirm && !confirm('Remove the video already on "' + v.product.title + '" and replace it with this square one?')) return false;
    const card = document.getElementById('card-' + fileId);
    if (card) card.classList.add('busy');
    setMsg(fileId, '<span class="spinner" style="border-top-color:#2e7d32"></span> ' + (replace ? 'Replacing…' : 'Uploading & attaching…'), '');
    try {
        const r = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ action:'push', fileId: v.fileId, fileName: v.fileName, productId: v.product.id, replace: !!replace }) });
        const d = await r.json();
        if (!d.ok){ setMsg(fileId, '⚠️ ' + esc(d.error), 'err'); if (card) card.classList.remove('busy'); return false; }
        v.sentViaTool = true; v.videoId = d.videoId; v.sentAt = new Date().toISOString();
        if (replace) v.productHasVideo = false;
        selected.delete(fileId);
        render();
        return true;
    } catch(e){ setMsg(fileId, '⚠️ ' + esc(e.message), 'err'); if (card) card.classList.remove('busy'); return false; }
}

async function sendSelected(replace){
    const ids = Array.from(selected);
    if (!ids.length) return;
    if (replace && !confirm('Replace the existing video on ' + ids.length + ' product' + (ids.length===1?'':'s') + ' with the new square ones? The current videos will be removed.')) return;
    const bulk = document.getElementById('bulkBtn'); const bulkR = document.getElementById('bulkReplaceBtn');
    bulk.disabled = true; bulkR.disabled = true;
    const active = replace ? bulkR : bulk;
    const label = replace ? 'Replacing' : 'Sending';
    let done = 0;
    for (const id of ids){                       // sequential — avoids GitHub log conflicts
        active.textContent = label + ' ' + (done+1) + '/' + ids.length + '…';
        await sendOne(id, replace, true);
        done++;
    }
    setStatus('Finished ' + (replace ? 'replacing ' : 'sending ') + done + ' video' + (done===1?'':'s') + '.');
    render();
}

async function manualMatch(fileId){
    const v = find(fileId); if (!v) return;
    const input = document.getElementById('mf-' + fileId);
    const raw = (input.value||'').trim();
    if (!raw){ setMsg(fileId, 'Type a SKU or paste the product URL first.', 'err'); return; }
    setMsg(fileId, '<span class="spinner" style="border-top-color:#333"></span> Looking up & saving…', '');
    try {
        const r = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ action:'manual-match', fileId: v.fileId, fileName: v.fileName, sku: raw }) });
        const d = await r.json();
        if (!d.ok || !d.matched){ setMsg(fileId, '⚠️ No product found for "' + esc(raw) + '"', 'err'); return; }
        v.sku = d.sku || v.sku;
        v.matched = true; v.product = d.product; v.sentViaTool = d.sentViaTool; v.videoId = d.videoId; v.productHasVideo = d.productHasVideo;
        render();
    } catch(e){ setMsg(fileId, '⚠️ ' + esc(e.message), 'err'); }
}

async function undo(fileId){
    const v = find(fileId); if (!v || !v.product || !v.videoId) return;
    if (!confirm('Remove this video from "' + v.product.title + '" so you can resend it?')) return;
    const card = document.getElementById('card-' + fileId);
    if (card) card.classList.add('busy');
    setMsg(fileId, '<span class="spinner" style="border-top-color:#e65100"></span> Removing…', '');
    try {
        const r = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ action:'undo', productId: v.product.id, videoId: v.videoId }) });
        const d = await r.json();
        if (!d.ok){ setMsg(fileId, '⚠️ ' + esc(d.error), 'err'); if (card) card.classList.remove('busy'); return; }
        v.sentViaTool = false; v.videoId = null; v.sentAt = null;
        render();
    } catch(e){ setMsg(fileId, '⚠️ ' + esc(e.message), 'err'); if (card) card.classList.remove('busy'); }
}

async function markDone(fileId){
    const v = find(fileId); if (!v || !v.product) return;
    setMsg(fileId, '<span class="spinner" style="border-top-color:#333"></span> Marking as done…', '');
    try {
        const r = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ action:'mark-done', fileId: v.fileId, fileName: v.fileName, sku: v.sku, productId: v.product.id }) });
        const d = await r.json();
        if (!d.ok){ setMsg(fileId, '⚠️ ' + esc(d.error || 'Could not mark as done'), 'err'); return; }
        v.sentViaTool = true; v.manual = true; v.videoId = d.videoId || null; v.sentAt = d.sentAt || new Date().toISOString();
        render();
    } catch(e){ setMsg(fileId, '⚠️ ' + esc(e.message), 'err'); }
}

async function unmarkDone(fileId){
    const v = find(fileId); if (!v) return;
    if (!confirm('Unmark this as done? Nothing is removed from Shopify — it just goes back to the ready list.')) return;
    setMsg(fileId, '<span class="spinner" style="border-top-color:#333"></span> Unmarking…', '');
    try {
        const r = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ action:'unmark-done', fileId: v.fileId, sku: v.sku }) });
        const d = await r.json();
        if (!d.ok){ setMsg(fileId, '⚠️ ' + esc(d.error || 'Could not unmark'), 'err'); return; }
        v.sentViaTool = false; v.manual = false; v.videoId = null; v.sentAt = null;
        render();
    } catch(e){ setMsg(fileId, '⚠️ ' + esc(e.message), 'err'); }
}

/* ===================== SEND TO ETSY TAB ===================== */
const ETSY_API = '/api/etsy';
let etsyVideos = [];
let etsyRegistry = {};          // SKU -> [{listing_id,title,state,image}]
let etsyLog = {};               // listing_id -> video_id pushed by this tool
const etsySelected = new Set();

function switchVTab(which){
    document.getElementById('shopifyTab').style.display = which === 'etsy' ? 'none' : '';
    document.getElementById('etsyTab').style.display = which === 'etsy' ? '' : 'none';
    document.getElementById('tabShopifyBtn').className = 'btn ' + (which === 'etsy' ? 'btn-light' : 'btn-primary');
    document.getElementById('tabEtsyBtn').className = 'btn ' + (which === 'etsy' ? 'btn-primary' : 'btn-light');
}

function etsySetStatus(m){ document.getElementById('etsyStatus').innerHTML = m; }
function etsyFind(id){ return etsyVideos.find(v => v.fileId === id); }
function etsySetMsg(id, t, k){ const el = document.getElementById('emsg-' + id); if (el){ el.className = 'row-msg ' + (k || ''); el.innerHTML = t; } }

// Match a video filename to a registry SKU. SKUs can contain spaces (e.g. "CYANOTYPE BROWN"), and filenames end in
// different ways (" SQ", " ss", "(1)"), so: clean the name, try an exact key, else the LONGEST key the name starts with
// (on a word boundary, so "LIVLND2" never steals "LIVLND20 …").
function etsyClean(fileName){ return String(fileName || '').replace(/\.[^.]+$/, '').replace(/\s*\(\d+\)\s*$/, '').trim().toUpperCase(); }
function etsyMatch(fileName){
    const clean = etsyClean(fileName);
    if (etsyRegistry[clean]) return { sku: clean, listings: etsyRegistry[clean].slice() };
    let best = null;
    for (const K in etsyRegistry){ if (clean === K || clean.indexOf(K + ' ') === 0){ if (!best || K.length > best.length) best = K; } }
    if (best) return { sku: best, listings: etsyRegistry[best].slice() };
    return { sku: clean, listings: [] };
}
function lev(a, b){                                   // edit distance, for the "closest listing" suggestions
    a = String(a); b = String(b); const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
    let prev = []; for (let j = 0; j <= n; j++) prev[j] = j;
    for (let i = 1; i <= m; i++){ let cur = [i];
        for (let j = 1; j <= n; j++){ const cost = a[i-1] === b[j-1] ? 0 : 1; cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+cost); }
        prev = cur;
    }
    return prev[n];
}

function etsyState(v){
    const total = v.listings.length;
    if (!total) return { kind: 'not', sent: 0, total: 0 };
    const sent = v.listings.filter(l => etsyLog[String(l.listing_id)]).length;
    return { kind: sent >= total ? 'sent' : 'ready', sent: sent, total: total };
}

async function loadEtsy(){
    const btn = document.getElementById('etsyLoadBtn'); btn.disabled = true;
    document.getElementById('etsyConn').innerHTML = '';
    etsySetStatus('<span class="spinner" style="border-top-color:#333"></span> Loading videos and matching Etsy listings…');
    try {
        let conn = false;
        try { const cs = await (await fetch(ETSY_API + '?action=status')).json(); conn = !!(cs && cs.connected); } catch(e){}
        if (!conn){
            document.getElementById('etsyConn').innerHTML =
                '<div class="empty">Etsy isn’t connected.<br><br>' +
                '<button class="btn btn-primary" onclick="location.href=\'/api/etsy?action=auth\'">Connect Etsy</button>' +
                '<div class="muted" style="margin-top:10px">After connecting you’ll land on the Etsy tool — come back here and press <b>Load videos</b>.</div></div>';
            etsySetStatus(''); btn.disabled = false; return;
        }
        const [ld, rd, gd] = await Promise.all([
            fetch(API + '?action=list').then(r => r.json()),
            fetch(ETSY_API + '?action=etsy-reg-get').then(r => r.json()),
            fetch(ETSY_API + '?action=etsy-video-log-get').then(r => r.json())
        ]);
        if (!ld.ok){ etsySetStatus('⚠️ ' + esc(ld.error || 'Could not load videos')); btn.disabled = false; return; }
        etsyRegistry = (rd && rd.registry) || {};
        etsyLog = {};
        ((gd && gd.log) || []).forEach(e => { if (e && e.listing_id) etsyLog[String(e.listing_id)] = e.video_id || null; });
        etsyVideos = (ld.videos || []).map(v => {
            const m = etsyMatch(v.fileName);
            return { fileId: v.fileId, fileName: v.fileName, thumbnail: v.thumbnail, sku: m.sku, listings: m.listings, closest: null };
        });
        etsySelected.clear();
        const done = etsyVideos.filter(v => etsyState(v).kind === 'sent').length;
        etsySetStatus('Loaded <b>' + etsyVideos.length + '</b> videos · <b>' + Object.keys(etsyRegistry).length + '</b> SKUs in the Etsy registry' + (done ? (' · ' + done + ' already on Etsy (hidden)') : '') + '.');
        renderEtsy();
    } catch(e){ etsySetStatus('⚠️ ' + esc(e.message)); }
    btn.disabled = false;
}

function etsyRefresh(){
    const btn = document.getElementById('etsyRefreshBtn'); btn.disabled = true;
    etsySetStatus('<span class="spinner" style="border-top-color:#333"></span> Reading your Etsy listings and rebuilding the SKU list… this can take a moment.');
    fetch(ETSY_API + '?action=etsy-reg-refresh', { method:'POST' }).then(r => r.json()).then(d => {
        btn.disabled = false;
        if (!d.ok){ etsySetStatus('⚠️ ' + esc(d.error || 'Refresh failed')); return; }
        etsySetStatus('Registry updated: <b>' + d.skus + '</b> SKUs across <b>' + d.listings + '</b> listings (read ' + (d.scanned != null ? d.scanned : '?') + ' from Etsy). Reloading…');
        loadEtsy();
    }).catch(e => { btn.disabled = false; etsySetStatus('⚠️ ' + esc(e.message)); });
}

function etsyImg(url, cls){
    return url ? '<img class="' + cls + '" src="' + esc(url) + '" loading="lazy" onerror="this.style.visibility=\'hidden\'">'
               : '<span class="' + cls + ' ph"></span>';
}

function etsyCard(v){
    const st = etsyState(v);
    if (st.kind === 'sent') return '';   // already on Etsy — don't show it anymore
    if (st.kind === 'not'){
        let picker;
        if (v.closest){
            picker = v.closest.length
                ? '<div class="muted" style="margin-top:8px">Closest listings — click the right one:</div><div class="closest-grid">' +
                  v.closest.map((c, ix) => etsyClosestCard(v.fileId, c, ix)).join('') + '</div>'
                : '<div class="warn" style="margin-top:8px">No close matches found.</div>';
        } else {
            picker = '<button class="btn btn-light" style="margin-top:8px" onclick="etsyFindClosest(\'' + v.fileId + '\')">Find closest listing</button>';
        }
        return '<div class="card unmatched" id="ecard-' + v.fileId + '">' +
            '<div class="thumb">' + etsyImg(v.thumbnail, 'vimg') + '<div class="play">▶</div></div>' +
            '<div class="card-body"><div class="filename">' + esc(v.fileName) + '</div>' + skuBadge(v.sku) +
            '<div class="warn">⚠ No matching Etsy listing</div>' +
            '<div class="row-msg" id="emsg-' + v.fileId + '"></div>' + picker + '</div></div>';
    }
    // READY: show the video and the Etsy listing side by side for a final check
    const first = v.listings[0] || {};
    const more = v.listings.length > 1 ? '<div class="vmore">Sends to all ' + v.listings.length + ' listings with this SKU</div>' : '';
    const sel = etsySelected.has(v.fileId) ? 'checked' : '';
    return '<div class="card matched" id="ecard-' + v.fileId + '"><div class="card-body">' +
        '<div class="vpair">' +
            '<div class="vp" style="position:relative"><div class="checkwrap"><input type="checkbox" ' + sel + ' onchange="etsyToggleSelect(\'' + v.fileId + '\', this.checked)"></div>' + etsyImg(v.thumbnail, 'vimg') + '<div class="vplabel">your video</div></div>' +
            '<div class="vp">' + etsyImg(first.image, 'vimg') + '<div class="vplabel">etsy listing</div></div>' +
        '</div>' + more +
        '<div class="filename">' + esc(v.fileName) + '</div>' + skuBadge(v.sku) +
        '<div class="ptitle">' + esc(first.title || '') + '</div>' +
        '<div class="row-msg" id="emsg-' + v.fileId + '"></div>' +
        '<div class="card-actions"><button class="btn btn-green" onclick="etsySendOne(\'' + v.fileId + '\')">Send to Etsy (' + v.listings.length + ')</button></div>' +
        '</div></div>';
}

function etsyClosestCard(fileId, c, ix){
    const first = c.listings[0] || {};
    const extra = c.listings.length > 1 ? ' · ' + c.listings.length + ' listings' : '';
    return '<div class="closest-card" onclick="etsyPickClosest(\'' + fileId + '\', ' + ix + ')">' +
        etsyImg(first.image, 'cc-img') +
        '<div class="cc-sku">' + esc(c.sku) + '</div>' +
        '<div class="cc-title">' + esc(first.title || '') + extra + '</div></div>';
}

function etsyFindClosest(fileId){
    const v = etsyFind(fileId); if (!v) return;
    const keys = Object.keys(etsyRegistry);
    const scored = keys.map(k => ({ k: k, d: lev(v.sku, k) })).sort((a, b) => a.d - b.d).slice(0, 8);
    v.closest = scored.map(s => ({ sku: s.k, listings: etsyRegistry[s.k] }));
    renderEtsy();
}
function etsyPickClosest(fileId, ix){
    const v = etsyFind(fileId); if (!v) return;
    const c = (v.closest || [])[ix]; if (!c) return;
    v.sku = c.sku; v.listings = c.listings.slice(); v.closest = null;
    renderEtsy();
}

function etsyMatchesSearch(v, q){ return !q || (v.sku||'').toLowerCase().includes(q) || (v.fileName||'').toLowerCase().includes(q); }

function renderEtsy(){
    const q = document.getElementById('etsySearch').value.trim().toLowerCase();
    const shown = etsyVideos.filter(v => etsyMatchesSearch(v, q));
    const ready = shown.filter(v => etsyState(v).kind === 'ready');
    const not = shown.filter(v => etsyState(v).kind === 'not');
    document.getElementById('etsyReadySection').innerHTML = ready.length ? '<div class="section-title">Ready to send (' + ready.length + ')</div><div class="grid">' + ready.map(etsyCard).join('') + '</div>' : '';
    document.getElementById('etsyNotSection').innerHTML = not.length ? '<div class="section-title">⚠ Not on Etsy (' + not.length + ')</div><div class="grid">' + not.map(etsyCard).join('') + '</div>' : '';
    if (!etsyVideos.length) document.getElementById('etsyReadySection').innerHTML = '<div class="empty">No videos loaded yet.</div>';
    etsyUpdateStats();
}

function etsyUpdateStats(){
    const r = etsyVideos.filter(v => etsyState(v).kind === 'ready').length;
    const n = etsyVideos.filter(v => etsyState(v).kind === 'not').length;
    document.getElementById('etsyStats').innerHTML =
        '<span class="chip matched">' + r + ' ready</span>' +
        '<span class="chip unmatched">' + n + ' not on Etsy</span>';
    const b = document.getElementById('etsyBulkBtn');
    b.textContent = 'Send selected (' + etsySelected.size + ')';
    b.disabled = etsySelected.size === 0;
}

function etsyToggleSelect(id, on){ if (on) etsySelected.add(id); else etsySelected.delete(id); etsyUpdateStats(); }
function etsyToggleSelectAll(){
    const q = document.getElementById('etsySearch').value.trim().toLowerCase();
    const ready = etsyVideos.filter(v => etsyState(v).kind === 'ready' && etsyMatchesSearch(v, q));
    const all = ready.every(v => etsySelected.has(v.fileId));
    ready.forEach(v => { if (all) etsySelected.delete(v.fileId); else etsySelected.add(v.fileId); });
    renderEtsy();
}

// Send ONE video to EVERY Etsy listing that shares its SKU (the backend applies the replace rule per listing).
async function etsySendOne(fileId, skipRender){
    const v = etsyFind(fileId); if (!v || !v.listings.length) return false;
    const card = document.getElementById('ecard-' + fileId); if (card) card.classList.add('busy');
    let okAll = true, done = 0; const total = v.listings.length;
    for (let i = 0; i < v.listings.length; i++){
        const l = v.listings[i];
        etsySetMsg(fileId, '<span class="spinner" style="border-top-color:#2e7d32"></span> Sending ' + (done+1) + ' of ' + total + '…', '');
        try {
            const r = await fetch(ETSY_API + '?action=etsy-video-send', { method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ fileId: v.fileId, fileName: v.fileName, sku: v.sku, listing_id: l.listing_id }) });
            const d = await r.json();
            if (!d.ok){ okAll = false; etsySetMsg(fileId, '⚠️ ' + esc(d.error), 'err'); }
            else { etsyLog[String(l.listing_id)] = d.video_id || 'sent'; done++; }
        } catch(e){ okAll = false; etsySetMsg(fileId, '⚠️ ' + esc(e.message), 'err'); }
    }
    if (card) card.classList.remove('busy');
    etsySelected.delete(fileId);
    if (!skipRender) renderEtsy();   // when fully sent, the card disappears
    return okAll;
}

async function etsySendSelected(){
    const ids = Array.from(etsySelected); if (!ids.length) return;
    const b = document.getElementById('etsyBulkBtn'); b.disabled = true;
    let done = 0;
    for (let i = 0; i < ids.length; i++){ b.textContent = 'Sending ' + (done+1) + '/' + ids.length + '…'; await etsySendOne(ids[i], true); done++; }
    etsySetStatus('Finished sending ' + done + ' video' + (done === 1 ? '' : 's') + ' to Etsy.');
    renderEtsy();
}
</script>
