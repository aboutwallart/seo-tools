<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Manager Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        h1 { font-size: 32px; font-weight: 600; margin-bottom: 4px; color: #1a1a1a; }

        .version { color: #999999; font-size: 13px; margin-bottom: 30px; }

        .stats {
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 30px;
            font-size: 14px;
            color: #666666;
        }

        .stats strong { color: #1a1a1a; }

        .loading { text-align: center; padding: 60px 20px; color: #666666; font-size: 14px; }

        /* IDEA CARD */
        .idea-card {
            background: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .idea-card.green { border-color: #66bb6a; background: #f1f8f4; }
        .idea-card.yellow { border-color: #ffa726; background: #fff8f1; }
        .idea-card.red { border-color: #ef5350; background: #fff1f1; }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .card-number { font-size: 12px; font-weight: 600; color: #999999; }

        .status-badge {
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-green { background: #66bb6a; color: #ffffff; }
        .badge-yellow { background: #ffa726; color: #ffffff; }
        .badge-red { background: #ef5350; color: #ffffff; }

        .keyword { font-size: 18px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
        .title { font-size: 15px; color: #333333; margin-bottom: 8px; line-height: 1.5; }
        .perspective { font-size: 13px; color: #666666; font-style: italic; margin-bottom: 16px; }

        /* CONFLICT WARNING */
        .conflict-warning {
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 13px;
        }

        .conflict-warning.yellow {
            background: #fff3e0;
            border: 1px solid #ffa726;
            color: #ef6c00;
        }

        .conflict-warning.red {
            background: #ffebee;
            border: 1px solid #ef5350;
            color: #c62828;
        }

        .conflict-warning .conflict-label {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .conflict-warning .conflict-keyword {
            font-size: 13px;
            margin-bottom: 4px;
        }

        .conflict-warning .conflict-url {
            font-size: 12px;
        }

        .conflict-warning .conflict-url a {
            color: inherit;
            text-decoration: underline;
        }

        /* KEYWORD OVERRIDE */
        .override-section {
            background: #f5f5f5;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .override-section label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #1a1a1a;
            margin-bottom: 6px;
        }

        .override-section input {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .override-section input:focus {
            outline: none;
            border-color: #1a1a1a;
        }

        .btn-regenerate {
            background: #ffffff;
            color: #1a1a1a;
            border: 1px solid #1a1a1a;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-regenerate:hover { background: #1a1a1a; color: #ffffff; }

        .btn-regenerate:disabled {
            background: #f5f5f5;
            color: #cccccc;
            border-color: #e0e0e0;
            cursor: not-allowed;
        }

        /* SUGGESTED TITLE */
        .suggested-title {
            background: #e3f2fd;
            border: 1px solid #2196F3;
            border-radius: 6px;
            padding: 12px;
            margin-top: 12px;
            font-size: 13px;
            color: #1565C0;
        }

        .suggested-title strong { display: block; margin-bottom: 4px; }

        /* TABS */
        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-btn {
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            cursor: pointer;
            color: #666666;
            transition: all 0.2s ease;
        }

        .tab-btn:hover { color: #1a1a1a; }

        .tab-btn.active {
            color: #1a1a1a;
            border-bottom-color: #1a1a1a;
            font-weight: 600;
        }

        .tab-count {
            display: inline-block;
            background: #e0e0e0;
            color: #666666;
            border-radius: 12px;
            padding: 1px 8px;
            font-size: 12px;
            margin-left: 6px;
        }

        .tab-btn.active .tab-count {
            background: #1a1a1a;
            color: #ffffff;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999999;
            font-size: 14px;
        }

        /* UNDO BUTTON */
        .btn-undo {
            background: #ffffff;
            color: #ef5350;
            border: 1px solid #ef5350;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-left: 10px;
        }

        .btn-undo:hover {
            background: #ef5350;
            color: #ffffff;
        }

        .card-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* SAVING INDICATOR */
        .saving-indicator {
            font-size: 12px;
            color: #66bb6a;
            margin-left: 10px;
        }

        .saving-indicator.saving { color: #ffa726; }
        .saving-indicator.error { color: #ef5350; }
        .btn-mark {
            background: #2196F3;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 180px;
        }

        .btn-mark:hover { background: #1976D2; }
        .btn-mark.marked { background: #66bb6a; }
        .btn-mark.marked:hover { background: #4caf50; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Blog Manager Tool</h1>
        <p class="version">v1.6</p>

        <div class="stats" id="stats">Loading blog ideas...</div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('ideas')" id="tab-ideas">
                Blog Ideas <span class="tab-count" id="count-ideas">0</span>
            </button>
            <button class="tab-btn" onclick="switchTab('towrite')" id="tab-towrite">
                To Write <span class="tab-count" id="count-towrite">0</span>
            </button>
        </div>

        <div class="tab-content active" id="panel-ideas">
            <div id="ideas-container">
                <div class="loading">🔄 Loading blog ideas...</div>
            </div>
        </div>

        <div class="tab-content" id="panel-towrite">
            <div id="towrite-container">
                <div class="empty-state">No blogs marked for writing yet.</div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // DATA
        // ============================================
        let blogIdeas = [];
        let markedIdeas = new Set(); // indexes marked for writing

        // ============================================
        // TAB SWITCHING
        // ============================================
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(p => p.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.getElementById(`panel-${tab}`).classList.add('active');
        }

        function updateTabCounts() {
            const total = blogIdeas.length;
            const marked = markedIdeas.size;
            document.getElementById('count-ideas').textContent = total - marked;
            document.getElementById('count-towrite').textContent = marked;
        }

        // ============================================
        // CSV PARSER
        // ============================================
        function parseCSV(text) {
            const lines = text.split('\n');
            const headers = parseCSVLine(lines[0]);
            const rows = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim().replace(/\r/g, '');
                if (!line) continue;
                const cols = parseCSVLine(line);
                const row = {};
                headers.forEach((h, idx) => { row[h.trim()] = cols[idx] || ''; });
                rows.push(row);
            }
            return rows;
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') { inQuotes = !inQuotes; }
                else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
                else { current += char; }
            }
            result.push(current.trim());
            return result;
        }

        // ============================================
        // SLUG GENERATOR
        // ============================================
        function titleToSlug(title) {
            return title
                .toLowerCase()
                .replace(/[^a-z0-9\s-]/g, '')  // remove special chars
                .replace(/\s+/g, '-')            // spaces to hyphens
                .replace(/-+/g, '-')             // collapse multiple hyphens
                .replace(/^-|-$/g, '');          // trim hyphens
        }

        function generateUrl(title) {
            const slug = titleToSlug(title);
            return `https://aboutwallart.com/blogs/news-articles-home-decor-inspiration/${slug}`;
        }

        // ============================================
        // LOAD DATA FROM GITHUB CSV
        // ============================================
        async function loadData() {
            try {
                const csvUrl = 'https://raw.githubusercontent.com/aboutwallart/seo-tools/main/data/blog_ideas.csv';
                const response = await fetch(csvUrl);
                if (!response.ok) throw new Error(`Failed to fetch CSV: ${response.status}`);

                const csvText = await response.text();
                const rows = parseCSV(csvText);

                blogIdeas = rows.map((row, index) => ({
                    index: index,
                    keyword: row['Keyword'] || '',
                    title: row['Blog Post Title'] || '',
                    perspective: row['Perspective'] || '',
                    cannibalization: row['CANNIBALIZATION'] || 'NO CONFLICT',
                    conflictingKeyword: row['CONFLICTING KEYWORD'] || '',
                    conflictingUrl: row['CONFLICTING BLOG URL'] || '',
                    currentTitle: row['Blog Post Title'] || '',
                    currentKeyword: row['Keyword'] || ''
                }));

                const green = blogIdeas.filter(i => i.cannibalization === 'NO CONFLICT').length;
                const yellow = blogIdeas.filter(i => i.cannibalization === 'CAUTION').length;
                const red = blogIdeas.filter(i => i.cannibalization === 'DANGER').length;

                document.getElementById('stats').innerHTML = `
                    <strong>Loaded:</strong> ${blogIdeas.length} blog ideas &nbsp;|&nbsp;
                    🟢 ${green} No Conflict &nbsp;|&nbsp;
                    🟡 ${yellow} Caution &nbsp;|&nbsp;
                    🔴 ${red} Danger
                `;

                updateTabCounts();
                displayIdeas();

            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('stats').innerHTML = `<strong>Error:</strong> ${error.message}`;
                document.getElementById('ideas-container').innerHTML = `<div class="loading">❌ Could not load blog ideas.</div>`;
            }
        }

        // ============================================
        // DISPLAY IDEAS (Tab 1 - unmarked only)
        // ============================================
        function displayIdeas() {
            const container = document.getElementById('ideas-container');
            const visible = blogIdeas.filter(idea => !markedIdeas.has(idea.index));

            if (visible.length === 0) {
                container.innerHTML = `<div class="empty-state">All ideas have been marked for writing! 🎉</div>`;
                return;
            }

            let html = '';
            visible.forEach(idea => {
                html += buildIdeaCard(idea, false);
            });
            container.innerHTML = html;
        }

        // ============================================
        // DISPLAY TO WRITE (Tab 2 - marked only)
        // ============================================
        function displayToWrite() {
            const container = document.getElementById('towrite-container');
            const marked = blogIdeas.filter(idea => markedIdeas.has(idea.index));

            if (marked.length === 0) {
                container.innerHTML = `<div class="empty-state">No blogs marked for writing yet.</div>`;
                return;
            }

            let html = '';
            marked.forEach(idea => {
                html += buildIdeaCard(idea, true);
            });
            container.innerHTML = html;
        }

        // ============================================
        // BUILD CARD HTML
        // ============================================
        function buildIdeaCard(idea, isInToWrite) {
            const level = idea.cannibalization;
            const cardClass = level === 'NO CONFLICT' ? 'green' : level === 'CAUTION' ? 'yellow' : 'red';
            const badgeClass = level === 'NO CONFLICT' ? 'badge-green' : level === 'CAUTION' ? 'badge-yellow' : 'badge-red';
            const showOverride = (level === 'CAUTION' || level === 'DANGER') && !isInToWrite;
            const index = idea.index;

            return `
                <div class="idea-card ${cardClass}" id="card-${index}">
                    <div class="card-header">
                        <span class="card-number">#${index + 1}</span>
                        <span class="status-badge ${badgeClass}">${level}</span>
                    </div>

                    <div class="keyword" id="keyword-display-${index}">${idea.currentKeyword}</div>
                    <div class="title" id="title-display-${index}">${idea.currentTitle}</div>
                    <div class="perspective">${idea.perspective}</div>

                    ${showOverride ? `
                        <div class="conflict-warning ${cardClass}">
                            <div class="conflict-label">
                                ${level === 'DANGER' ? '🔴 Cannibalization Danger' : '🟡 Caution - Similar Intent'}
                            </div>
                            <div class="conflict-keyword">
                                <strong>Conflicting Keyword:</strong> ${idea.conflictingKeyword}
                            </div>
                            ${idea.conflictingUrl ? `
                                <div class="conflict-url">
                                    <strong>Conflicting Blog:</strong>
                                    <a href="${idea.conflictingUrl}" target="_blank">${idea.conflictingUrl}</a>
                                </div>
                            ` : ''}
                        </div>

                        <div class="override-section">
                            <label>Change Keyword:</label>
                            <input
                                type="text"
                                id="new-keyword-${index}"
                                value="${idea.currentKeyword}"
                                placeholder="Enter new keyword"
                            >
                            <button
                                class="btn-regenerate"
                                onclick="generateNewTitle(${index})"
                                id="regen-btn-${index}"
                            >
                                Generate New Title
                            </button>
                            <div id="suggested-title-${index}"></div>
                        </div>
                    ` : ''}

                    <div class="card-actions">
                        ${!isInToWrite ? `
                            <button
                                class="btn-mark"
                                onclick="markForWriting(${index})"
                                id="mark-btn-${index}"
                            >
                                Mark for Writing
                            </button>
                        ` : `
                            <button class="btn-mark marked" disabled>✓ To Write Blog</button>
                            <button class="btn-undo" onclick="undoMark(${index})">↩ Undo</button>
                            <span class="saving-indicator" id="save-status-${index}">✅ Saved to registry</span>
                        `}
                    </div>
                </div>
            `;
        }

        // ============================================
        // MARK FOR WRITING → save to registry
        // ============================================
        async function markForWriting(index) {
            const idea = blogIdeas[index];
            const title = idea.currentTitle;
            const keyword = idea.currentKeyword;
            const url = generateUrl(title);

            // Move to marked set
            markedIdeas.add(index);
            updateTabCounts();
            displayIdeas();
            displayToWrite();

            // Switch to To Write tab
            switchTab('towrite');

            // Save to registry via API
            const saveStatus = document.getElementById(`save-status-${index}`);
            if (saveStatus) {
                saveStatus.textContent = '⏳ Saving to registry...';
                saveStatus.className = 'saving-indicator saving';
            }

            try {
                const response = await fetch('/api/blogs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keyword, url })
                });

                const data = await response.json();

                if (saveStatus) {
                    if (data.success) {
                        saveStatus.textContent = '✅ Saved to registry';
                        saveStatus.className = 'saving-indicator';
                    } else {
                        saveStatus.textContent = '❌ Save failed: ' + (data.error || 'Unknown error');
                        saveStatus.className = 'saving-indicator error';
                    }
                }

            } catch (error) {
                console.error('Error saving to registry:', error);
                if (saveStatus) {
                    saveStatus.textContent = '❌ Save failed: ' + error.message;
                    saveStatus.className = 'saving-indicator error';
                }
            }
        }

        // ============================================
        // UNDO MARK → delete from registry
        // ============================================
        async function undoMark(index) {
            const idea = blogIdeas[index];
            const keyword = idea.currentKeyword;

            // Move card back to Blog Ideas tab immediately
            markedIdeas.delete(index);
            updateTabCounts();
            displayIdeas();
            displayToWrite();

            // Delete from registry
            try {
                const response = await fetch('/api/blogs', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keyword })
                });

                const data = await response.json();
                if (!data.success) {
                    console.error('Failed to remove from registry:', data.error);
                }
            } catch (error) {
                console.error('Error removing from registry:', error);
            }
        }

        // ============================================
        // GENERATE NEW TITLE (AI)
        // ============================================
        async function generateNewTitle(index) {
            const newKeyword = document.getElementById(`new-keyword-${index}`).value.trim();
            if (!newKeyword) { alert('Please enter a keyword first'); return; }

            const btn = document.getElementById(`regen-btn-${index}`);
            btn.disabled = true;
            btn.textContent = 'Generating...';

            try {
                const response = await fetch('/api/claude', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: `Original blog title: "${blogIdeas[index].title}"

New keyword: "${newKeyword}"

Generate a new blog title that:
1. Uses the new keyword naturally
2. Keeps the same style and tone as the original title
3. Maintains the same question format or structure if the original has one

Return ONLY the new title, nothing else. No explanation, no punctuation around it.`
                    })
                });

                if (!response.ok) throw new Error(`API error: ${response.status}`);

                const data = await response.json();
                const newTitle = (data.response || '').trim().replace(/^["']|["']$/g, '');
                if (!newTitle) throw new Error('Empty response from API');

                document.getElementById(`keyword-display-${index}`).textContent = newKeyword;
                document.getElementById(`title-display-${index}`).textContent = newTitle;

                blogIdeas[index].currentKeyword = newKeyword;
                blogIdeas[index].currentTitle = newTitle;

                document.getElementById(`suggested-title-${index}`).innerHTML = `
                    <div class="suggested-title">
                        <strong>✨ New Title Generated:</strong>
                        ${newTitle}
                    </div>
                `;

                btn.textContent = 'Regenerate Title';

            } catch (error) {
                console.error('Error generating title:', error);
                alert('Error generating title: ' + error.message);
                btn.textContent = 'Regenerate Title';
            } finally {
                btn.disabled = false;
            }
        }

        // ============================================
        // INITIALIZE
        // ============================================
        loadData();
    </script>
</body>
</html>
