<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Manager Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        h1 { font-size: 32px; font-weight: 600; margin-bottom: 4px; color: #1a1a1a; }

        .version { color: #999999; font-size: 13px; margin-bottom: 30px; }

        .stats {
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 30px;
            font-size: 14px;
            color: #666666;
        }

        .stats strong { color: #1a1a1a; }

        .loading { text-align: center; padding: 60px 20px; color: #666666; font-size: 14px; }

        /* IDEA CARD */
        .idea-card {
            background: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .idea-card.green { border-color: #66bb6a; background: #f1f8f4; }
        .idea-card.yellow { border-color: #ffa726; background: #fff8f1; }
        .idea-card.red { border-color: #ef5350; background: #fff1f1; }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .card-number { font-size: 12px; font-weight: 600; color: #999999; }

        .status-badge {
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-green { background: #66bb6a; color: #ffffff; }
        .badge-yellow { background: #ffa726; color: #ffffff; }
        .badge-red { background: #ef5350; color: #ffffff; }

        .keyword { font-size: 18px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
        .title { font-size: 15px; color: #333333; margin-bottom: 8px; line-height: 1.5; }
        .perspective { font-size: 13px; color: #666666; font-style: italic; margin-bottom: 16px; }

        /* CONFLICT WARNING */
        .conflict-warning {
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 13px;
        }

        .conflict-warning.yellow {
            background: #fff3e0;
            border: 1px solid #ffa726;
            color: #ef6c00;
        }

        .conflict-warning.red {
            background: #ffebee;
            border: 1px solid #ef5350;
            color: #c62828;
        }

        .conflict-warning .conflict-label {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .conflict-warning .conflict-keyword {
            font-size: 13px;
            margin-bottom: 4px;
        }

        .conflict-warning .conflict-url {
            font-size: 12px;
        }

        .conflict-warning .conflict-url a {
            color: inherit;
            text-decoration: underline;
        }

        /* KEYWORD OVERRIDE */
        .override-section {
            background: #f5f5f5;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .override-section label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #1a1a1a;
            margin-bottom: 6px;
        }

        .override-section input {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .override-section input:focus {
            outline: none;
            border-color: #1a1a1a;
        }

        .btn-regenerate {
            background: #ffffff;
            color: #1a1a1a;
            border: 1px solid #1a1a1a;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-regenerate:hover { background: #1a1a1a; color: #ffffff; }

        .btn-regenerate:disabled {
            background: #f5f5f5;
            color: #cccccc;
            border-color: #e0e0e0;
            cursor: not-allowed;
        }

        /* SUGGESTED TITLE */
        .suggested-title {
            background: #e3f2fd;
            border: 1px solid #2196F3;
            border-radius: 6px;
            padding: 12px;
            margin-top: 12px;
            font-size: 13px;
            color: #1565C0;
        }

        .suggested-title strong { display: block; margin-bottom: 4px; }

        /* MARK FOR WRITING BUTTON */
        .btn-mark {
            background: #2196F3;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 180px;
        }

        .btn-mark:hover { background: #1976D2; }
        .btn-mark.marked { background: #66bb6a; }
        .btn-mark.marked:hover { background: #4caf50; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Blog Manager Tool</h1>
        <p class="version">v1.4</p>

        <div class="stats" id="stats">Loading blog ideas...</div>

        <div id="ideas-container">
            <div class="loading">🔄 Loading blog ideas...</div>
        </div>
    </div>

    <script>
        // ============================================
        // DATA
        // ============================================
        let blogIdeas = [];
        let markedIdeas = new Set();

        // ============================================
        // CSV PARSER
        // ============================================
        function parseCSV(text) {
            const lines = text.split('\n');
            const headers = parseCSVLine(lines[0]);
            const rows = [];

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim().replace(/\r/g, '');
                if (!line) continue;
                const cols = parseCSVLine(line);
                const row = {};
                headers.forEach((h, idx) => {
                    row[h.trim()] = cols[idx] || '';
                });
                rows.push(row);
            }
            return rows;
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result;
        }

        // ============================================
        // LOAD DATA FROM GITHUB CSV
        // ============================================
        async function loadData() {
            try {
                const csvUrl = 'https://raw.githubusercontent.com/aboutwallart/seo-tools/main/data/blog_ideas.csv';
                const response = await fetch(csvUrl);

                if (!response.ok) {
                    throw new Error(`Failed to fetch CSV: ${response.status}`);
                }

                const csvText = await response.text();
                const rows = parseCSV(csvText);

                blogIdeas = rows.map((row, index) => ({
                    index: index,
                    keyword: row['Keyword'] || '',
                    title: row['Blog Post Title'] || '',
                    perspective: row['Perspective'] || '',
                    cannibalization: row['CANNIBALIZATION'] || 'NO CONFLICT',
                    conflictingKeyword: row['CONFLICTING KEYWORD'] || '',
                    conflictingUrl: row['CONFLICTING BLOG URL'] || '',
                    currentTitle: row['Blog Post Title'] || '',
                    currentKeyword: row['Keyword'] || ''
                }));

                // Stats
                const green = blogIdeas.filter(i => i.cannibalization === 'NO CONFLICT').length;
                const yellow = blogIdeas.filter(i => i.cannibalization === 'CAUTION').length;
                const red = blogIdeas.filter(i => i.cannibalization === 'DANGER').length;

                document.getElementById('stats').innerHTML = `
                    <strong>Loaded:</strong> ${blogIdeas.length} blog ideas &nbsp;|&nbsp;
                    🟢 ${green} No Conflict &nbsp;|&nbsp;
                    🟡 ${yellow} Caution &nbsp;|&nbsp;
                    🔴 ${red} Danger
                `;

                displayIdeas();

            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('stats').innerHTML = `<strong>Error:</strong> ${error.message}`;
                document.getElementById('ideas-container').innerHTML = `
                    <div class="loading">❌ Could not load blog ideas. Check console for details.</div>
                `;
            }
        }

        // ============================================
        // DISPLAY IDEAS
        // ============================================
        function displayIdeas() {
            const container = document.getElementById('ideas-container');
            let html = '';

            blogIdeas.forEach((idea, index) => {
                const level = idea.cannibalization;
                const cardClass = level === 'NO CONFLICT' ? 'green' : level === 'CAUTION' ? 'yellow' : 'red';
                const badgeClass = level === 'NO CONFLICT' ? 'badge-green' : level === 'CAUTION' ? 'badge-yellow' : 'badge-red';
                const isMarked = markedIdeas.has(index);
                const showOverride = level === 'CAUTION' || level === 'DANGER';

                html += `
                    <div class="idea-card ${cardClass}" id="card-${index}">
                        <div class="card-header">
                            <span class="card-number">#${index + 1}</span>
                            <span class="status-badge ${badgeClass}">${level}</span>
                        </div>

                        <div class="keyword" id="keyword-display-${index}">${idea.currentKeyword}</div>
                        <div class="title" id="title-display-${index}">${idea.currentTitle}</div>
                        <div class="perspective">${idea.perspective}</div>

                        ${showOverride ? `
                            <div class="conflict-warning ${cardClass}">
                                <div class="conflict-label">
                                    ${level === 'DANGER' ? '🔴 Cannibalization Danger' : '🟡 Caution - Similar Intent'}
                                </div>
                                <div class="conflict-keyword">
                                    <strong>Conflicting Keyword:</strong> ${idea.conflictingKeyword}
                                </div>
                                ${idea.conflictingUrl ? `
                                    <div class="conflict-url">
                                        <strong>Conflicting Blog:</strong> 
                                        <a href="${idea.conflictingUrl}" target="_blank">${idea.conflictingUrl}</a>
                                    </div>
                                ` : ''}
                            </div>

                            <div class="override-section">
                                <label>Change Keyword:</label>
                                <input 
                                    type="text"
                                    id="new-keyword-${index}"
                                    value="${idea.currentKeyword}"
                                    placeholder="Enter new keyword"
                                >
                                <button 
                                    class="btn-regenerate"
                                    onclick="generateNewTitle(${index})"
                                    id="regen-btn-${index}"
                                >
                                    Generate New Title
                                </button>
                                <div id="suggested-title-${index}"></div>
                            </div>
                        ` : ''}

                        <button
                            class="btn-mark ${isMarked ? 'marked' : ''}"
                            onclick="toggleMark(${index})"
                            id="mark-btn-${index}"
                        >
                            ${isMarked ? '✓ To Write Blog' : 'Mark for Writing'}
                        </button>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ============================================
        // GENERATE NEW TITLE (AI)
        // ============================================
        async function generateNewTitle(index) {
            const newKeyword = document.getElementById(`new-keyword-${index}`).value.trim();

            if (!newKeyword) {
                alert('Please enter a keyword first');
                return;
            }

            const btn = document.getElementById(`regen-btn-${index}`);
            btn.disabled = true;
            btn.textContent = 'Generating...';

            try {
                const originalTitle = blogIdeas[index].title;

                const response = await fetch('/api/claude', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: `Original blog title: "${originalTitle}"

New keyword: "${newKeyword}"

Generate a new blog title that:
1. Uses the new keyword naturally
2. Keeps the same style and tone as the original title
3. Maintains the same question format or structure if the original has one

Return ONLY the new title, nothing else. No explanation, no punctuation around it.`
                    })
                });

                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }

                const data = await response.json();
                console.log('API response:', data);

                // /api/claude returns { response: "text" }
                const newTitle = (data.response || '').trim().replace(/^["']|["']$/g, '');

                if (!newTitle) {
                    throw new Error('Empty response from API');
                }

                // Update display
                document.getElementById(`keyword-display-${index}`).textContent = newKeyword;
                document.getElementById(`title-display-${index}`).textContent = newTitle;

                // Update stored data
                blogIdeas[index].currentKeyword = newKeyword;
                blogIdeas[index].currentTitle = newTitle;

                // Show suggested title box
                document.getElementById(`suggested-title-${index}`).innerHTML = `
                    <div class="suggested-title">
                        <strong>✨ New Title Generated:</strong>
                        ${newTitle}
                    </div>
                `;

                btn.textContent = 'Regenerate Title';

            } catch (error) {
                console.error('Error generating title:', error);
                alert('Error generating title: ' + error.message);
                btn.textContent = 'Regenerate Title';
            } finally {
                btn.disabled = false;
            }
        }

        // ============================================
        // MARK FOR WRITING
        // ============================================
        function toggleMark(index) {
            if (markedIdeas.has(index)) {
                markedIdeas.delete(index);
            } else {
                markedIdeas.add(index);
            }

            const btn = document.getElementById(`mark-btn-${index}`);
            const isMarked = markedIdeas.has(index);
            btn.className = `btn-mark ${isMarked ? 'marked' : ''}`;
            btn.textContent = isMarked ? '✓ To Write Blog' : 'Mark for Writing';
        }

        // ============================================
        // INITIALIZE
        // ============================================
        loadData();
    </script>
</body>
</html>
