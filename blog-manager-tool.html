<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Manager Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        h1 { font-size: 32px; font-weight: 600; margin-bottom: 4px; color: #1a1a1a; }

        .version { color: #999999; font-size: 13px; margin-bottom: 30px; }

        .stats {
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 30px;
            font-size: 14px;
            color: #666666;
        }

        .stats strong { color: #1a1a1a; }

        .loading { text-align: center; padding: 60px 20px; color: #666666; font-size: 14px; }

        /* IDEA CARD */
        .idea-card {
            background: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .idea-card.green { border-color: #66bb6a; background: #f1f8f4; }
        .idea-card.yellow { border-color: #ffa726; background: #fff8f1; }
        .idea-card.red { border-color: #ef5350; background: #fff1f1; }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .card-number { font-size: 12px; font-weight: 600; color: #999999; }

        .status-badge {
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-green { background: #66bb6a; color: #ffffff; }
        .badge-yellow { background: #ffa726; color: #ffffff; }
        .badge-red { background: #ef5350; color: #ffffff; }

        .keyword { font-size: 18px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
        .title { font-size: 15px; color: #333333; margin-bottom: 8px; line-height: 1.5; }
        .perspective { font-size: 13px; color: #666666; font-style: italic; margin-bottom: 16px; }

        /* CONFLICT WARNING */
        .conflict-warning {
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 13px;
        }

        .conflict-warning.yellow {
            background: #fff3e0;
            border: 1px solid #ffa726;
            color: #ef6c00;
        }

        .conflict-warning.red {
            background: #ffebee;
            border: 1px solid #ef5350;
            color: #c62828;
        }

        .conflict-warning .conflict-label {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .conflict-warning .conflict-keyword {
            font-size: 13px;
            margin-bottom: 4px;
        }

        .conflict-warning .conflict-url {
            font-size: 12px;
        }

        .conflict-warning .conflict-url a {
            color: inherit;
            text-decoration: underline;
        }

        /* KEYWORD OVERRIDE */
        .override-section {
            background: #f5f5f5;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .override-section label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #1a1a1a;
            margin-bottom: 6px;
        }

        .override-section input {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .override-section input:focus {
            outline: none;
            border-color: #1a1a1a;
        }

        .btn-regenerate {
            background: #ffffff;
            color: #1a1a1a;
            border: 1px solid #1a1a1a;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-regenerate:hover { background: #1a1a1a; color: #ffffff; }

        .btn-regenerate:disabled {
            background: #f5f5f5;
            color: #cccccc;
            border-color: #e0e0e0;
            cursor: not-allowed;
        }

        /* SUGGESTED TITLE */
        .suggested-title {
            background: #e3f2fd;
            border: 1px solid #2196F3;
            border-radius: 6px;
            padding: 12px;
            margin-top: 12px;
            font-size: 13px;
            color: #1565C0;
        }

        .suggested-title strong { display: block; margin-bottom: 4px; }

        /* TABS */
        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-btn {
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            cursor: pointer;
            color: #666666;
            transition: all 0.2s ease;
        }

        .tab-btn:hover { color: #1a1a1a; }

        .tab-btn.active {
            color: #1a1a1a;
            border-bottom-color: #1a1a1a;
            font-weight: 600;
        }

        .tab-count {
            display: inline-block;
            background: #e0e0e0;
            color: #666666;
            border-radius: 12px;
            padding: 1px 8px;
            font-size: 12px;
            margin-left: 6px;
        }

        .tab-btn.active .tab-count {
            background: #1a1a1a;
            color: #ffffff;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999999;
            font-size: 14px;
        }

        /* UNDO BUTTON */
        .btn-undo {
            background: #ffffff;
            color: #ef5350;
            border: 1px solid #ef5350;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-left: 10px;
        }

        .btn-undo:hover {
            background: #ef5350;
            color: #ffffff;
        }

        .btn-send-sheet {
            background: #ffffff;
            color: #1976d2;
            border: 1px solid #1976d2;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-send-sheet:hover { background: #1976d2; color: #ffffff; }
        .btn-send-sheet:disabled { opacity: 0.5; cursor: not-allowed; }

        .card-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* SAVING INDICATOR */
        .saving-indicator {
            font-size: 12px;
            color: #66bb6a;
            margin-left: 10px;
        }

        .saving-indicator.saving { color: #ffa726; }
        .saving-indicator.error { color: #ef5350; }
        .btn-mark {
            background: #2196F3;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 180px;
        }

        .btn-mark:hover { background: #1976D2; }
        .btn-mark.marked { background: #66bb6a; }
        .btn-mark.marked:hover { background: #4caf50; }

        /* KEYWORD CHANGE BUTTON */
        .btn-keyword-change {
            background: #ffffff;
            color: #ff9800;
            border: 1px solid #ff9800;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 180px;
        }

        .btn-keyword-change:hover { background: #ff9800; color: #ffffff; }

        /* DELETE BUTTON */
        .btn-delete {
            background: #ffffff;
            color: #ef5350;
            border: 1px solid #ef5350;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-delete:hover { background: #ef5350; color: #ffffff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Blog Manager Tool</h1>
        <p class="version">v1.9 - 2026-05-27</p>

        <div class="stats" id="stats">Loading blog ideas...</div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('ideas')" id="tab-ideas">
                Blog Ideas <span class="tab-count" id="count-ideas">0</span>
            </button>
            <button class="tab-btn" onclick="switchTab('towrite')" id="tab-towrite">
                To Write <span class="tab-count" id="count-towrite">0</span>
            </button>
            <button class="tab-btn" onclick="switchTab('kwchange')" id="tab-kwchange">
                Keyword Change <span class="tab-count" id="count-kwchange">0</span>
            </button>
        </div>

        <div class="tab-content active" id="panel-ideas">
            <div id="ideas-container">
                <div class="loading">🔄 Loading blog ideas...</div>
            </div>
        </div>

        <div class="tab-content" id="panel-towrite">
            <div id="towrite-container">
                <div class="empty-state">No blogs marked for writing yet.</div>
            </div>
        </div>

        <div class="tab-content" id="panel-kwchange">
            <div id="kwchange-container">
                <div class="empty-state">No keywords marked for change yet.</div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // DATA
        // ============================================
        let blogIdeas = [];
        let markedForWriting = new Set();   // indexes marked for writing
        let markedForKwChange = new Set();  // indexes marked for keyword change
        let sentToSheet = new Set();        // indexes sent to Google Sheet (hidden from To Write)

        // ============================================
        // TAB SWITCHING
        // ============================================
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(p => p.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.getElementById(`panel-${tab}`).classList.add('active');
        }

        function updateTabCounts() {
            const total = blogIdeas.length;
            const writing = markedForWriting.size;
            const kwchange = markedForKwChange.size;
            document.getElementById('count-ideas').textContent = total - writing - kwchange;
            document.getElementById('count-towrite').textContent = writing;
            document.getElementById('count-kwchange').textContent = kwchange;
        }

        // ============================================
        // CSV PARSER
        // ============================================
        function parseCSV(text) {
            const lines = text.split('\n');
            const headers = parseCSVLine(lines[0]);
            const rows = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim().replace(/\r/g, '');
                if (!line) continue;
                const cols = parseCSVLine(line);
                const row = {};
                headers.forEach((h, idx) => { row[h.trim()] = cols[idx] || ''; });
                rows.push(row);
            }
            return rows;
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') { inQuotes = !inQuotes; }
                else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
                else { current += char; }
            }
            result.push(current.trim());
            return result;
        }

        // ============================================
        // SLUG GENERATOR
        // ============================================
        function generateUrl(title) {
            const slug = title.toLowerCase()
                .replace(/[^a-z0-9\s-]/g, '')
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-')
                .replace(/^-|-$/g, '');
            return `https://aboutwallart.com/blogs/news-articles-home-decor-inspiration/${slug}`;
        }

        // ============================================
        // LOAD DATA FROM GITHUB CSV
        // ============================================
        async function loadData() {
            try {
                const csvUrl = 'https://raw.githubusercontent.com/aboutwallart/seo-tools/main/data/blog_ideas.csv';
                const response = await fetch(csvUrl);
                if (!response.ok) throw new Error(`Failed to fetch CSV: ${response.status}`);

                const csvText = await response.text();
                const rows = parseCSV(csvText);

                // Filter out already processed rows (TO_WRITE or KEYWORD_CHANGE)
                const unprocessed = rows.filter(row => {
                    const status = (row['STATUS'] || '').trim();
                    return status !== 'TO_WRITE' && status !== 'KEYWORD_CHANGE';
                });

                // Take first 40 unprocessed
                const first40 = unprocessed.slice(0, 40);

                blogIdeas = first40.map((row, index) => ({
                    index: index,
                    keyword: row['Keyword'] || '',
                    title: row['Blog Post Title'] || '',
                    perspective: row['Perspective'] || '',
                    cannibalization: row['CANNIBALIZATION'] || 'NO CONFLICT',
                    conflictingKeyword: row['CONFLICTING KEYWORD'] || '',
                    conflictingUrl: row['CONFLICTING BLOG URL'] || '',
                    currentTitle: row['Blog Post Title'] || '',
                    currentKeyword: row['Keyword'] || ''
                }));

                const green = blogIdeas.filter(i => i.cannibalization === 'NO CONFLICT').length;
                const yellow = blogIdeas.filter(i => i.cannibalization === 'CAUTION').length;
                const red = blogIdeas.filter(i => i.cannibalization === 'DANGER').length;

                document.getElementById('stats').innerHTML = `
                    <strong>Loaded:</strong> ${blogIdeas.length} blog ideas &nbsp;|&nbsp;
                    🟢 ${green} No Conflict &nbsp;|&nbsp;
                    🟡 ${yellow} Caution &nbsp;|&nbsp;
                    🔴 ${red} Danger
                `;

                updateTabCounts();
                displayIdeas();

            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('stats').innerHTML = `<strong>Error:</strong> ${error.message}`;
                document.getElementById('ideas-container').innerHTML = `<div class="loading">❌ Could not load blog ideas.</div>`;
            }
        }

        // ============================================
        // DISPLAY IDEAS (Tab 1)
        // ============================================
        function displayIdeas() {
            const container = document.getElementById('ideas-container');
            const visible = blogIdeas.filter(idea => 
                !markedForWriting.has(idea.index) && !markedForKwChange.has(idea.index)
            );

            if (visible.length === 0) {
                container.innerHTML = `<div class="empty-state">All ideas have been processed! 🎉</div>`;
                return;
            }

            container.innerHTML = visible.map(idea => buildIdeaCard(idea, 'ideas')).join('');
        }

        // ============================================
        // DISPLAY TO WRITE (Tab 2)
        // ============================================
        function displayToWrite() {
            const container = document.getElementById('towrite-container');
            const marked = blogIdeas.filter(idea => markedForWriting.has(idea.index) && !sentToSheet.has(idea.index));

            if (marked.length === 0) {
                container.innerHTML = `<div class="empty-state">No blogs marked for writing yet.</div>`;
                return;
            }

            container.innerHTML = marked.map(idea => buildIdeaCard(idea, 'towrite')).join('');
        }

        // ============================================
        // DISPLAY KEYWORD CHANGE (Tab 3)
        // ============================================
        function displayKwChange() {
            const container = document.getElementById('kwchange-container');
            const marked = blogIdeas.filter(idea => markedForKwChange.has(idea.index));

            if (marked.length === 0) {
                container.innerHTML = `<div class="empty-state">No keywords marked for change yet.</div>`;
                return;
            }

            container.innerHTML = marked.map(idea => buildIdeaCard(idea, 'kwchange')).join('');
        }

        function refreshAll() {
            displayIdeas();
            displayToWrite();
            displayKwChange();
            updateTabCounts();
        }

        // ============================================
        // BUILD CARD HTML
        // ============================================
        function buildIdeaCard(idea, tab) {
            const level = idea.cannibalization;
            const cardClass = level === 'NO CONFLICT' ? 'green' : level === 'CAUTION' ? 'yellow' : 'red';
            const badgeClass = level === 'NO CONFLICT' ? 'badge-green' : level === 'CAUTION' ? 'badge-yellow' : 'badge-red';
            const index = idea.index;

            let actionsHTML = '';

            if (tab === 'ideas') {
                actionsHTML = `
                    <button class="btn-mark" onclick="markForWriting(${index})">Mark for Writing</button>
                    <button class="btn-keyword-change" onclick="markForKwChange(${index})">Change Keyword</button>
                `;
            } else if (tab === 'towrite') {
                actionsHTML = `
                    <button class="btn-mark marked" disabled>✓ To Write Blog</button>
                    <button class="btn-undo" onclick="undoWriting(${index})">↩ Undo</button>
                    <button class="btn-send-sheet" id="sheet-btn-${index}" onclick="sendToSheet(${index})">📤 Send to Google Sheet</button>
                    <span class="saving-indicator" id="save-status-${index}">✅ Saved to registry</span>
                `;
            } else if (tab === 'kwchange') {
                actionsHTML = `
                    <button class="btn-keyword-change" style="opacity:0.6;cursor:default" disabled>⚠ Keyword Change</button>
                    <button class="btn-undo" onclick="undoKwChange(${index})">↩ Undo</button>
                    <button class="btn-delete" onclick="confirmDelete(${index})">🗑 Delete</button>
                    <span class="saving-indicator" id="kw-status-${index}"></span>
                `;
            }

            return `
                <div class="idea-card ${cardClass}" id="card-${index}">
                    <div class="card-header">
                        <span class="card-number">#${index + 1}</span>
                        <span class="status-badge ${badgeClass}">${level}</span>
                    </div>

                    <div class="keyword">${idea.currentKeyword}</div>
                    <div class="title">${idea.currentTitle}</div>
                    <div class="perspective">${idea.perspective}</div>

                    ${level !== 'NO CONFLICT' && tab === 'ideas' ? `
                        <div class="conflict-warning ${cardClass}">
                            <div class="conflict-label">
                                ${level === 'DANGER' ? '🔴 Cannibalization Danger' : '🟡 Caution - Similar Intent'}
                            </div>
                            <div class="conflict-keyword">
                                <strong>Conflicting Keyword:</strong> ${idea.conflictingKeyword}
                            </div>
                            ${idea.conflictingUrl ? `
                                <div class="conflict-url">
                                    <strong>Conflicting Blog:</strong>
                                    <a href="${idea.conflictingUrl}" target="_blank">${idea.conflictingUrl}</a>
                                </div>
                            ` : ''}
                        </div>
                    ` : ''}

                    <div class="card-actions">${actionsHTML}</div>
                </div>
            `;
        }

        // ============================================
        // MARK FOR WRITING
        // ============================================
        async function markForWriting(index) {
            const idea = blogIdeas[index];
            const keyword = idea.currentKeyword;
            const url = generateUrl(idea.currentTitle);

            markedForWriting.add(index);
            refreshAll();
            switchTab('towrite');

            const saveStatus = document.getElementById(`save-status-${index}`);
            if (saveStatus) { saveStatus.textContent = '⏳ Saving...'; saveStatus.className = 'saving-indicator saving'; }

            try {
                const response = await fetch('/api/blogs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keyword, url, title: idea.currentTitle, perspective: idea.perspective })
                });
                const data = await response.json();
                if (saveStatus) {
                    saveStatus.textContent = data.success ? '✅ Saved to registry' : '❌ ' + (data.error || 'Save failed');
                    saveStatus.className = data.success ? 'saving-indicator' : 'saving-indicator error';
                }
            } catch (error) {
                console.error('Error saving:', error);
                if (saveStatus) { saveStatus.textContent = '❌ ' + error.message; saveStatus.className = 'saving-indicator error'; }
            }
        }

        // ============================================
        // UNDO WRITING
        // ============================================
        async function undoWriting(index) {
            const keyword = blogIdeas[index].currentKeyword;
            markedForWriting.delete(index);
            refreshAll();

            try {
                await fetch('/api/blogs', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keyword })
                });
            } catch (error) {
                console.error('Error undoing:', error);
            }
        }

        async function sendToSheet(index) {
            const idea = blogIdeas[index];
            const btn = document.getElementById(`sheet-btn-${index}`);
            const saveStatus = document.getElementById(`save-status-${index}`);

            btn.disabled = true;
            btn.textContent = '⏳ Sending...';

            try {
                const response = await fetch('/api/blogs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        keyword: idea.currentKeyword,
                        url: generateUrl(idea.currentTitle),
                        title: idea.currentTitle,
                        perspective: idea.perspective,
                        sheetsOnly: true
                    })
                });
                const data = await response.json();
                if (data.success || data.sheetsResult) {
                    // Remove card from view
                    sentToSheet.add(index);
                    refreshAll();
                } else {
                    btn.disabled = false;
                    btn.textContent = '📤 Send to Google Sheet';
                    if (saveStatus) saveStatus.textContent = '❌ Sheet error: ' + (data.error || 'Unknown');
                }
            } catch (error) {
                console.error('Error sending to sheet:', error);
                btn.disabled = false;
                btn.textContent = '📤 Send to Google Sheet';
                if (saveStatus) saveStatus.textContent = '❌ ' + error.message;
            }
        }

        // ============================================
        // MARK FOR KEYWORD CHANGE
        // ============================================
        function markForKwChange(index) {
            markedForKwChange.add(index);
            refreshAll();
            switchTab('kwchange');
        }

        // ============================================
        // UNDO KEYWORD CHANGE
        // ============================================
        function undoKwChange(index) {
            markedForKwChange.delete(index);
            refreshAll();
        }

        // ============================================
        // CONFIRM DELETE (mark as KEYWORD_CHANGE in CSV)
        // ============================================
        async function confirmDelete(index) {
            const idea = blogIdeas[index];
            const keyword = idea.currentKeyword;

            const statusEl = document.getElementById(`kw-status-${index}`);
            if (statusEl) { statusEl.textContent = '⏳ Saving...'; statusEl.className = 'saving-indicator saving'; }

            try {
                const response = await fetch('/api/blogs', {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keyword })
                });
                const data = await response.json();

                if (data.success) {
                    // Remove from UI permanently
                    markedForKwChange.delete(index);
                    blogIdeas = blogIdeas.filter(i => i.index !== index);
                    refreshAll();
                } else {
                    if (statusEl) { statusEl.textContent = '❌ ' + (data.error || 'Failed'); statusEl.className = 'saving-indicator error'; }
                }
            } catch (error) {
                console.error('Error deleting:', error);
                if (statusEl) { statusEl.textContent = '❌ ' + error.message; statusEl.className = 'saving-indicator error'; }
            }
        }

        // ============================================
        // INITIALIZE
        // ============================================
        loadData();

    </script>
</body>
</html>
