<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Manager Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        h1 { font-size: 32px; font-weight: 600; margin-bottom: 4px; color: #1a1a1a; }

        .version { color: #999999; font-size: 13px; margin-bottom: 30px; }

        .stats {
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 30px;
            font-size: 14px;
            color: #666666;
        }

        .stats strong { color: #1a1a1a; }

        .loading { text-align: center; padding: 60px 20px; color: #666666; font-size: 14px; }

        /* FILTER BAR */
        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-label {
            font-size: 13px;
            color: #666666;
            font-weight: 500;
            margin-right: 4px;
        }

        .btn-filter {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            border: 1px solid #e0e0e0;
            background: #ffffff;
            color: #666666;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-filter:hover { border-color: #1a1a1a; color: #1a1a1a; }

        .btn-filter.active-all {
            background: #1a1a1a;
            color: #ffffff;
            border-color: #1a1a1a;
        }

        .btn-filter.active-green {
            background: #66bb6a;
            color: #ffffff;
            border-color: #66bb6a;
        }

        .btn-filter.active-yellow {
            background: #ffa726;
            color: #ffffff;
            border-color: #ffa726;
        }

        .btn-filter.active-red {
            background: #ef5350;
            color: #ffffff;
            border-color: #ef5350;
        }

        /* IDEA CARD */
        .idea-card {
            background: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }

        .idea-card.green { border-color: #66bb6a; background: #f1f8f4; }
        .idea-card.yellow { border-color: #ffa726; background: #fff8f1; }
        .idea-card.red { border-color: #ef5350; background: #fff1f1; }

        .idea-card.selected-card {
            outline: 3px solid #2196F3;
            outline-offset: 2px;
        }

        /* CHECKBOX */
        .card-checkbox {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #2196F3;
        }

        .idea-card .card-header {
            padding-left: 32px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .card-number { font-size: 12px; font-weight: 600; color: #999999; }

        .status-badge {
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-green { background: #66bb6a; color: #ffffff; }
        .badge-yellow { background: #ffa726; color: #ffffff; }
        .badge-red { background: #ef5350; color: #ffffff; }

        .keyword { font-size: 18px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
        .title { font-size: 15px; color: #333333; margin-bottom: 8px; line-height: 1.5; }
        .perspective { font-size: 13px; color: #666666; font-style: italic; margin-bottom: 16px; }

        /* CONFLICT WARNING */
        .conflict-warning {
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 13px;
        }

        .conflict-warning.yellow {
            background: #fff3e0;
            border: 1px solid #ffa726;
            color: #ef6c00;
        }

        .conflict-warning.red {
            background: #ffebee;
            border: 1px solid #ef5350;
            color: #c62828;
        }

        .conflict-warning .conflict-label {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .conflict-warning .conflict-keyword {
            font-size: 13px;
            margin-bottom: 4px;
        }

        .conflict-warning .conflict-url {
            font-size: 12px;
        }

        .conflict-warning .conflict-url a {
            color: inherit;
            text-decoration: underline;
        }

        /* KEYWORD OVERRIDE */
        .override-section {
            background: #f5f5f5;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .override-section label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #1a1a1a;
            margin-bottom: 6px;
        }

        .override-section input {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .override-section input:focus {
            outline: none;
            border-color: #1a1a1a;
        }

        .btn-regenerate {
            background: #ffffff;
            color: #1a1a1a;
            border: 1px solid #1a1a1a;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-regenerate:hover { background: #1a1a1a; color: #ffffff; }

        .btn-regenerate:disabled {
            background: #f5f5f5;
            color: #cccccc;
            border-color: #e0e0e0;
            cursor: not-allowed;
        }

        /* SUGGESTED TITLE */
        .suggested-title {
            background: #e3f2fd;
            border: 1px solid #2196F3;
            border-radius: 6px;
            padding: 12px;
            margin-top: 12px;
            font-size: 13px;
            color: #1565C0;
        }

        .suggested-title strong { display: block; margin-bottom: 4px; }

        /* TABS */
        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-btn {
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            cursor: pointer;
            color: #666666;
            transition: all 0.2s ease;
        }

        .tab-btn:hover { color: #1a1a1a; }

        .tab-btn.active {
            color: #1a1a1a;
            border-bottom-color: #1a1a1a;
            font-weight: 600;
        }

        .tab-count {
            display: inline-block;
            background: #e0e0e0;
            color: #666666;
            border-radius: 12px;
            padding: 1px 8px;
            font-size: 12px;
            margin-left: 6px;
        }

        .tab-btn.active .tab-count {
            background: #1a1a1a;
            color: #ffffff;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999999;
            font-size: 14px;
        }

        /* UNDO BUTTON */
        .btn-undo {
            background: #ffffff;
            color: #ef5350;
            border: 1px solid #ef5350;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-left: 10px;
        }

        .btn-undo:hover {
            background: #ef5350;
            color: #ffffff;
        }

        .btn-send-sheet {
            background: #ffffff;
            color: #1976d2;
            border: 1px solid #1976d2;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-send-sheet:hover { background: #1976d2; color: #ffffff; }
        .btn-send-sheet:disabled { opacity: 0.5; cursor: not-allowed; }

        .card-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* SAVING INDICATOR */
        .saving-indicator {
            font-size: 12px;
            color: #66bb6a;
            margin-left: 10px;
        }

        .saving-indicator.saving { color: #ffa726; }
        .saving-indicator.error { color: #ef5350; }
        .saving-indicator.pending { color: #999999; }

        .btn-mark {
            background: #2196F3;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 180px;
        }

        .btn-mark:hover { background: #1976D2; }
        .btn-mark.marked { background: #66bb6a; }
        .btn-mark.marked:hover { background: #4caf50; }

        /* KEYWORD CHANGE BUTTON */
        .btn-keyword-change {
            background: #ffffff;
            color: #ff9800;
            border: 1px solid #ff9800;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 180px;
        }

        .btn-keyword-change:hover { background: #ff9800; color: #ffffff; }

        /* INLINE TITLE EDIT */
        .inline-edit-section {
            background: #f5f5f5;
            border-radius: 6px;
            padding: 12px 14px;
            margin-bottom: 16px;
        }

        .inline-edit-label {
            font-size: 12px;
            font-weight: 600;
            color: #666666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: block;
        }

        .inline-edit-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .inline-edit-input {
            flex: 1;
            padding: 9px 12px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            color: #1a1a1a;
        }

        .inline-edit-input:focus {
            outline: none;
            border-color: #1a1a1a;
        }

        .btn-save-title {
            background: #1a1a1a;
            color: #ffffff;
            border: none;
            padding: 9px 18px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .btn-save-title:hover { background: #333333; }
        .btn-save-title:disabled { background: #cccccc; cursor: not-allowed; }

        .recheck-status {
            font-size: 12px;
            margin-top: 6px;
            color: #999999;
        }

        /* DELETE BUTTON */
        .btn-delete {
            background: #ffffff;
            color: #ef5350;
            border: 1px solid #ef5350;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-delete:hover { background: #ef5350; color: #ffffff; }

        /* BULK ACTION ROW */
        .bulk-action-row {
            display: none;
            align-items: center;
            gap: 12px;
            background: #e3f2fd;
            border: 1px solid #2196F3;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
        }

        .bulk-action-row.visible { display: flex; }

        .bulk-action-info {
            font-size: 14px;
            font-weight: 600;
            color: #1565C0;
            flex: 1;
        }

        .btn-bulk-move {
            background: #2196F3;
            color: #ffffff;
            border: none;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-bulk-move:hover { background: #1976D2; }

        .btn-bulk-clear {
            background: #ffffff;
            color: #666666;
            border: 1px solid #cccccc;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-bulk-clear:hover { border-color: #999999; color: #1a1a1a; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Blog Manager Tool</h1>
        <p class="version">v2.2 - 2026-06-15</p>

        <div class="stats" id="stats">Loading blog ideas...</div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('ideas')" id="tab-ideas">
                Blog Ideas <span class="tab-count" id="count-ideas">0</span>
            </button>
            <button class="tab-btn" onclick="switchTab('towrite')" id="tab-towrite">
                To Write <span class="tab-count" id="count-towrite">0</span>
            </button>
            <button class="tab-btn" onclick="switchTab('kwchange')" id="tab-kwchange">
                Keyword Change <span class="tab-count" id="count-kwchange">0</span>
            </button>
        </div>

        <div class="tab-content active" id="panel-ideas">
            <div id="filter-bar" class="filter-bar" style="display:none;">
                <span class="filter-label">Filter:</span>
                <button class="btn-filter active-all" onclick="setFilter('all')">All</button>
                <button class="btn-filter" onclick="setFilter('green')">🟢 No Conflict</button>
                <button class="btn-filter" onclick="setFilter('yellow')">🟡 Caution</button>
                <button class="btn-filter" onclick="setFilter('red')">🔴 Danger</button>
            </div>
            <div class="bulk-action-row" id="bulk-action-row">
                <span class="bulk-action-info" id="bulk-action-info">0 selected</span>
                <button class="btn-bulk-clear" onclick="clearSelection()">Clear</button>
                <button class="btn-bulk-move" onclick="bulkMoveToWrite()">✓ Move selected to To Write</button>
            </div>
            <div id="ideas-container">
                <div class="loading">🔄 Loading blog ideas...</div>
            </div>
        </div>

        <div class="tab-content" id="panel-towrite">
            <div id="towrite-container">
                <div class="empty-state">No blogs marked for writing yet.</div>
            </div>
        </div>

        <div class="tab-content" id="panel-kwchange">
            <div id="kwchange-container">
                <div class="empty-state">No keywords marked for change yet.</div>
            </div>
        </div>
    </div>


    <script>
        // ============================================
        // DATA
        // ============================================
        let blogIdeas = [];
        let allRows = [];   // full CSV — used for conflict re-check
        let markedForWriting = new Set();
        let markedForKwChange = new Set();
        let sentToSheet = new Set();
        let notYetSaved = new Set();    // moved via bulk — not saved to registry yet
        let selectedIdeas = new Set();  // checkboxes
        let activeFilter = 'all';

        // ============================================
        // TAB SWITCHING
        // ============================================
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(p => p.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.getElementById(`panel-${tab}`).classList.add('active');
            if (tab !== 'ideas') clearSelection();
        }

        function updateTabCounts() {
            const total = blogIdeas.length;
            const writing = markedForWriting.size;
            const kwchange = markedForKwChange.size;
            document.getElementById('count-ideas').textContent = total - writing - kwchange;
            document.getElementById('count-towrite').textContent = writing;
            document.getElementById('count-kwchange').textContent = kwchange;
        }

        // ============================================
        // FILTER
        // ============================================
        function setFilter(filter) {
            activeFilter = filter;
            document.querySelectorAll('.btn-filter').forEach(b => {
                b.className = 'btn-filter';
            });
            const activeBtn = document.querySelector(`.btn-filter[onclick="setFilter('${filter}')"]`);
            if (activeBtn) activeBtn.classList.add(`active-${filter}`);
            clearSelection();
            displayIdeas();
        }

        // ============================================
        // SELECTION
        // ============================================
        function toggleSelect(index) {
            if (selectedIdeas.has(index)) {
                selectedIdeas.delete(index);
            } else {
                selectedIdeas.add(index);
            }
            const card = document.getElementById(`card-${index}`);
            const cb = document.getElementById(`cb-${index}`);
            if (card) card.classList.toggle('selected-card', selectedIdeas.has(index));
            if (cb) cb.checked = selectedIdeas.has(index);
            updateBulkBar();
        }

        function clearSelection() {
            selectedIdeas.clear();
            document.querySelectorAll('.card-checkbox').forEach(cb => { cb.checked = false; });
            document.querySelectorAll('.idea-card').forEach(c => c.classList.remove('selected-card'));
            updateBulkBar();
        }

        function updateBulkBar() {
            const row = document.getElementById('bulk-action-row');
            const info = document.getElementById('bulk-action-info');
            if (!row) return;
            const n = selectedIdeas.size;
            if (n > 0) {
                info.textContent = `${n} idea${n > 1 ? 's' : ''} selected`;
                row.classList.add('visible');
            } else {
                row.classList.remove('visible');
            }
        }

        // ============================================
        // BULK MOVE TO TO WRITE (no API save)
        // ============================================
        function bulkMoveToWrite() {
            if (selectedIdeas.size === 0) return;
            selectedIdeas.forEach(index => {
                markedForWriting.add(index);
                notYetSaved.add(index);
            });
            clearSelection();
            refreshAll();
            switchTab('towrite');
        }

        // ============================================
        // CSV PARSER
        // ============================================
        function parseCSV(text) {
            const lines = text.split('\n');
            const headers = parseCSVLine(lines[0]);
            const rows = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim().replace(/\r/g, '');
                if (!line) continue;
                const cols = parseCSVLine(line);
                const row = {};
                headers.forEach((h, idx) => { row[h.trim()] = cols[idx] || ''; });
                rows.push(row);
            }
            return rows;
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') { inQuotes = !inQuotes; }
                else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
                else { current += char; }
            }
            result.push(current.trim());
            return result;
        }

        // ============================================
        // SLUG GENERATOR
        // ============================================
        function generateUrl(title) {
            const slug = title.toLowerCase()
                .replace(/[^a-z0-9\s-]/g, '')
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-')
                .replace(/^-|-$/g, '');
            return `https://aboutwallart.com/blogs/news-articles-home-decor-inspiration/${slug}`;
        }

        // ============================================
        // LOAD DATA FROM GITHUB CSV
        // ============================================
        async function loadData() {
            try {
                const csvUrl = 'https://raw.githubusercontent.com/aboutwallart/seo-tools/main/data/blog_ideas.csv';
                const response = await fetch(csvUrl);
                if (!response.ok) throw new Error(`Failed to fetch CSV: ${response.status}`);

                const csvText = await response.text();
                const rows = parseCSV(csvText);
                allRows = rows; // store full CSV for conflict re-check

                const unprocessed = rows.filter(row => {
                    const status = (row['STATUS'] || '').trim();
                    return status !== 'TO_WRITE' && status !== 'KEYWORD_CHANGE';
                });

                const first40 = unprocessed.slice(0, 40);

                blogIdeas = first40.map((row, index) => ({
                    index: index,
                    keyword: row['Keyword'] || '',
                    title: row['Blog Post Title'] || '',
                    perspective: row['Perspective'] || '',
                    cannibalization: row['CANNIBALIZATION'] || 'NO CONFLICT',
                    conflictingKeyword: row['CONFLICTING KEYWORD'] || '',
                    conflictingUrl: row['CONFLICTING BLOG URL'] || '',
                    currentTitle: row['Blog Post Title'] || '',
                    currentKeyword: row['Keyword'] || ''
                }));

                const green = blogIdeas.filter(i => i.cannibalization === 'NO CONFLICT').length;
                const yellow = blogIdeas.filter(i => i.cannibalization === 'CAUTION').length;
                const red = blogIdeas.filter(i => i.cannibalization === 'DANGER').length;

                document.getElementById('stats').innerHTML = `
                    <strong>Loaded:</strong> ${blogIdeas.length} blog ideas &nbsp;|&nbsp;
                    🟢 ${green} No Conflict &nbsp;|&nbsp;
                    🟡 ${yellow} Caution &nbsp;|&nbsp;
                    🔴 ${red} Danger
                `;

                document.getElementById('filter-bar').style.display = 'flex';
                updateTabCounts();
                displayIdeas();

            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('stats').innerHTML = `<strong>Error:</strong> ${error.message}`;
                document.getElementById('ideas-container').innerHTML = `<div class="loading">❌ Could not load blog ideas.</div>`;
            }
        }

        // ============================================
        // DISPLAY IDEAS (Tab 1)
        // ============================================
        function displayIdeas() {
            const container = document.getElementById('ideas-container');
            let visible = blogIdeas.filter(idea =>
                !markedForWriting.has(idea.index) && !markedForKwChange.has(idea.index)
            );

            if (activeFilter === 'green') {
                visible = visible.filter(i => i.cannibalization === 'NO CONFLICT');
            } else if (activeFilter === 'yellow') {
                visible = visible.filter(i => i.cannibalization === 'CAUTION');
            } else if (activeFilter === 'red') {
                visible = visible.filter(i => i.cannibalization === 'DANGER');
            }

            if (visible.length === 0) {
                container.innerHTML = `<div class="empty-state">No ideas match this filter.</div>`;
                return;
            }

            container.innerHTML = visible.map(idea => buildIdeaCard(idea, 'ideas')).join('');

            // Restore checked state
            selectedIdeas.forEach(idx => {
                const card = document.getElementById(`card-${idx}`);
                const cb = document.getElementById(`cb-${idx}`);
                if (card) card.classList.add('selected-card');
                if (cb) cb.checked = true;
            });
        }

        // ============================================
        // DISPLAY TO WRITE (Tab 2)
        // ============================================
        function displayToWrite() {
            const container = document.getElementById('towrite-container');
            const marked = blogIdeas.filter(idea => markedForWriting.has(idea.index) && !sentToSheet.has(idea.index));

            if (marked.length === 0) {
                container.innerHTML = `<div class="empty-state">No blogs marked for writing yet.</div>`;
                return;
            }

            container.innerHTML = marked.map(idea => buildIdeaCard(idea, 'towrite')).join('');
        }

        // ============================================
        // DISPLAY KEYWORD CHANGE (Tab 3)
        // ============================================
        function displayKwChange() {
            const container = document.getElementById('kwchange-container');
            const marked = blogIdeas.filter(idea => markedForKwChange.has(idea.index));

            if (marked.length === 0) {
                container.innerHTML = `<div class="empty-state">No keywords marked for change yet.</div>`;
                return;
            }

            container.innerHTML = marked.map(idea => buildIdeaCard(idea, 'kwchange')).join('');
        }

        function refreshAll() {
            displayIdeas();
            displayToWrite();
            displayKwChange();
            updateTabCounts();
        }

        // ============================================
        // BUILD CARD HTML
        // ============================================
        function buildIdeaCard(idea, tab) {
            const level = idea.cannibalization;
            const cardClass = level === 'NO CONFLICT' ? 'green' : level === 'CAUTION' ? 'yellow' : 'red';
            const badgeClass = level === 'NO CONFLICT' ? 'badge-green' : level === 'CAUTION' ? 'badge-yellow' : 'badge-red';
            const index = idea.index;
            const isSelected = selectedIdeas.has(index);

            let checkboxHTML = '';
            let actionsHTML = '';

            if (tab === 'ideas') {
                checkboxHTML = `<input type="checkbox" class="card-checkbox" id="cb-${index}" ${isSelected ? 'checked' : ''} onchange="toggleSelect(${index})">`;
                actionsHTML = `
                    <button class="btn-mark" onclick="markForWriting(${index})">Mark for Writing</button>
                    <button class="btn-keyword-change" onclick="markForKwChange(${index})">Change Keyword</button>
                `;
            } else if (tab === 'towrite') {
                const isPending = notYetSaved.has(index);
                const saveStatusText = isPending ? '⏳ Not saved yet' : '✅ Saved to registry';
                const saveStatusClass = isPending ? 'saving-indicator pending' : 'saving-indicator';
                actionsHTML = `
                    <button class="btn-mark marked" disabled>✓ To Write Blog</button>
                    <button class="btn-undo" onclick="undoWriting(${index})">↩ Undo</button>
                    <button class="btn-send-sheet" id="sheet-btn-${index}" onclick="sendToSheet(${index})">📤 Send to Google Sheet</button>
                    <span class="${saveStatusClass}" id="save-status-${index}">${saveStatusText}</span>
                `;
            } else if (tab === 'kwchange') {
                actionsHTML = `
                    <button class="btn-keyword-change" style="opacity:0.6;cursor:default" disabled>⚠ Keyword Change</button>
                    <button class="btn-undo" onclick="undoKwChange(${index})">↩ Undo</button>
                    <button class="btn-delete" onclick="confirmDelete(${index})">🗑 Delete</button>
                    <span class="saving-indicator" id="kw-status-${index}"></span>
                `;
            }

            return `
                <div class="idea-card ${cardClass}${isSelected ? ' selected-card' : ''}" id="card-${index}">
                    ${checkboxHTML}
                    <div class="card-header">
                        <span class="card-number">#${index + 1}</span>
                        <span class="status-badge ${badgeClass}">${level}</span>
                    </div>

                    <div class="keyword">${idea.currentKeyword}</div>
                    <div class="title">${idea.currentTitle}</div>
                    <div class="perspective">${idea.perspective}</div>

                    ${level !== 'NO CONFLICT' && tab === 'ideas' ? `
                        <div class="conflict-warning ${cardClass}">
                            <div class="conflict-label">
                                ${level === 'DANGER' ? '🔴 Cannibalization Danger' : '🟡 Caution - Similar Intent'}
                            </div>
                            <div class="conflict-keyword">
                                <strong>Conflicting Keyword:</strong> ${idea.conflictingKeyword}
                            </div>
                            ${idea.conflictingUrl ? `
                                <div class="conflict-url">
                                    <strong>Conflicting Blog:</strong>
                                    <a href="${idea.conflictingUrl}" target="_blank">${idea.conflictingUrl}</a>
                                </div>
                            ` : ''}
                        </div>
                        <div class="inline-edit-section">
                            <span class="inline-edit-label">Change title &amp; re-check</span>
                            <div class="inline-edit-row">
                                <input type="text" class="inline-edit-input" id="new-title-${index}" value="${idea.currentTitle.replace(/"/g, '&quot;')}" placeholder="Enter new blog title...">
                                <button class="btn-save-title" id="save-btn-${index}" onclick="saveNewTitle(${index})">Save &amp; Re-check</button>
                            </div>
                            <div class="recheck-status" id="recheck-status-${index}"></div>
                        </div>
                    ` : ''}

                    <div class="card-actions">${actionsHTML}</div>
                </div>
            `;
        }

        // ============================================
        // MARK FOR WRITING (single — saves to registry)
        // ============================================
        async function markForWriting(index) {
            const idea = blogIdeas[index];
            const keyword = idea.currentKeyword;
            const url = generateUrl(idea.currentTitle);

            markedForWriting.add(index);
            selectedIdeas.delete(index);
            refreshAll();
            switchTab('towrite');

            const saveStatus = document.getElementById(`save-status-${index}`);
            if (saveStatus) { saveStatus.textContent = '⏳ Saving...'; saveStatus.className = 'saving-indicator saving'; }

            try {
                const response = await fetch('/api/blogs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keyword, url, title: idea.currentTitle, perspective: idea.perspective })
                });
                const data = await response.json();
                if (saveStatus) {
                    saveStatus.textContent = data.success ? '✅ Saved to registry' : '❌ ' + (data.error || 'Save failed');
                    saveStatus.className = data.success ? 'saving-indicator' : 'saving-indicator error';
                }
            } catch (error) {
                console.error('Error saving:', error);
                if (saveStatus) { saveStatus.textContent = '❌ ' + error.message; saveStatus.className = 'saving-indicator error'; }
            }
        }

        // ============================================
        // UNDO WRITING
        // ============================================
        async function undoWriting(index) {
            const keyword = blogIdeas[index].currentKeyword;
            const wasBulk = notYetSaved.has(index);
            markedForWriting.delete(index);
            notYetSaved.delete(index);
            refreshAll();

            if (!wasBulk) {
                try {
                    await fetch('/api/blogs', {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ keyword })
                    });
                } catch (error) {
                    console.error('Error undoing:', error);
                }
            }
        }

        async function sendToSheet(index) {
            const idea = blogIdeas[index];
            const btn = document.getElementById(`sheet-btn-${index}`);
            const saveStatus = document.getElementById(`save-status-${index}`);

            btn.disabled = true;
            btn.textContent = '⏳ Sending...';

            try {
                const response = await fetch('/api/blogs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        keyword: idea.currentKeyword,
                        url: generateUrl(idea.currentTitle),
                        title: idea.currentTitle,
                        perspective: idea.perspective,
                        sheetsOnly: true
                    })
                });
                const data = await response.json();
                if (data.success || data.sheetsResult) {
                    notYetSaved.delete(index);
                    sentToSheet.add(index);
                    refreshAll();
                } else {
                    btn.disabled = false;
                    btn.textContent = '📤 Send to Google Sheet';
                    if (saveStatus) saveStatus.textContent = '❌ Sheet error: ' + (data.error || 'Unknown');
                }
            } catch (error) {
                console.error('Error sending to sheet:', error);
                btn.disabled = false;
                btn.textContent = '📤 Send to Google Sheet';
                if (saveStatus) saveStatus.textContent = '❌ ' + error.message;
            }
        }

        // ============================================
        // MARK FOR KEYWORD CHANGE
        // ============================================
        function markForKwChange(index) {
            markedForKwChange.add(index);
            selectedIdeas.delete(index);
            refreshAll();
            switchTab('kwchange');
        }

        // ============================================
        // UNDO KEYWORD CHANGE
        // ============================================
        function undoKwChange(index) {
            markedForKwChange.delete(index);
            refreshAll();
        }

        // ============================================
        // CONFIRM DELETE
        // ============================================
        async function confirmDelete(index) {
            const idea = blogIdeas[index];
            const keyword = idea.currentKeyword;

            const statusEl = document.getElementById(`kw-status-${index}`);
            if (statusEl) { statusEl.textContent = '⏳ Saving...'; statusEl.className = 'saving-indicator saving'; }

            try {
                const response = await fetch('/api/blogs', {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keyword })
                });
                const data = await response.json();

                if (data.success) {
                    markedForKwChange.delete(index);
                    blogIdeas = blogIdeas.filter(i => i.index !== index);
                    refreshAll();
                } else {
                    if (statusEl) { statusEl.textContent = '❌ ' + (data.error || 'Failed'); statusEl.className = 'saving-indicator error'; }
                }
            } catch (error) {
                console.error('Error deleting:', error);
                if (statusEl) { statusEl.textContent = '❌ ' + error.message; statusEl.className = 'saving-indicator error'; }
            }
        }

        // ============================================
        // SAVE NEW TITLE & RE-CHECK CANNIBALIZATION
        // ============================================
        function saveNewTitle(index) {
            const idea = blogIdeas[index];
            const input = document.getElementById(`new-title-${index}`);
            const btn = document.getElementById(`save-btn-${index}`);
            const statusEl = document.getElementById(`recheck-status-${index}`);
            const newTitle = input.value.trim();

            if (!newTitle || newTitle === idea.currentTitle) return;

            btn.disabled = true;
            btn.textContent = 'Checking...';
            if (statusEl) statusEl.textContent = '';

            // Derive keyword from title: strip leading question words, strip trailing ?
            const cleaned = newTitle
                .replace(/^(can i|how to|how do i|what is|what are|do i|does|is it|will|should i|why|when)\s+/i, '')
                .replace(/\?$/, '')
                .trim();

            const stopWords = new Set(['can','i','how','to','what','is','are','a','the','in','for','of','do','does','my','your','be','will','would','should','could','at','on','with','and','or','but','not','it','its','this','that','did','an','as','if','so','up','do']);

            const extractWords = (text) => text.toLowerCase()
                .replace(/[^a-z0-9\s]/g, '')
                .split(/\s+/)
                .filter(w => w.length > 2 && !stopWords.has(w));

            const newWords = extractWords(cleaned);

            let conflictLevel = 'NO CONFLICT';
            let conflictingKeyword = '';
            let conflictingUrl = '';

            for (const row of allRows) {
                const rowKeyword = (row['Keyword'] || '').trim();
                if (!rowKeyword) continue;
                // Skip the current idea's original keyword
                if (rowKeyword.toLowerCase() === idea.keyword.toLowerCase()) continue;

                const rowWords = extractWords(rowKeyword);
                const overlap = newWords.filter(w => rowWords.includes(w)).length;

                if (overlap >= 3) {
                    conflictLevel = 'DANGER';
                    conflictingKeyword = rowKeyword;
                    conflictingUrl = row['CONFLICTING BLOG URL'] || '';
                    break;
                } else if (overlap >= 2 && conflictLevel !== 'DANGER') {
                    conflictLevel = 'CAUTION';
                    conflictingKeyword = rowKeyword;
                    conflictingUrl = row['CONFLICTING BLOG URL'] || '';
                }
            }

            // Update idea
            idea.currentTitle = newTitle;
            idea.currentKeyword = cleaned;
            idea.cannibalization = conflictLevel;
            idea.conflictingKeyword = conflictingKeyword;
            idea.conflictingUrl = conflictingUrl;

            refreshAll();
        }

        // ============================================
        // INITIALIZE
        // ============================================
        loadData();

    </script>
</body>
</html>
