<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Manager Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        h1 { font-size: 32px; font-weight: 600; margin-bottom: 4px; color: #1a1a1a; }
        .version { color: #999999; font-size: 13px; margin-bottom: 30px; }

        .stats {
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 30px;
            font-size: 14px;
            color: #666666;
        }
        .stats strong { color: #1a1a1a; }

        .loading { text-align: center; padding: 60px 20px; color: #666666; font-size: 14px; }

        /* FILTER BAR */
        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-label { font-size: 13px; color: #666666; font-weight: 500; margin-right: 4px; }

        .btn-filter {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            border: 1px solid #e0e0e0;
            background: #ffffff;
            color: #666666;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-filter:hover { border-color: #1a1a1a; color: #1a1a1a; }
        .btn-filter.active-all  { background: #1a1a1a; color: #ffffff; border-color: #1a1a1a; }
        .btn-filter.active-green  { background: #66bb6a; color: #ffffff; border-color: #66bb6a; }
        .btn-filter.active-yellow { background: #ffa726; color: #ffffff; border-color: #ffa726; }
        .btn-filter.active-red    { background: #ef5350; color: #ffffff; border-color: #ef5350; }

        /* BULK ACTION ROW */
        .bulk-action-row {
            display: none;
            align-items: center;
            gap: 12px;
            background: #e3f2fd;
            border: 1px solid #2196F3;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
        }
        .bulk-action-row.visible { display: flex; }
        .bulk-action-info { font-size: 14px; font-weight: 600; color: #1565C0; flex: 1; }
        .btn-bulk-move {
            background: #2196F3; color: #ffffff; border: none;
            padding: 10px 22px; font-size: 14px; font-weight: 500;
            font-family: 'Poppins', sans-serif; border-radius: 6px;
            cursor: pointer; transition: all 0.2s ease;
        }
        .btn-bulk-move:hover { background: #1976D2; }
        .btn-bulk-clear {
            background: #ffffff; color: #666666; border: 1px solid #cccccc;
            padding: 10px 18px; font-size: 13px; font-weight: 500;
            font-family: 'Poppins', sans-serif; border-radius: 6px;
            cursor: pointer; transition: all 0.2s ease;
        }
        .btn-bulk-clear:hover { border-color: #999999; color: #1a1a1a; }

        /* IDEA CARD */
        .idea-card {
            background: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }
        .idea-card.green  { border-color: #66bb6a; background: #f1f8f4; }
        .idea-card.yellow { border-color: #ffa726; background: #fff8f1; }
        .idea-card.red    { border-color: #ef5350; background: #fff1f1; }
        .idea-card.grey   { border-color: #cccccc; background: #f9f9f9; }
        .idea-card.selected-card { outline: 3px solid #2196F3; outline-offset: 2px; }

        /* CHECKBOX */
        .card-checkbox {
            position: absolute; top: 16px; left: 16px;
            width: 20px; height: 20px; cursor: pointer; accent-color: #2196F3;
        }
        .idea-card .card-header { padding-left: 32px; }

        .card-header {
            display: flex; justify-content: space-between;
            align-items: flex-start; margin-bottom: 16px;
        }
        .card-number { font-size: 12px; font-weight: 600; color: #999999; }

        .status-badge { padding: 4px 12px; border-radius: 4px; font-size: 12px; font-weight: 500; }
        .badge-green  { background: #66bb6a; color: #ffffff; }
        .badge-yellow { background: #ffa726; color: #ffffff; }
        .badge-red    { background: #ef5350; color: #ffffff; }
        .badge-grey   { background: #9e9e9e; color: #ffffff; }

        .keyword     { font-size: 18px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
        .title       { font-size: 15px; color: #333333; margin-bottom: 8px; line-height: 1.5; }
        .perspective { font-size: 13px; color: #666666; font-style: italic; margin-bottom: 16px; }

        /* CONFLICT WARNING */
        .conflict-warning { border-radius: 6px; padding: 12px; margin-bottom: 16px; font-size: 13px; }
        .conflict-warning.yellow { background: #fff3e0; border: 1px solid #ffa726; color: #ef6c00; }
        .conflict-warning.red    { background: #ffebee; border: 1px solid #ef5350; color: #c62828; }
        .conflict-warning .conflict-label   { font-weight: 600; margin-bottom: 4px; }
        .conflict-warning .conflict-keyword { font-size: 13px; margin-bottom: 4px; }
        .conflict-warning .conflict-url     { font-size: 12px; }
        .conflict-warning .conflict-url a   { color: inherit; text-decoration: underline; }

        /* INLINE TITLE EDIT */
        .inline-edit-section {
            background: #f5f5f5; border-radius: 6px;
            padding: 12px 14px; margin-bottom: 16px;
        }
        .inline-edit-label {
            font-size: 12px; font-weight: 600; color: #666666;
            text-transform: uppercase; letter-spacing: 0.5px;
            margin-bottom: 8px; display: block;
        }
        .inline-edit-row { display: flex; gap: 8px; align-items: center; }
        .inline-edit-input {
            flex: 1; padding: 9px 12px; font-size: 14px;
            font-family: 'Poppins', sans-serif; background: #ffffff;
            border: 1px solid #e0e0e0; border-radius: 6px; color: #1a1a1a;
        }
        .inline-edit-input:focus { outline: none; border-color: #1a1a1a; }
        .btn-save-title {
            background: #1a1a1a; color: #ffffff; border: none;
            padding: 9px 18px; font-size: 13px; font-weight: 500;
            font-family: 'Poppins', sans-serif; border-radius: 6px;
            cursor: pointer; white-space: nowrap; transition: all 0.2s ease;
        }
        .btn-save-title:hover { background: #333333; }
        .btn-save-title:disabled { background: #cccccc; cursor: not-allowed; }

        /* TABS */
        .tabs {
            display: flex; gap: 0; margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }
        .tab-btn {
            padding: 12px 22px; font-size: 14px; font-weight: 500;
            font-family: 'Poppins', sans-serif; background: none; border: none;
            border-bottom: 3px solid transparent; margin-bottom: -2px;
            cursor: pointer; color: #666666; transition: all 0.2s ease;
        }
        .tab-btn:hover { color: #1a1a1a; }
        .tab-btn.active { color: #1a1a1a; border-bottom-color: #1a1a1a; font-weight: 600; }
        .tab-count {
            display: inline-block; background: #e0e0e0; color: #666666;
            border-radius: 12px; padding: 1px 8px; font-size: 12px; margin-left: 6px;
        }
        .tab-btn.active .tab-count { background: #1a1a1a; color: #ffffff; }

        .tab-content  { display: none; }
        .tab-content.active { display: block; }

        .empty-state { text-align: center; padding: 60px 20px; color: #999999; font-size: 14px; }

        /* CARD ACTION BUTTONS */
        .card-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

        .btn-mark {
            background: #2196F3; color: #ffffff; border: none;
            padding: 12px 24px; font-size: 14px; font-weight: 500;
            font-family: 'Poppins', sans-serif; border-radius: 6px;
            cursor: pointer; transition: all 0.2s ease; min-width: 160px;
        }
        .btn-mark:hover { background: #1976D2; }
        .btn-mark.marked { background: #66bb6a; }
        .btn-mark.marked:hover { background: #4caf50; }

        .btn-keyword-change {
            background: #ffffff; color: #ff9800; border: 1px solid #ff9800;
            padding: 12px 24px; font-size: 14px; font-weight: 500;
            font-family: 'Poppins', sans-serif; border-radius: 6px;
            cursor: pointer; transition: all 0.2s ease; min-width: 160px;
        }
        .btn-keyword-change:hover { background: #ff9800; color: #ffffff; }

        .btn-ignore {
            background: #ffffff; color: #9e9e9e; border: 1px solid #9e9e9e;
            padding: 12px 20px; font-size: 13px; font-weight: 500;
            font-family: 'Poppins', sans-serif; border-radius: 6px;
            cursor: pointer; transition: all 0.2s ease;
        }
        .btn-ignore:hover { background: #9e9e9e; color: #ffffff; }

        .btn-undo {
            background: #ffffff; color: #ef5350; border: 1px solid #ef5350;
            padding: 8px 16px; font-size: 13px; font-weight: 500;
            font-family: 'Poppins', sans-serif; border-radius: 6px;
            cursor: pointer; transition: all 0.2s ease; margin-left: 10px;
        }
        .btn-undo:hover { background: #ef5350; color: #ffffff; }

        .btn-send-sheet {
            background: #ffffff; color: #1976d2; border: 1px solid #1976d2;
            padding: 8px 16px; font-size: 13px; font-weight: 500;
            font-family: 'Poppins', sans-serif; border-radius: 6px;
            cursor: pointer; transition: all 0.2s ease;
        }
        .btn-send-sheet:hover { background: #1976d2; color: #ffffff; }
        .btn-send-sheet:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-delete {
            background: #ffffff; color: #ef5350; border: 1px solid #ef5350;
            padding: 8px 16px; font-size: 13px; font-weight: 500;
            font-family: 'Poppins', sans-serif; border-radius: 6px;
            cursor: pointer; transition: all 0.2s ease;
        }
        .btn-delete:hover { background: #ef5350; color: #ffffff; }

        /* MANUAL CONTENT SOURCES FORM (shown only when a send needs manual entry) */
        .manual-sources {
            display: none;
            margin-top: 16px;
            background: #fff8f1;
            border: 1px solid #ffa726;
            border-radius: 6px;
            padding: 14px 16px;
        }
        .manual-sources.visible { display: block; }
        .manual-msg { font-size: 13px; font-weight: 600; color: #ef6c00; margin-bottom: 12px; }
        .manual-input { display: block; width: 100%; margin-bottom: 8px; }

        /* STATUS INDICATORS */
        .saving-indicator { font-size: 12px; color: #66bb6a; margin-left: 10px; }
        .saving-indicator.saving  { color: #ffa726; }
        .saving-indicator.error   { color: #ef5350; }
        .saving-indicator.pending { color: #999999; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Blog Manager Tool</h1>
        <p class="version">v2.9 - 2026-06-15</p>

        <div class="stats" id="stats">Loading blog ideas...</div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('ideas')" id="tab-ideas">
                Blog Ideas <span class="tab-count" id="count-ideas">0</span>
            </button>
            <button class="tab-btn" onclick="switchTab('towrite')" id="tab-towrite">
                To Write <span class="tab-count" id="count-towrite">0</span>
            </button>
            <button class="tab-btn" onclick="switchTab('kwchange')" id="tab-kwchange">
                Keyword Change <span class="tab-count" id="count-kwchange">0</span>
            </button>
            <button class="tab-btn" onclick="switchTab('ignored')" id="tab-ignored">
                Ignored <span class="tab-count" id="count-ignored">0</span>
            </button>
        </div>

        <div class="tab-content active" id="panel-ideas">
            <div id="filter-bar" class="filter-bar" style="display:none;">
                <span class="filter-label">Filter:</span>
                <button class="btn-filter active-all" onclick="setFilter('all')">All</button>
                <button class="btn-filter" onclick="setFilter('green')">🟢 No Conflict</button>
                <button class="btn-filter" onclick="setFilter('yellow')">🟡 Caution</button>
                <button class="btn-filter" onclick="setFilter('red')">🔴 Danger</button>
            </div>
            <div class="bulk-action-row" id="bulk-action-row">
                <span class="bulk-action-info" id="bulk-action-info">0 selected</span>
                <button class="btn-bulk-clear" onclick="clearSelection()">Clear</button>
                <button class="btn-bulk-move" onclick="bulkMoveToWrite()">✓ Move selected to To Write</button>
            </div>
            <div id="ideas-container">
                <div class="loading">🔄 Loading blog ideas...</div>
            </div>
        </div>

        <div class="tab-content" id="panel-towrite">
            <div class="filter-bar" style="margin-bottom:14px;">
                <button class="btn-filter" onclick="selectAllUnsent()" style="background:#43a047;color:#fff;border-color:#43a047;">☑ Select All</button>
                <button class="btn-filter" onclick="clearToSendSelection()">Clear</button>
            </div>
            <div class="bulk-action-row" id="bulk-send-row">
                <span class="bulk-action-info" id="bulk-send-info">0 selected</span>
                <button class="btn-bulk-move" style="background:#43a047;" onclick="bulkSendToSheet()">📤 Send selected to Google Sheet</button>
            </div>
            <div id="towrite-container">
                <div class="empty-state">No blogs marked for writing yet.</div>
            </div>
        </div>

        <div class="tab-content" id="panel-kwchange">
            <div id="kwchange-container">
                <div class="empty-state">No keywords marked for change yet.</div>
            </div>
        </div>

        <div class="tab-content" id="panel-ignored">
            <div id="ignored-container">
                <div class="empty-state">No ideas ignored yet.</div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // DATA
        // ============================================
        let allIdeas = [];      // all non-DELETED ideas with their current status
        let allRows  = [];      // full CSV — for conflict re-check
        let selectedIdeas = new Set();
        let activeFilter = 'all';

        // STATUS values:
        // ''                 → Blog Ideas
        // 'TO_WRITE'         → To Write (saved to registry, NOT yet sent to Google Sheet)
        // 'TO_WRITE_PENDING' → To Write (bulk-moved, not yet saved to registry)
        // 'TO_WRITE_SENT'    → To Write (sent to Google Sheet — grey, locked)
        // 'KEYWORD_CHANGE'   → Keyword Change
        // 'IGNORED'          → Ignored
        // 'DELETED'          → hidden everywhere

        let selectedToSend = new Set(); // selection in To Write tab for bulk sheet send

        // ============================================
        // GALLERY DATA
        // ============================================
        const GALLERIES = [
            { name: 'BLACK WHITE HOME DECOR',           code: 39719, url: 'https://aboutwallart.com/collections/black-white-home-decor', keywords: ['black','white','monochrome','monochromatic','b&w'] },
            { name: 'BIOPHILIC INTERIOR DESIGN',        code: 39711, url: 'https://aboutwallart.com/collections/biophilic-interior-design', keywords: ['biophilic','botanical','nature','plant','green','organic','leaf','jungle'] },
            { name: 'BOHO HOME DECOR',                  code: 37190, url: 'https://aboutwallart.com/collections/boho-home-decor-1', keywords: ['boho','bohemian','eclectic','free spirit','wanderlust'] },
            { name: 'MID CENTURY HOME DECOR',           code: 37144, url: 'https://aboutwallart.com/collections/mid-century-decor', keywords: ['mid century','mid-century','midcentury','retro','vintage modern'] },
            { name: 'COASTAL HOME DECOR',               code: 37192, url: 'https://aboutwallart.com/collections/coastal-home-decor', keywords: ['coastal','beach','ocean','sea','nautical','seaside','maritime','surf'] },
            { name: 'COFFEE HOUSE INTERIOR DESIGN',     code: 39717, url: 'https://aboutwallart.com/collections/coffee-house-interior-design', keywords: ['coffee','cafe','bistro','coffee house','barista'] },
            { name: 'MODERN CONTEMPORARY HOME DECOR',   code: 37194, url: 'https://aboutwallart.com/collections/contemporary-home-decor', keywords: ['modern','contemporary','sleek','clean lines','minimalist modern'] },
            { name: 'ECLECTIC MAXIMALIST HOME DECOR',   code: 37195, url: 'https://aboutwallart.com/collections/eclectic-maximalist-home-decor', keywords: ['eclectic','maximalist','maximalism','bold','colourful','colorful','vibrant','mix'] },
            { name: 'COUNTRY COTTAGE HOME DECOR',       code: 37204, url: 'https://aboutwallart.com/collections/country-cottage-home-decor', keywords: ['country','cottage','rustic','farmhouse cottage','cozy country'] },
            { name: 'MODERN FARMHOUSE HOME DECOR',      code: 37197, url: 'https://aboutwallart.com/collections/modern-farmhouse-home-decor', keywords: ['farmhouse','modern farmhouse','shiplap','barn','rural'] },
            { name: 'FRENCH COUNTRY HOME DECOR',        code: 37198, url: 'https://aboutwallart.com/collections/french-country-home-decor', keywords: ['french country','french','provence','parisian','paris'] },
            { name: 'INDUSTRIAL HOME DECOR',            code: 37199, url: 'https://aboutwallart.com/collections/industrial-home-decor', keywords: ['industrial','loft','urban','exposed brick','concrete','metal'] },
            { name: 'JAPANDI HOME DECOR',               code: 37200, url: 'https://aboutwallart.com/collections/japandi-home-decor', keywords: ['japandi','japanese','wabi sabi','zen japanese','nordic japanese'] },
            { name: 'MEDITERRANEAN HOME DECOR',         code: 37201, url: 'https://aboutwallart.com/collections/mediterranean-home-decor', keywords: ['mediterranean','greek','italian','tuscan','terracotta','villa'] },
            { name: 'COSY MINIMALISM HOME DECOR',       code: 37202, url: 'https://aboutwallart.com/collections/cosy-minimalism-home-decor', keywords: ['minimalist','minimalism','minimal','cosy minimalism','hygge','simple'] },
            { name: 'MORROCCAN HOME DECOR',             code: 37203, url: 'https://aboutwallart.com/collections/moroccan-home-decor', keywords: ['moroccan','morocco','boho moroccan','exotic','arabesque','marrakech'] },
            { name: 'SCANDI HOME DECOR',                code: 37205, url: 'https://aboutwallart.com/collections/scandi-home-decor-2', keywords: ['scandi','scandinavian','nordic','hygge','danish','swedish','norwegian'] },
            { name: 'WILDLIFE HOME DECOR',              code: 37206, url: 'https://aboutwallart.com/collections/wildlife-home-decor', keywords: ['wildlife','animal','nature art','birds','forest','wild','safari'] },
            { name: 'MASCULINE LIVING ROOM IDEAS',      code: 39718, url: 'https://aboutwallart.com/collections/masculine-living-room-ideas', keywords: ['masculine','men','gentleman','dark','moody','bold masculine'] },
            { name: 'OLD MONEY HOME DECOR',             code: 39716, url: 'https://aboutwallart.com/collections/old-money-home-decor', keywords: ['old money','luxury','elegant','classic','opulent','grand','aristocratic'] },
            { name: 'PREPPY STYLE INTERIORS',           code: 39715, url: 'https://aboutwallart.com/collections/preppy-style-interiors', keywords: ['preppy','collegiate','ivy league','classic preppy','nautical preppy'] },
            { name: 'TRANSITIONAL INTERIOR DESIGN',     code: 39714, url: 'https://aboutwallart.com/collections/transitional-interior-design', keywords: ['transitional','classic modern','blend','timeless'] },
            { name: 'TROPICAL DECOR FOR HOME',          code: 39713, url: 'https://aboutwallart.com/collections/tropical-decor-for-home', keywords: ['tropical','palm','jungle','exotic tropical','island','hawaii'] },
            { name: 'ZEN ROOM DECORATIONS',             code: 39712, url: 'https://aboutwallart.com/collections/zen-room-decorations', keywords: ['zen','meditation','peaceful','calm','serene','spiritual','yoga'] },
            { name: 'MODERN GLAM LUXE INTERIORS',       code: 37177, url: 'https://aboutwallart.com/collections/modern-glam-luxe-interiors', keywords: ['glam','glamorous','luxe','gold','velvet','hollywood','glitter'] }
        ];

        function matchGallery(keyword, title) {
            const text = (keyword + ' ' + title).toLowerCase();
            let bestMatch = null, bestScore = 0;
            for (const g of GALLERIES) {
                let score = 0;
                for (const kw of g.keywords) {
                    if (text.includes(kw.toLowerCase())) score++;
                }
                if (score > bestScore) { bestScore = score; bestMatch = g; }
            }
            // Default to TRANSITIONAL if no match
            return bestMatch || GALLERIES.find(g => g.code === 39714);
        }

        // ============================================
        // TAB SWITCHING
        // ============================================
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(p => p.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.getElementById(`panel-${tab}`).classList.add('active');
            if (tab !== 'ideas') clearSelection();
        }

        function updateTabCounts() {
            document.getElementById('count-ideas').textContent    = allIdeas.filter(i => i.status === '').length;
            document.getElementById('count-towrite').textContent  = allIdeas.filter(i => i.status === 'TO_WRITE' || i.status === 'TO_WRITE_PENDING').length;
            document.getElementById('count-kwchange').textContent = allIdeas.filter(i => i.status === 'KEYWORD_CHANGE').length;
            document.getElementById('count-ignored').textContent  = allIdeas.filter(i => i.status === 'IGNORED').length;
        }

        // ============================================
        // FILTER
        // ============================================
        function setFilter(filter) {
            activeFilter = filter;
            document.querySelectorAll('.btn-filter').forEach(b => { b.className = 'btn-filter'; });
            const btn = document.querySelector(`.btn-filter[onclick="setFilter('${filter}')"]`);
            if (btn) btn.classList.add(`active-${filter}`);
            clearSelection();
            displayIdeas();
        }

        // ============================================
        // SELECTION
        // ============================================
        function toggleSelect(index) {
            if (selectedIdeas.has(index)) selectedIdeas.delete(index);
            else selectedIdeas.add(index);
            const card = document.getElementById(`card-${index}`);
            const cb   = document.getElementById(`cb-${index}`);
            if (card) card.classList.toggle('selected-card', selectedIdeas.has(index));
            if (cb)   cb.checked = selectedIdeas.has(index);
            updateBulkBar();
        }

        function clearSelection() {
            selectedIdeas.clear();
            document.querySelectorAll('.card-checkbox').forEach(cb => { cb.checked = false; });
            document.querySelectorAll('.idea-card').forEach(c => c.classList.remove('selected-card'));
            updateBulkBar();
        }

        function updateBulkBar() {
            const row  = document.getElementById('bulk-action-row');
            const info = document.getElementById('bulk-action-info');
            if (!row) return;
            const n = selectedIdeas.size;
            if (n > 0) {
                info.textContent = `${n} idea${n > 1 ? 's' : ''} selected`;
                row.classList.add('visible');
            } else {
                row.classList.remove('visible');
            }
        }

        // ============================================
        // BULK MOVE TO TO WRITE
        // ============================================
        async function bulkMoveToWrite() {
            if (selectedIdeas.size === 0) return;
            const keywords = [];
            selectedIdeas.forEach(idx => {
                const idea = allIdeas.find(i => i.index === idx);
                if (idea) { idea.status = 'TO_WRITE_PENDING'; keywords.push(idea.keyword); }
            });
            clearSelection();
            refreshAll();
            switchTab('towrite');

                await fetch('/api/blogs', {

                });
            } catch(e) { console.error('Bulk save failed:', e); }

        // ============================================
        // CSV PARSER
        // ============================================
        function parseCSV(text) {
            const lines = text.split('\n');
            const headers = parseCSVLine(lines[0]);
            const rows = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim().replace(/\r/g, '');
                if (!line) continue;
                const cols = parseCSVLine(line);
                const row = {};
                headers.forEach((h, idx) => { row[h.trim()] = cols[idx] || ''; });
                rows.push(row);
            }
            return rows;
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') { inQuotes = !inQuotes; }
                else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
                else { current += char; }
            }
            result.push(current.trim());
            return result;
        }

        // ============================================
        // SLUG GENERATOR
        // ============================================
        function generateUrl(title) {
            const slug = title.toLowerCase()
                .replace(/[^a-z0-9\s-]/g, '')
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-')
                .replace(/^-|-$/g, '');
            return `https://aboutwallart.com/blogs/news-articles-home-decor-inspiration/${slug}`;
        }

        // ============================================
        // LOAD DATA FROM GITHUB CSV
        // ============================================
        async function loadData() {
            try {
                const csvUrl = 'https://raw.githubusercontent.com/aboutwallart/seo-tools/main/data/blog_ideas.csv';
                const response = await fetch(csvUrl);
                if (!response.ok) throw new Error(`Failed to fetch CSV: ${response.status}`);
                const csvText = await response.text();
                const rows = parseCSV(csvText);
                allRows = rows;

                let idxCounter = 0;
                allIdeas = [];

                for (const row of rows) {
                    const status = (row['STATUS'] || '').trim();
                    if (status === 'DELETED') continue;
                    // Accept TO_WRITE_SENT as valid persisted status
                    allIdeas.push({
                        index: idxCounter++,
                        keyword: row['Keyword'] || '',
                        title: row['Blog Post Title'] || '',
                        perspective: row['Perspective'] || '',
                        cannibalization: row['CANNIBALIZATION'] || 'NO CONFLICT',
                        conflictingKeyword: row['CONFLICTING KEYWORD'] || '',
                        conflictingUrl: row['CONFLICTING BLOG URL'] || '',
                        currentTitle: row['Blog Post Title'] || '',
                        currentKeyword: row['Keyword'] || '',
                        status: status
                    });
                }

                // Stats based on Blog Ideas only
                const ideasOnly = allIdeas.filter(i => i.status === '');
                const green = ideasOnly.filter(i => i.cannibalization === 'NO CONFLICT').length;
                const yellow = ideasOnly.filter(i => i.cannibalization === 'CAUTION').length;
                const red    = ideasOnly.filter(i => i.cannibalization === 'DANGER').length;

                document.getElementById('stats').innerHTML = `
                    <strong>Loaded:</strong> ${allIdeas.length} blog ideas &nbsp;|&nbsp;
                    🟢 ${green} No Conflict &nbsp;|&nbsp;
                    🟡 ${yellow} Caution &nbsp;|&nbsp;
                    🔴 ${red} Danger
                `;

                document.getElementById('filter-bar').style.display = 'flex';
                updateTabCounts();
                refreshAll();

            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('stats').innerHTML = `<strong>Error:</strong> ${error.message}`;
                document.getElementById('ideas-container').innerHTML = `<div class="loading">❌ Could not load blog ideas.</div>`;
            }
        }

            else if (activeFilter === 'red')    visible = visible.filter(i => i.cannibalization === 'DANGER');

            const container = document.getElementById('towrite-container');
            const all = allIdeas.filter(i => ['TO_WRITE','TO_WRITE_PENDING','TO_WRITE_SENT'].includes(i.status));
            if (all.length === 0) {

            // Unsent on top, sent (grey) at bottom

            const sent   = all.filter(i => i.status === 'TO_WRITE_SENT');
            container.innerHTML = [...unsent, ...sent].map(idea => buildIdeaCard(idea, 'towrite')).join('');
            updateBulkSendBar();

            const cb   = document.getElementById(`ts-cb-${index}`);
            if (card) card.classList.toggle('selected-card', selectedToSend.has(index));

        function updateBulkSendBar() {

            const n = selectedToSend.size;
            if (n > 0) {
                info.textContent = `${n} blog${n > 1 ? 's' : ''} selected`;
                row.classList.add('visible');
            } else {
                row.classList.remove('visible');
            }
        }

            const indices = [...selectedToSend];
            clearToSendSelection();
            for (const idx of indices) {

        // ============================================
        // BUILD CARD HTML
        // ============================================
        function buildIdeaCard(idea, tab) {
            const level = idea.cannibalization;
            const cardClass = level === 'NO CONFLICT' ? 'green' : level === 'CAUTION' ? 'yellow' : 'red';
            const badgeClass = level === 'NO CONFLICT' ? 'badge-green' : level === 'CAUTION' ? 'badge-yellow' : 'badge-red';
            const index = idea.index;
            const isSelected = selectedIdeas.has(index);

            let checkboxHTML = '';
            let actionsHTML = '';
            let cardExtraClass = cardClass;

            if (tab === 'ideas') {
                checkboxHTML = `<input type="checkbox" class="card-checkbox" id="cb-${index}" ${isSelected ? 'checked' : ''} onchange="toggleSelect(${index})">`;
                actionsHTML = `
                    <button class="btn-mark" onclick="markForWriting(${index})">Mark for Writing</button>
                    <button class="btn-keyword-change" onclick="markForKwChange(${index})">Change Keyword</button>
                    ${level !== 'NO CONFLICT' ? `<button class="btn-ignore" onclick="ignoreIdea(${index})">Ignore</button>` : ''}
                `;
            } else if (tab === 'towrite') {
                const isSent = idea.status === 'TO_WRITE_SENT';

                if (isSent) {
                    cardExtraClass = 'grey';
                    actionsHTML = `
                        <button class="btn-mark marked" disabled style="opacity:0.5;">✓ To Write Blog</button>
                        <span class="saving-indicator" style="color:#66bb6a;">✅ Sent to Google Sheet</span>
                        <button class="btn-undo" onclick="undoWriting(${index})">↩ Undo</button>
                    `;
                } else {
                    // TO_WRITE or TO_WRITE_PENDING — not yet sent to Google Sheet
                    checkboxHTML = `<input type="checkbox" class="ts-checkbox card-checkbox" id="ts-cb-${index}" onchange="toggleToSend(${index})">`;
                    const saveText  = idea.status === 'TO_WRITE' ? '✅ Saved to registry' : '⏳ Not saved yet';
                    const saveClass = idea.status === 'TO_WRITE' ? 'saving-indicator' : 'saving-indicator pending';
                    actionsHTML = `
                        <button class="btn-mark marked" disabled>✓ To Write Blog</button>
                        <button class="btn-undo" onclick="undoWriting(${index})">↩ Undo</button>
                        <button class="btn-send-sheet" id="sheet-btn-${index}" onclick="sendToSheet(${index})">📤 Send to Google Sheet</button>
                        <span class="${saveClass}" id="save-status-${index}">${saveText}</span>
                    `;
                }
            } else if (tab === 'kwchange') {
                actionsHTML = `
                    <button class="btn-keyword-change" style="opacity:0.6;cursor:default" disabled>⚠ Keyword Change</button>
                    <button class="btn-undo" onclick="undoKwChange(${index})">↩ Undo</button>
                    <button class="btn-delete" onclick="confirmDelete(${index})">🗑 Delete</button>
                    <span class="saving-indicator" id="kw-status-${index}"></span>
                `;
            } else if (tab === 'ignored') {
                cardExtraClass = 'grey';
                actionsHTML = `
                    <button class="btn-ignore" style="opacity:0.6;cursor:default" disabled>⚪ Ignored</button>
                    <button class="btn-undo" onclick="undoIgnore(${index})">↩ Back to Ideas</button>
                    <span class="saving-indicator" id="ig-status-${index}"></span>
                `;
            }

            const conflictHTML = level !== 'NO CONFLICT' && tab === 'ideas' ? `
                <div class="conflict-warning ${cardClass}">
                    <div class="conflict-label">
                        ${level === 'DANGER' ? '🔴 Cannibalization Danger' : '🟡 Caution - Similar Intent'}
                    </div>
                    <div class="conflict-keyword"><strong>Conflicting Keyword:</strong> ${idea.conflictingKeyword}</div>
                    ${idea.conflictingUrl ? `<div class="conflict-url"><strong>Conflicting Blog:</strong> <a href="${idea.conflictingUrl}" target="_blank">${idea.conflictingUrl}</a></div>` : ''}
                </div>
                <div class="inline-edit-section">
                    <span class="inline-edit-label">Change title &amp; re-check</span>
                    <div class="inline-edit-row">
                        <input type="text" class="inline-edit-input" id="new-title-${index}" value="${idea.currentTitle.replace(/"/g, '&quot;')}" placeholder="Enter new blog title...">
                        <button class="btn-save-title" id="save-btn-${index}" onclick="saveNewTitle(${index})">Save &amp; Re-check</button>
                    </div>
                </div>
            ` : '';

            // Manual content-sources form — only on unsent To Write cards. Hidden until a send needs manual entry.
            const manualFormHTML = (tab === 'towrite' && idea.status !== 'TO_WRITE_SENT') ? `
                <div class="manual-sources" id="manual-${index}">
                    <div class="manual-msg" id="manual-msg-${index}"></div>
                    <span class="inline-edit-label">Authority article</span>
                    <input type="text" class="inline-edit-input manual-input" id="ms-at-${index}" placeholder="Article title">
                    <input type="text" class="inline-edit-input manual-input" id="ms-au-${index}" placeholder="Article link (https://...)">
                    <span class="inline-edit-label" style="margin-top:10px;">YouTube video</span>
                    <input type="text" class="inline-edit-input manual-input" id="ms-yt-${index}" placeholder="Video title">
                    <input type="text" class="inline-edit-input manual-input" id="ms-yl-${index}" placeholder="Video link (https://www.youtube.com/watch?v=...)">
                    <button class="btn-mark" style="margin-top:10px;" id="ms-send-${index}" onclick="sendToSheetManual(${index})">📤 Send with these details</button>
                </div>
            ` : '';

            return `
                <div class="idea-card ${tab === 'ignored' ? 'grey' : cardClass}${isSelected ? ' selected-card' : ''}" id="card-${index}">
                    ${checkboxHTML}
                    <div class="card-header">
                        <span class="card-number">#${index + 1}</span>
                        <span class="status-badge ${tab === 'ignored' ? 'badge-grey' : badgeClass}">${tab === 'ignored' ? 'IGNORED' : level}</span>
                    </div>
                    <div class="keyword">${idea.currentKeyword}</div>
                    <div class="title">${idea.currentTitle}</div>
                    <div class="perspective">${idea.perspective}</div>
                    ${conflictHTML}
                    <div class="card-actions">${actionsHTML}</div>
                    ${manualFormHTML}
                </div>
            `;
        }

        // ============================================
        // MARK FOR WRITING (single — saves to registry + sheets)
        // ============================================
        async function markForWriting(index) {
            const idea = allIdeas.find(i => i.index === index);
            if (!idea) return;
            idea.status = 'TO_WRITE';
            selectedIdeas.delete(index);
            refreshAll();
            switchTab('towrite');

            const saveStatus = document.getElementById(`save-status-${index}`);
            if (saveStatus) { saveStatus.textContent = '⏳ Saving...'; saveStatus.className = 'saving-indicator saving'; }

            try {
                const response = await fetch('/api/blogs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keyword: idea.currentKeyword, url: generateUrl(idea.currentTitle), title: idea.currentTitle, perspective: idea.perspective })
                });
                const data = await response.json();
                if (saveStatus) {
                    saveStatus.textContent = data.success ? '✅ Saved to registry' : '❌ ' + (data.error || 'Save failed');
                    saveStatus.className = data.success ? 'saving-indicator' : 'saving-indicator error';
                }
            } catch(e) {
                if (saveStatus) { saveStatus.textContent = '❌ ' + e.message; saveStatus.className = 'saving-indicator error'; }
            }
        }

        // ============================================
        // UNDO WRITING
        // ============================================
        async function undoWriting(index) {
            const idea = allIdeas.find(i => i.index === index);
            if (!idea) return;
            const prevStatus = idea.status;
            idea.status = '';
            selectedToSend.delete(index);
            refreshAll();

            try {
                if (prevStatus === 'TO_WRITE_PENDING' || prevStatus === 'TO_WRITE_SENT') {
                    await fetch('/api/blogs', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'update-blog-status', keyword: idea.keyword, status: '' })
                    });
                } else {
                    // TO_WRITE = saved to registry, use DELETE to remove from registry
                    await fetch('/api/blogs', {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ keyword: idea.keyword })
                    });
                }
            } catch(e) { console.error('Undo error:', e); }
        }

        // ============================================
        // SEND TO GOOGLE SHEET
        // ============================================
        async function sendToSheet(index) {
            const idea = allIdeas.find(i => i.index === index);
            if (!idea) return;
            const btn = document.getElementById(`sheet-btn-${index}`);
            const saveStatus = document.getElementById(`save-status-${index}`);

            btn.disabled = true;
            btn.textContent = '⏳ Sending...';

            try {
                const gallery = matchGallery(idea.currentKeyword, idea.currentTitle);
                const response = await fetch('/api/blogs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'send-to-sheet',
                        keyword: idea.currentKeyword,
                        title: idea.currentTitle,
                        perspective: idea.perspective,
                        galleryCode: gallery.code,
                        collectionUrl: gallery.url
                    })
                });
                const data = await response.json();
                if (data.success) {
                    idea.status = 'TO_WRITE_SENT';
                    selectedToSend.delete(index);
                    await fetch('/api/blogs', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'update-blog-status', keyword: idea.keyword, status: 'TO_WRITE_SENT' })
                    }).catch(() => {});
                    refreshAll();
                } else if (data.needsManual) {
                    // Search couldn't complete — open the manual boxes, prefilling whatever was found
                    const found = data.found || {};
                    const set = (id, val) => { const el = document.getElementById(id); if (el) el.value = val || ''; };
                    set(`ms-at-${index}`, found.authorityTitle);
                    set(`ms-au-${index}`, found.authorityUrl);
                    set(`ms-yt-${index}`, found.youtubeTitle);
                    set(`ms-yl-${index}`, found.youtubeLink);
                    const msg = document.getElementById(`manual-msg-${index}`);
                    if (msg) msg.textContent = '⚠ ' + (data.error || 'Please complete the missing details below, then send.');
                    const form = document.getElementById(`manual-${index}`);
                    if (form) form.classList.add('visible');
                    if (btn) { btn.disabled = false; btn.textContent = '📤 Send to Google Sheet'; }
                    if (saveStatus) saveStatus.textContent = '';
                } else {
                    if (btn) { btn.disabled = false; btn.textContent = '📤 Send to Google Sheet'; }
                    if (saveStatus) saveStatus.textContent = '❌ ' + (data.error || 'Unknown error');
                }
            } catch(e) {
                if (btn) { btn.disabled = false; btn.textContent = '📤 Send to Google Sheet'; }
                if (saveStatus) saveStatus.textContent = '❌ ' + e.message;
            }
        }

        // ============================================
        // SEND TO GOOGLE SHEET — MANUAL (after auto-search left something blank)
        // ============================================
        async function sendToSheetManual(index) {
            const idea = allIdeas.find(i => i.index === index);

            const at = (document.getElementById(`ms-at-${index}`).value || '').trim();

            if (!at || !au || !yt || !yl) {

            if (btn) { btn.disabled = true; btn.textContent = '⏳ Sending...'; }

            try {
                const gallery = matchGallery(idea.currentKeyword, idea.currentTitle);
                const response = await fetch('/api/blogs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'send-to-sheet', manual: true,
                        keyword: idea.currentKeyword,
                        title: idea.currentTitle,
                        perspective: idea.perspective,
                        galleryCode: gallery.code,
                        collectionUrl: gallery.url,
                        authorityTitle: at, authorityUrl: au, youtubeTitle: yt, youtubeLink: yl
                    })
                });
                const data = await response.json();
                if (data.success) {
                    idea.status = 'TO_WRITE_SENT';
                    selectedToSend.delete(index);
                    await fetch('/api/blogs', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'update-blog-status', keyword: idea.keyword, status: 'TO_WRITE_SENT' })
                    }).catch(() => {});

                } else {
                    if (msg) msg.textContent = '❌ ' + (data.error || 'Could not send — please check the details.');
                    if (btn) { btn.disabled = false; btn.textContent = '📤 Send with these details'; }
                }
            } catch(e) {
                if (msg) msg.textContent = '❌ ' + e.message;
                if (btn) { btn.disabled = false; btn.textContent = '📤 Send with these details'; }
            }
        }

            if (!idea) return;
            const statusEl = document.getElementById(`ig-status-${index}`);
            if (statusEl) { statusEl.textContent = '⏳ Moving...'; statusEl.className = 'saving-indicator saving'; }
            idea.status = '';
            refreshAll();

            try {
                await fetch('/api/blogs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'update-blog-status', keyword: idea.keyword, status: '' })
                });
            } catch(e) { console.error('Undo ignore error:', e); }
        }

        // ============================================
        // SAVE NEW TITLE & RE-CHECK CANNIBALIZATION
        // ============================================
        function saveNewTitle(index) {
            const idea = allIdeas.find(i => i.index === index);
            if (!idea) return;
            const input = document.getElementById(`new-title-${index}`);
            const btn   = document.getElementById(`save-btn-${index}`);
            const newTitle = input.value.trim();
            if (!newTitle || newTitle === idea.currentTitle) return;

            btn.disabled = true;
            btn.textContent = 'Checking...';

            const cleaned = newTitle
                .replace(/^(can i|how to|how do i|what is|what are|do i|does|is it|will|should i|why|when)\s+/i, '')
                .replace(/\?$/, '').trim();

            const stopWords = new Set(['can','i','how','to','what','is','are','a','the','in','for','of','do','does','my','your','be','will','would','should','could','at','on','with','and','or','but','not','it','its','this','that','did','an','as','if','so','up']);

            const extractWords = (text) => text.toLowerCase()
                .replace(/[^a-z0-9\s]/g, '').split(/\s+/)
                .filter(w => w.length > 2 && !stopWords.has(w));

            const newWords = extractWords(cleaned);
            let conflictLevel = 'NO CONFLICT', conflictingKeyword = '', conflictingUrl = '';

            for (const row of allRows) {
                const rowKeyword = (row['Keyword'] || '').trim();
                if (!rowKeyword || rowKeyword.toLowerCase() === idea.keyword.toLowerCase()) continue;
                const rowWords = extractWords(rowKeyword);
                const overlap = newWords.filter(w => rowWords.includes(w)).length;
                if (overlap >= 3) {
                    conflictLevel = 'DANGER'; conflictingKeyword = rowKeyword;
                    conflictingUrl = row['CONFLICTING BLOG URL'] || ''; break;
                } else if (overlap >= 2 && conflictLevel !== 'DANGER') {
                    conflictLevel = 'CAUTION'; conflictingKeyword = rowKeyword;
                    conflictingUrl = row['CONFLICTING BLOG URL'] || '';
                }
            }

            idea.currentTitle = newTitle;
            idea.currentKeyword = cleaned;
            idea.cannibalization = conflictLevel;
            idea.conflictingKeyword = conflictingKeyword;
            idea.conflictingUrl = conflictingUrl;

            refreshAll();
        }

        // ============================================
        // INITIALIZE
        // ============================================
        loadData();
    </script>
</body>
</html>
