<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Product Generator</title>
<style>
  :root{
    --bg:#f4f5f6; --card:#ffffff; --border:#e1e3e5; --border-strong:#c9cccf;
    --ink:#1a1a1a; --muted:#6b7177; --accent:#1f5f4f; --accent-soft:#e7f1ee;
    --chip:#f0f1f2; --danger:#b3261e; --ok:#1f7a4d; --warn:#8a6d1a;
    --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;line-height:1.45}
  .topbar{background:#fff;border-bottom:1px solid var(--border);padding:14px 22px;
    display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
  .topbar h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
  .ver{font-size:11px;color:var(--muted);background:var(--chip);border-radius:20px;padding:3px 9px}
  .tag{font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:20px;padding:3px 10px;font-weight:600}
  .wrap{max-width:1040px;margin:22px auto;padding:0 18px 80px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:22px;margin-bottom:20px}
  .card h2{font-size:15px;margin:0 0 4px;font-weight:650}
  .card .sub{color:var(--muted);font-size:12.5px;margin:0 0 18px}
  label.f{display:block;font-weight:600;font-size:12.5px;margin:0 0 6px}
  .req{color:var(--danger);font-weight:700}
  input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--border-strong);
    border-radius:9px;font-size:14px;background:#fff}
  input[type=text]:focus,.sel:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  input:disabled{background:#f4f5f6;color:var(--muted);cursor:not-allowed}
  .field{margin-bottom:20px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .block{border-top:1px solid var(--border);padding-top:18px;margin-top:6px}
  .block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .block-head h3{font-size:13px;margin:0;font-weight:650;text-transform:uppercase;letter-spacing:.4px;color:#3a3f45}
  .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 22px}
  .colgroup h4{font-size:12px;margin:0 0 8px;font-weight:700;color:var(--ink)}
  .opt{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;color:#33383d;cursor:pointer}
  .opt input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
  .trend-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 22px}
  .radios{display:flex;gap:10px;flex-wrap:wrap}
  .radio{border:1px solid var(--border-strong);border-radius:9px;padding:9px 16px;font-size:13px;
    cursor:pointer;display:flex;align-items:center;gap:8px;background:#fff}
  .radio input{accent-color:var(--accent)}
  .radio.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
  .btn{border:none;border-radius:9px;padding:11px 20px;font-size:13.5px;font-weight:600;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.primary{background:var(--ink);color:#fff}
  .btn.primary:hover:not(:disabled){background:#000}
  .btn.ghost{background:#fff;border:1px solid var(--border-strong);color:var(--ink)}
  .btn.small{padding:6px 12px;font-size:12px}
  .btn.link{background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font-size:12.5px}
  .actions{display:flex;gap:10px;margin-top:8px}
  .sel{width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:9px;font-size:14px;background:#fff}
  .pcrow{display:flex;gap:6px;margin-bottom:6px}
  .pcrow input{flex:1}
  .pcx{border:1px solid var(--border-strong);background:#fff;border-radius:8px;width:36px;cursor:pointer;color:var(--muted);font-size:17px;line-height:1}
  .pcx:hover{color:var(--danger);border-color:var(--danger)}
  .addbox{background:#fafbfb;border:1px dashed var(--border-strong);border-radius:10px;padding:14px;margin-top:12px;display:none}
  .addbox.open{display:block}
  .addbox .arow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .addbox .arow > div{flex:1;min-width:160px}
  .groupchecks{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
  .groupchecks label{font-size:12.5px;display:flex;gap:6px;align-items:center;color:#33383d}
  .empty{color:var(--muted);font-size:13px;padding:6px 0}
  .msg{padding:10px 14px;border-radius:9px;font-size:13px;margin-bottom:14px;display:none}
  .msg.show{display:block}
  .msg.ok{background:#e4f3ea;color:#155f3a}
  .msg.err{background:#fbe6e4;color:#8f1c16}
  .msg.info{background:#eef3fb;color:#1e3a63}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* ---------- STEPPER ---------- */
  .step{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
  .step-open{padding:22px}
  .step-num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;flex:none}
  .step-title{font-size:15px;font-weight:650}
  .step-openhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  /* collapsed one-line row */
  .steprow{display:flex;align-items:center;gap:10px;padding:15px 20px;cursor:default}
  .steprow .step-num{background:var(--ok)}
  .steprow .srsummary{font-weight:600;font-size:13.5px}
  .steprow .srextra{color:var(--muted);font-size:12.5px;font-weight:400}
  .steprow .sredit{margin-left:auto}
  .steprow.locked{opacity:.4}
  .steprow.locked .step-num{background:var(--border-strong)}
  .steprow .kwchanged{margin-left:8px;font-size:11px;color:var(--warn);background:#fbf3d8;border-radius:20px;padding:2px 9px;font-weight:600}
  /* add product empty state */
  .addprod{background:var(--card);border:1px dashed var(--border-strong);border-radius:var(--radius);
    padding:40px 22px;text-align:center;box-shadow:var(--shadow)}
  .addprod p{color:var(--muted);margin:0 0 16px;font-size:13px}
  /* shared images strip */
  .sharedstrip{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--muted);
    background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 16px;margin-bottom:16px}
  .sharedstrip .sst{font-weight:600;color:var(--ink)}
  .sharedstrip button{margin-left:auto}
  /* keyword results */
  .kwblock{border:1px solid var(--border);border-radius:10px;padding:14px 16px}
  .kwblock h4{margin:0 0 10px;font-size:13.5px}
  .kwrow{display:grid;grid-template-columns:1fr 90px 90px 110px 90px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #f0f1f2;font-size:13px}
  .kwrow.hd{border-top:none;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px}
  .kwrow .kw{font-weight:600}
  .diff-e{color:var(--ok);font-weight:600}.diff-m{color:var(--warn);font-weight:600}.diff-h{color:var(--danger);font-weight:600}
  .intent{font-size:11px;background:var(--chip);border-radius:20px;padding:2px 8px}
  .comingsoon{border:1px solid #e6d9a8;background:#fdf9ec;border-radius:10px;padding:14px 16px;margin-top:14px}
  .comingsoon .cshead{display:flex;align-items:center;gap:8px;font-weight:650;font-size:13px;color:#6b551a}
  .csbadge{font-size:10.5px;font-weight:700;color:#6b551a;background:#f3e6b8;border-radius:20px;padding:2px 9px;text-transform:uppercase;letter-spacing:.3px}
  .comingsoon p{margin:8px 0 0;font-size:12.5px;color:#8a7530}
  /* generate content */
  .ainotes{background:var(--accent-soft);border:1px solid #cfe2db;border-radius:10px;padding:12px 14px}
  .ainotes label{font-weight:600;font-size:12.5px;display:block;margin-bottom:6px;color:var(--accent)}
  .ainotes textarea{width:100%;min-height:60px;font-family:inherit;font-size:13px;padding:9px 11px;border:1px solid #cfe2db;border-radius:8px;background:#fff}
  .imgbox{display:flex;align-items:center;gap:12px;margin-top:10px}
  .imgpreview{width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--border-strong)}
  .contentfield{background:#fff;border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin-bottom:10px}
  .contentfield-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .contentfield-head b{font-size:12.5px}
  .contentfield-body{font-size:13px;line-height:1.5;white-space:pre-wrap}
  .contentfield-body.html :is(h2,h3){font-size:13.5px;margin:10px 0 4px}
  .contentfield textarea{width:100%;min-height:80px;font-family:inherit;font-size:13px;padding:8px;border:1px solid var(--border-strong);border-radius:7px}
  .btnrow{display:flex;gap:8px}
  .dz{width:150px;height:150px;border:2px dashed var(--border-strong);border-radius:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;color:var(--muted);
    font-size:12.5px;background:#fafbfb;position:relative;overflow:hidden;transition:border-color .15s,background .15s}
  .dz:hover{border-color:var(--accent);background:var(--accent-soft)}
  .dz.over{border-color:var(--accent);background:var(--accent-soft);border-style:solid}
  .dz img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;border-radius:10px}
  .dz-wide{width:100%;height:150px}
  .dz-label{font-size:12px;font-weight:600;margin-top:6px;color:var(--ink)}
  .dz.busy{cursor:default}
  .dz-spinicon{width:24px;height:24px;border:3px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 8px}
  .dz-badge{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.35);z-index:2}
  .cover-badge{position:absolute;top:6px;left:6px;background:var(--ink);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;z-index:2}
  .btn.rm{background:#fbe6e4;color:#8f1c16;border:none}
  .dz-tile{cursor:grab}
  .dz-tile.dragging{opacity:.4}
  .aiblock{border-left:3px solid var(--accent);padding-left:10px;margin-bottom:12px}
  .kv{display:flex;gap:10px;font-size:13px;padding:4px 0;border-top:1px solid #f0f1f2}
  .kv:first-child{border-top:none}
  .kv .k{color:var(--muted);min-width:130px;font-weight:600}
  .status{font-size:11px;font-weight:600;border-radius:20px;padding:3px 10px}
  .status.kw{color:var(--ok);background:#e4f3ea}
  .pill{display:inline-block;background:var(--chip);border-radius:20px;padding:2px 9px;margin:2px 4px 2px 0;font-size:12px}
  @media(max-width:820px){.cols{grid-template-columns:1fr 1fr}.trend-grid{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.kwrow{grid-template-columns:1fr 60px 60px;}.kwrow .h-int,.kwrow .c-int,.kwrow .h-act{display:none}}
</style>
</head>
<body>
<script>
/* auth gate — same as the other tools */
(function(){try{const a=localStorage.getItem('seo_tools_auth_token');if(!a){location.href='/';return;}const {token,expiry}=JSON.parse(a);if(!token||!expiry||Date.now()>=expiry){localStorage.removeItem('seo_tools_auth_token');location.href='/';}}catch(e){location.href='/';}})();
</script>

<div class="topbar">
  <h1>New Product Generator</h1>
  <span class="ver">v2.0</span>
  <span class="tag">AWA Products</span>
</div>

<div class="wrap">
  <div id="msg" class="msg"></div>

  <!-- SHARED IMAGES — one-time setup, kept small at the top -->
  <div class="sharedstrip">
    <span class="sst">Shared images</span>
    <span id="sharedImagesStatus">Checking…</span>
    <button class="btn ghost small" id="sharedImagesBtn">Check / upload</button>
  </div>

  <!-- GUIDED FLOW — one product at a time, 5 steps -->
  <div id="flow"><div class="empty">Loading…</div></div>
</div>

<script>
/* ---------- CONFIG ---------- */
const BASE_GROUPS = {
  "By Room":["Above Fireplace","Bathroom","Bedroom","Games room","Hallway","Kitchen","Laundry room","Living room","Nursery","Office","Teens Bedroom"],
  "By Style":["Abstract","Bohemian","Chinoiserie","Christian","Coastal","Coffee","Contemporary","Eclectic","Maximalism","Farmhouse","French Country","Islamic","Japandi","Marble","Minimalism","Scandinavian","Shabby Chic","Sun & Moon","Travel","Tropical","Wild Life","Zen"],
  "By Colour":["Black & White","Earth Toned","Gold","Pastels","Pink","Neutrals","Teal"],
  "By Occasion":["Birthdays","Birthstones","Christmas","Family Reunion","Prints of Love","Zodiac"],
  "Featured":["Bestsellers","New Arrivals"]
};
const TRENDS = ["Biophilic Design","Black & White Decor","Boho Decor","Coastal Decor","Coffee House Design","Contemporary Decor","Country Cottage Decor","Eclectic Decor","Farmhouse Decor","French Country Decor","Industrial Decor","Japandi Decor","Masculine Decor","Mediterranean Decor","Mid Century Decor","Minimalism Decor","Moroccan Decor","Old Money Decor","Preppy Style","Scandi Decor","Transitional Decor","Tropical Decor","Wildlife Decor","Zen Decor"];
const COLOUR_CHOICES = ["Black","White","Blue","Pink","Green","Grey","Plum","Ivory","Peach","Teal","Maroon","Aquamarine","Brown","Beige","Mauve","Multicolour","Purple","Violet","Mink","Burgundy","Blush","Magenta","Light Blue"];

let GROUPS = JSON.parse(JSON.stringify(BASE_GROUPS));
let CUSTOM = {};          // added collections per group (persisted)
let PRODUCTS = [];        // loaded from GitHub

/* ---------- FLOW STATE ---------- */
let DRAFT = false;        // true = showing an empty Step-1 form for a brand-new, not-yet-saved product
let EDIT_STEP = null;     // if set, force this step open for editing even though it's already "done"
let IMAGE_STATE = {};     // sku -> {data, mediaType} (artwork base64, no data: prefix)
let KW_RESULTS = null;    // Step 2 cached gap-research results for the current product
let KW_LOADING = false;   // Step 2 auto-search in flight

/* ---------- API ---------- */
async function api(payload){
  const r = await fetch('/api/keywords',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  let j; try{ j = await r.json(); }catch{ throw new Error('Bad response'); }
  if(!j.ok) throw new Error(j.error || j.message || 'Error');
  return j;
}
function msg(text,type){ const m=document.getElementById('msg'); m.textContent=text; m.className='msg show '+(type||'info'); if(type==='ok'){ setTimeout(()=>{ if(m.textContent===text) m.className='msg'; },3500);} }
function clearMsg(){ document.getElementById('msg').className='msg'; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ---------- STEP LOGIC (from handover, don't re-derive) ---------- */
function currentProduct(){ return PRODUCTS.find(p => !p.sent) || null; }
function isStepDone(p, n){
  if(!p) return false;
  if(n===1) return true;                 // the record existing means step 1's data exists
  if(n===2) return !!p.keyword;
  if(n===3) return !!p.contentApproved && !!p.content;
  if(n===4) return imagesComplete(p);
  if(n===5) return !!p.sent;
}
function imagesComplete(p){
  const img=p.images||{lifestyle:[],individuals:[],flats:{}};
  const m=(p.set||'').match(/\d+/); const setSize=m?parseInt(m[0],10):1;
  const flats=img.flats||{};
  const flatsOk=['flatUnframed','flatWhite','flatOak','flatBlack','flatCanvas'].every(s=>flats[s]);
  return (img.lifestyle||[]).length>=1 && (img.individuals||[]).length===setSize && flatsOk;
}
function computeNaturalStep(p){
  if(!p) return 1;
  for(let n=1;n<=4;n++) if(!isStepDone(p,n)) return n;
  return 5;
}

/* ---------- FLOW RENDERER ---------- */
function renderFlow(){
  const flow=document.getElementById('flow');
  const p=currentProduct();
  if(!p && !DRAFT){
    flow.innerHTML=
      '<div class="addprod">'+
        '<p>No product in progress. Start a new one and the tool will guide you step by step.</p>'+
        '<button class="btn primary" onclick="startDraft()">＋ Add product</button>'+
      '</div>';
    return;
  }
  const natural = p ? computeNaturalStep(p) : 1;
  const openN = EDIT_STEP || natural;
  let html='';
  for(let n=1;n<=5;n++){
    if(n===openN) html+=renderStepOpen(n,p);
    else if(isStepDone(p,n)) html+=renderStepCollapsed(n,p);
    else html+=renderStepLocked(n);
  }
  flow.innerHTML=html;

  // Step 1's form fields are recreated each render — (re)populate the selectors.
  if(openN===1){
    renderCollections(); renderTrends(); renderGroupChecks(); fillColourSelect();
    prefillStep1(p);
  }
  // Step 2 auto-searches keywords when it opens (option A).
  if(openN===2){ ensureKwResults(p); }
}

const STEP_NAMES={1:'Product',2:'Keyword',3:'Content',4:'Images',5:'Send to Shopify'};

function renderStepLocked(n){
  return '<div class="step"><div class="steprow locked">'+
    '<span class="step-num">'+n+'</span><span class="srsummary">'+STEP_NAMES[n]+'</span>'+
  '</div></div>';
}
function renderStepCollapsed(n,p){
  let summary='', extra='', badge='';
  if(n===1){
    summary='Product: '+esc(p.sku);
    const cols=p.collections||{};
    const bits=[...(cols['By Room']||[]),...(cols['By Style']||[])].slice(0,4);
    extra=[bits.join(', '), p.set].filter(Boolean).join(' · ');
  } else if(n===2){
    summary='Keyword: '+esc(p.keyword||'');
  } else if(n===3){
    summary='Content generated';
    if(p.content && p.contentKeyword && p.keyword && p.contentKeyword.toLowerCase()!==p.keyword.toLowerCase()){
      badge='<span class="kwchanged">keyword changed — regenerate if needed</span>';
    }
  } else if(n===4){
    const img=p.images||{lifestyle:[],individuals:[],flats:{}};
    const count=(img.lifestyle||[]).length+(img.individuals||[]).length+Object.keys(img.flats||{}).length;
    summary=count+' images uploaded';
  }
  return '<div class="step"><div class="steprow">'+
    '<span class="step-num">✓</span>'+
    '<span class="srsummary">'+summary+(extra?' <span class="srextra">· '+esc(extra)+'</span>':'')+'</span>'+
    badge+
    '<button class="btn ghost small sredit" onclick="editStep('+n+')">Edit</button>'+
  '</div></div>';
}
function renderStepOpen(n,p){
  let inner='';
  if(n===1) inner=stepProductForm(p);
  else if(n===2) inner=stepKeyword(p);
  else if(n===3) inner=stepContent(p);
  else if(n===4) inner=stepImages(p);
  else if(n===5) inner=stepSend(p);
  return '<div class="step"><div class="step-open">'+
    '<div class="step-openhead"><span class="step-num">'+n+'</span><span class="step-title">'+STEP_NAMES[n]+'</span></div>'+
    inner+
  '</div></div>';
}
function startDraft(){ DRAFT=true; EDIT_STEP=null; renderFlow(); }
function editStep(n){ EDIT_STEP=n; if(n===2){ KW_RESULTS=null; } renderFlow(); }
function closeEdit(){ EDIT_STEP=null; renderFlow(); }

/* =====================================================================
   STEP 1 — PRODUCT
   ===================================================================== */
function stepProductForm(p){
  const isNew=!p;   // fresh draft
  return ''+
    '<p class="sub">Define the product. Shared defaults are applied later.</p>'+
    '<div class="field">'+
      '<label class="f">SKU for print files <span class="req">*</span></label>'+
      '<input type="text" id="sku" placeholder="e.g. TRAVPARIS01" autocomplete="off"'+(isNew?'':' disabled')+'>'+
      (isNew?'':'<div class="sub" style="margin:6px 0 0">SKU can\'t change after the product is created.</div>')+
    '</div>'+
    '<div class="field">'+
      '<label class="f">Extra keyword terms <span style="color:var(--muted);font-weight:400">— optional, comma-separated</span></label>'+
      '<input type="text" id="keywordWords" placeholder="e.g. gallery wall, living room set" autocomplete="off">'+
    '</div>'+
    '<div class="field">'+
      '<div class="ainotes">'+
        '<label>Instructions for the AI <span style="color:var(--muted);font-weight:400">— optional</span></label>'+
        '<textarea id="aiNotes" placeholder="e.g. mention it works well in a nursery, or that it comes as a set of 3"></textarea>'+
      '</div>'+
    '</div>'+
    '<div class="block">'+
      '<div class="block-head"><h3>Collections</h3><button class="btn link" onclick="toggleAddCol()">＋ Add collection</button></div>'+
      '<div class="cols" id="colCols"></div>'+
      '<div class="addbox" id="addBox">'+
        '<div class="arow">'+
          '<div><label class="f">Collection name</label><input type="text" id="newColName" placeholder="e.g. Art Deco"></div>'+
          '<button class="btn primary small" onclick="doAddCol()">Add</button>'+
        '</div>'+
        '<div style="margin-top:10px">'+
          '<label class="f" style="margin-bottom:4px">Show under group(s)</label>'+
          '<div class="groupchecks" id="groupChecks"></div>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="block">'+
      '<div class="block-head"><h3>Set size</h3></div>'+
      '<div class="radios" id="setRadios" onchange="syncSetRadios()">'+

function renderCollections(){

function renderTrends(){ const el=document.getElementById('trendGrid'); if(el) el.innerHTML=TRENDS.map(t=>'<label class="opt"><input type="checkbox" class="trend-cb" value="'+esc(t)+'">'+esc(t)+'</label>').join(''); }
function renderGroupChecks(){ const el=document.getElementById('groupChecks'); if(el) el.innerHTML=Object.keys(GROUPS).map(g=>'<label><input type="checkbox" class="grp-cb" value="'+esc(g)+'">'+g+'</label>').join(''); }
function fillColourSelect(){ const sel=document.getElementById('colour'); if(!sel) return; COLOUR_CHOICES.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o);}); }
function addPrimaryBox(val){ const box=document.getElementById('primaryBoxes'); if(!box) return; const row=document.createElement('div');row.className='pcrow';const inp=document.createElement('input');inp.type='text';inp.className='primary-cb';inp.placeholder='e.g. White';inp.value=val||'';const x=document.createElement('button');x.className='pcx';x.title='Remove';x.textContent='×';x.onclick=()=>{if(document.querySelectorAll('.pcrow').length>1)row.remove();else inp.value='';};row.appendChild(inp);row.appendChild(x);box.appendChild(row); }
function syncSetRadios(){ document.querySelectorAll('#setRadios .radio').forEach(r=>r.classList.toggle('on',r.querySelector('input').checked)); }
function toggleAddCol(){ const b=document.getElementById('addBox'); if(b) b.classList.toggle('open'); }
async function doAddCol(){
  const name=document.getElementById('newColName').value.trim();
  const grps=[...document.querySelectorAll('.grp-cb:checked')].map(x=>x.value);
  if(!name) return alert('Type a collection name.');
  if(!grps.length) return alert('Pick at least one group.');
  grps.forEach(g=>{ if(!GROUPS[g].includes(name)) GROUPS[g].push(name); if(!CUSTOM[g])CUSTOM[g]=[]; if(!CUSTOM[g].includes(name))CUSTOM[g].push(name); });
  try{ await api({action:'save-collections',custom:CUSTOM}); }catch(e){ msg('Could not save collection: '+e.message,'err'); }
  // re-render collections but keep current tick state
  const checked=[...document.querySelectorAll('.col-cb:checked')].map(cb=>cb.value);
  renderCollections();
  document.querySelectorAll('.col-cb').forEach(cb=>{ if(checked.includes(cb.value)||cb.value===name) cb.checked=true; });
  renderGroupChecks();
  document.getElementById('newColName').value='';
  document.getElementById('addBox').classList.remove('open');
}
function prefillStep1(p){
  if(!p) return;   // fresh draft — leave everything empty (one primary box already needed)
  const sku=document.getElementById('sku'); if(sku) sku.value=p.sku||'';
  const kw=document.getElementById('keywordWords'); if(kw) kw.value=(p.keywordWords||[]).join(', ');
  const an=document.getElementById('aiNotes'); if(an) an.value=p.aiNotes||'';
  const cols=p.collections||{};
  document.querySelectorAll('.col-cb').forEach(cb=>{ const g=cb.dataset.group; cb.checked=(cols[g]||[]).includes(cb.value); });
  (p.trends||[]).forEach(t=>{ document.querySelectorAll('.trend-cb').forEach(cb=>{ if(cb.value===t) cb.checked=true; }); });
  if(p.set){ document.querySelectorAll('input[name=set]').forEach(r=>{ if(r.value===p.set) r.checked=true; }); syncSetRadios(); }
  const colour=document.getElementById('colour'); if(colour) colour.value=p.colour||'';
  const box=document.getElementById('primaryBoxes'); if(box){ box.innerHTML=''; const list=(p.primaryColour||[]); if(list.length) list.forEach(c=>addPrimaryBox(c)); else addPrimaryBox(); }
}
function collectForm(){
  const cols={}; document.querySelectorAll('.col-cb:checked').forEach(cb=>{const g=cb.dataset.group;(cols[g]=cols[g]||[]).push(cb.value);});
  return { sku:document.getElementById('sku').value.trim(), collections:cols,
    set:(document.querySelector('input[name=set]:checked')||{}).value||'',
    trends:[...document.querySelectorAll('.trend-cb:checked')].map(x=>x.value),
    primaryColour:[...document.querySelectorAll('.primary-cb')].map(x=>x.value.trim()).filter(Boolean),
    colour:document.getElementById('colour').value,
    aiNotes:document.getElementById('aiNotes').value.trim(),
    keywordWords:document.getElementById('keywordWords').value.split(',').map(w=>w.trim()).filter(Boolean) };
}
async function saveStep1(){
  const existing=currentProduct();
  const f=collectForm();
  if(!f.sku) return alert('SKU for print files is required.');
  // Duplicate-SKU guard: only when creating a NEW product (no product in progress).
  if(!existing){
    const clash=PRODUCTS.find(x=>(x.sku||'').toLowerCase()===f.sku.toLowerCase());
    if(clash) return alert('A product with SKU "'+f.sku+'" already exists'+(clash.sent?' (already sent to Shopify)':'')+'. Use a different SKU.');
  }
  // Merge onto existing (keeps keyword/content/images); for a new product it's a plain create.
  const product = existing ? {...f, sku:existing.sku} : f;
  const btn=document.getElementById('saveBtn'); btn.disabled=true; btn.innerHTML='<span class="spin"></span>Saving…';
  try{
    const r=await api({action:'save-product',product});
    PRODUCTS=r.products; DRAFT=false; EDIT_STEP=null;
    renderFlow(); msg('Saved '+product.sku,'ok');
  }catch(e){ msg('Save failed: '+e.message,'err'); btn.disabled=false; btn.textContent='Save and continue'; }
}
function cancelDraft(){ DRAFT=false; EDIT_STEP=null; renderFlow(); }
async function deleteCurrent(sku){
  if(!confirm('Delete '+sku+'? This removes the in-progress product.')) return;
  try{ const r=await api({action:'delete-product',sku}); PRODUCTS=r.products; DRAFT=false; EDIT_STEP=null; KW_RESULTS=null; renderFlow(); msg('Deleted '+sku,'ok'); }
  catch(e){ msg('Delete failed: '+e.message,'err'); }
}

function stepKeyword(p){
  return '<p class="sub">Pick one keyword. Options come from your competitors-gap file — nothing is locked in the registry yet (that happens when the product is sent to Shopify).</p>'+
    '<div id="kwResults">'+(KW_LOADING?'<div class="empty"><span class="spin" style="border-color:var(--accent);border-top-color:transparent"></span>Searching your competitors-gap file…</div>':'')+'</div>'+
    '<div class="comingsoon">'+
      '<div class="cshead">From Google Keyword Planner <span class="csbadge">coming soon</span></div>'+
      '<p>Google Keyword Planner ideas will show here as a second source, kept separate from the gap-file options.</p>'+
    '</div>'+
    (isStepDone(p,2)?'<div class="actions" style="margin-top:16px"><button class="btn ghost" onclick="closeEdit()">Done</button></div>':'');
}
async function ensureKwResults(p){
  if(KW_RESULTS || KW_LOADING || !p) { if(KW_RESULTS) renderKwResults(); return; }
  KW_LOADING=true;
  try{
    const r=await api({action:'gap-research',products:[p]});
    KW_RESULTS=r.results||[];
    KW_LOADING=false;
    // auto-open the prompt for a product with zero options
    renderKwResults();
  }catch(e){ KW_LOADING=false; const box=document.getElementById('kwResults'); if(box) box.innerHTML='<div class="msg show err">Keyword search failed: '+esc(e.message)+'</div>'; }
}
function renderKwResults(){
  const box=document.getElementById('kwResults'); if(!box) return;
  const p=currentProduct(); if(!p){ box.innerHTML=''; return; }
  const r=(KW_RESULTS||[]).find(x=>x.sku===p.sku) || (KW_RESULTS||[])[0] || {sku:p.sku,options:[]};
  box.innerHTML=blockHtml(r);
  if(!r.options||!r.options.length) togglePrompt(true);
}
function diffClass(d){ if(d==null)return ''; if(d<=20)return 'diff-e'; if(d<=40)return 'diff-m'; return 'diff-h'; }
function diffDot(d){ if(d==null)return ''; if(d<=20)return '🟢 '; if(d<=40)return '🟡 '; return '🔴 '; }
function diffLabel(o){
  if(o.difficulty==null) return '—';
  const raw=(o.difficultyRaw||'').toLowerCase();
  const num=(raw==='low'||raw==='medium'||raw==='high')?(o.difficulty+' ('+o.difficultyRaw+')'):String(o.difficulty);
  return diffDot(o.difficulty)+num;
}
function promptTerms(p){
  const col=p.collections||{};
  const parts=[...(col['By Style']||[]),...(col['By Room']||[]),...(col['By Colour']||[]),...(p.trends||[]),...(p.primaryColour||[]),...(p.keywordWords||[])];
  return [...new Set(parts.filter(Boolean))];
}
function promptText(p){
  const terms=promptTerms(p);
  return 'Search Ubersuggest (UK) for wall art keywords related to: '+(terms.length?terms.join(', '):p.sku)+'. Give up to 10 options with high volume and low difficulty, showing volume and difficulty for each.';
}
function blockHtml(r){
  const prod=PRODUCTS.find(p=>p.sku===r.sku)||{sku:r.sku};
  const hasOptions=r.options&&r.options.length>0;
  const rows=hasOptions?r.options.map((o,oi)=>{
    const isCurrent=prod.keyword&&prod.keyword.toLowerCase()===o.keyword.toLowerCase();
    return '<div class="kwrow">'+
      '<span class="kw">'+(isCurrent?'✓ ':'')+esc(o.keyword)+'</span>'+
      '<span>'+(o.volume!=null?o.volume:'—')+'</span>'+
      '<span class="'+diffClass(o.difficulty)+'">'+diffLabel(o)+'</span>'+
      '<span class="c-int"></span>'+
      '<span class="h-act"><button class="btn '+(isCurrent?'ghost':'primary')+' small" onclick="applyKw('+oi+')">'+(isCurrent?'Selected':'Use')+'</button></span>'+
    '</div>';
  }).join('') : '<div class="empty">No matching options found in the competitors-gap file. Try adding extra keyword terms, or generate an Ubersuggest prompt below.</div>';
  return '<div class="kwblock" data-sku="'+esc(r.sku)+'">'+
    '<h4>'+esc(r.sku)+(prod.keyword?' <span class="status kw" style="margin-left:8px">🔒 '+esc(prod.keyword)+'</span>':'')+'</h4>'+
    (hasOptions?'<div class="kwrow hd"><span>Keyword</span><span>Vol</span><span>Diff</span><span class="h-int"></span><span class="h-act"></span></div>':'')+
    rows+
    '<div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">'+
      '<button class="btn ghost small" onclick="togglePrompt()">Don\'t like these? Generate Ubersuggest prompt</button>'+
    '</div>'+
    '<div id="promptBox" style="display:none;margin-top:10px">'+
      '<div style="background:#fafbfb;border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:12.5px;white-space:pre-wrap" id="promptText"></div>'+
      '<button class="btn ghost small" style="margin-top:8px" onclick="copyPrompt()">Copy prompt</button>'+
    '</div>'+
    '<div style="margin-top:14px;border-top:1px solid #f0f1f2;padding-top:12px">'+
      '<label class="f" style="margin-bottom:6px">Add keyword manually (from Ubersuggest)</label>'+
      '<div style="display:flex;gap:8px"><input type="text" id="manualKw" placeholder="paste the keyword you picked"><button class="btn primary small" onclick="applyManualKw()">Add</button></div>'+
    '</div>'+
  '</div>';
}
function togglePrompt(forceOpen){
  const el=document.getElementById('promptBox'); if(!el) return;
  const p=currentProduct(); if(!p) return;

  el.style.display=(forceOpen||el.style.display==='none')?'block':'none';

async function copyPrompt(){
  const text=document.getElementById('promptText').textContent;

  catch{ msg('Could not copy — select and copy the text manually.','err'); }
}
async function applyKw(oi){
  const p=currentProduct(); if(!p) return;
  const r=(KW_RESULTS||[]).find(x=>x.sku===p.sku)||(KW_RESULTS||[])[0]; if(!r) return;
  await doSetKeyword(p.sku, r.options[oi].keyword);
}
async function applyManualKw(){
  const p=currentProduct(); if(!p) return;
  const kw=(document.getElementById('manualKw').value||'').trim();
  if(!kw) return;
  await doSetKeyword(p.sku, kw);
}
async function doSetKeyword(sku, keyword){
  try{
    const rr=await api({action:'set-keyword',sku,keyword});
    if(rr.taken){ msg(rr.reason||'That keyword is already taken.','err'); return; }
    PRODUCTS=rr.products;
    EDIT_STEP=null;   // collapse Step 2, advance
    renderFlow();
    msg('Applied "'+keyword+'" to '+sku,'ok');
  }catch(e){ msg('Apply failed: '+e.message,'err'); }

function stepContent(p){
  const img=IMAGE_STATE[p.sku];
  let html='<p class="sub">Upload the artwork image, then generate. Review and edit before continuing.</p>'+
    '<div class="imgbox">'+
      (img?'<img class="imgpreview" src="data:'+esc(img.mediaType)+';base64,'+img.data+'">':'')+
      '<div><label class="f" style="margin-bottom:6px">Artwork image <span style="color:var(--muted);font-weight:400">— the art only, no frames/wall</span></label>'+
      '<input type="file" accept="image/*" onchange="onImageSelected(\''+esc(p.sku)+'\',this)"></div>'+
    '</div>'+
    '<div class="actions" style="margin-top:14px">'+
      '<button class="btn primary small" id="genBtn" onclick="runGenerateContent(\''+esc(p.sku)+'\')" '+(img?'':'disabled')+'>'+(p.content?'Regenerate content':'Generate content')+'</button>'+
    '</div>';
  if(p.content){
    if(p.contentKeyword && p.keyword && p.contentKeyword.toLowerCase()!==p.keyword.toLowerCase()){
      html+='<div class="msg show info" style="margin-top:14px">Keyword changed to "'+esc(p.keyword)+'" after this content was generated. Regenerate if you want it worked in.</div>';
    }
    html+='<div style="margin-top:18px">'+
      contentFieldBlock(p.sku,'productTitle','Product Title',p.content.productTitle||'',false)+
      contentFieldBlock(p.sku,'seoTitle','SEO Title',p.content.seoTitle||'',false)+
      contentFieldBlock(p.sku,'metaDescription','Meta Description',p.content.metaDescription||'',false)+
      contentFieldBlock(p.sku,'productDescription','Description',p.content.productDescription||'',true)+
    '</div>';
    if((p.content.aiItems||[]).length){
      html+='<div class="block"><div class="block-head"><h3>AI Optimisation</h3></div>'+
        p.content.aiItems.map((it,ai)=>aiItemBlock(p.sku,ai,it)).join('')+
      '</div>';
    }
    html+='<div class="actions" style="margin-top:20px">'+
      '<button class="btn primary" onclick="approveContent(\''+esc(p.sku)+'\')">Looks good — continue</button>'+
      (isStepDone(p,3)?'<button class="btn ghost" onclick="closeEdit()">Cancel</button>':'')+
    '</div>';
  }
  return html;
}
async function approveContent(sku){
  const p=PRODUCTS.find(x=>x.sku===sku); if(!p||!p.content){ msg('Generate the content first.','err'); return; }
  const updated={...p, contentApproved:true};
  try{
    const r=await api({action:'save-product',product:updated});
    PRODUCTS=r.products; EDIT_STEP=null; renderFlow(); msg('Content approved.','ok');
  }catch(e){ msg('Save failed: '+e.message,'err'); }
}
function onImageSelected(sku, inputEl){
  const file=inputEl.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    const m=(reader.result||'').match(/^data:([^;]+);base64,([\s\S]*)$/);
    if(!m){ msg('Could not read that image.','err'); return; }
    IMAGE_STATE[sku]={mediaType:m[1], data:m[2]};
    renderFlow();
  };
  reader.onerror=()=>msg('Could not read that image.','err');
  reader.readAsDataURL(file);
}
async function runGenerateContent(sku){
  const img=IMAGE_STATE[sku];
  if(!img) return;
  const btn=document.getElementById('genBtn');
  if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin"></span>Generating…'; }
  msg('Analysing competitors and generating content — this can take 20-40 seconds.','info');
  try{
    const r=await api({action:'generate-content', sku, image:img.data, imageMediaType:img.mediaType});
    PRODUCTS=r.products;
    // record which keyword this content was generated with, and reset approval
    const p=PRODUCTS.find(x=>x.sku===sku);
    if(p){ const upd={...p, contentKeyword:p.keyword||'', contentApproved:false}; const rr=await api({action:'save-product',product:upd}); PRODUCTS=rr.products; }
    renderFlow();
    msg('Content generated for '+sku+' — review it, then click “Looks good — continue”.','ok');
  }catch(e){ msg('Generate failed: '+e.message,'err'); if(btn){ btn.disabled=false; btn.textContent='Generate content'; } }
}

const FLAT_LABELS=[['flatWhite','White frames'],['flatBlack','Black frames'],['flatOak','Oak frames'],['flatCanvas','Canvas wrapped'],['flatUnframed','Unframed']];
let DZ_SEQ=0;
const UPLOADING={};
function dzKey(sku,slot,index){ return sku+'|'+slot+'|'+index; }
function dropzone(sku, slot, index, label, filled, busy){
  const id='dz'+(DZ_SEQ++);
  const fileId=id+'-file';
  const wide = slot==='lifestyle' ? ' dz-wide' : '';
  let inner;
  if(busy) inner='<div class="dz-spinicon"></div>Uploading…';
  else if(filled) inner='<img src="'+esc(filled.url||'')+'"><div class="dz-badge">✓</div>';
  else inner='<div>📷<br>Drop image here<br>or click to browse</div>';
  const activeAttrs = busy ? '' :
    'ondragover="event.preventDefault();event.stopPropagation();this.classList.add(\'over\')" '+
    'ondragleave="this.classList.remove(\'over\')" '+
    'ondrop="onImageDrop(event,\''+esc(sku)+'\',\''+slot+'\','+index+')" '+
    'onclick="document.getElementById(\''+fileId+'\').click()"';
  return '<div style="text-align:center'+(slot==='lifestyle'?'':';width:150px')+'">'+
    '<div class="dz'+wide+(busy?' busy':'')+'" id="'+id+'" '+activeAttrs+'>'+inner+'</div>'+
    (busy?'':'<input type="file" id="'+fileId+'" accept="image/*" '+(slot==='lifestyle'?'multiple':'')+' style="display:none" onchange="onFileInputChosen(this,\''+esc(sku)+'\',\''+slot+'\','+index+')">')+
    (label?'<div class="dz-label">'+label+'</div>':'')+
    (filled&&!busy?'<button class="btn rm small" style="margin-top:6px" onclick="removeProdImage(\''+esc(sku)+'\',\''+slot+'\','+index+')">Remove</button>':'')+
  '</div>';
}
function stepImages(p){
  const sku=p.sku;
  const setMatch=(p.set||'').match(/\d+/); const setSize=setMatch?parseInt(setMatch[0],10):1;
  const img=p.images||{lifestyle:[],individuals:[],flats:{}};
  let html='';
  html+='<div style="margin-bottom:22px"><label class="f" style="margin-bottom:6px">Lifestyle photos <span style="color:var(--muted);font-weight:400">— add as many as you have; drag to reorder, the first one is the cover</span></label>'+
    dropzone(sku,'lifestyle',img.lifestyle.length,null,null,!!UPLOADING[dzKey(sku,'lifestyle',img.lifestyle.length)])+
    (img.lifestyle.length?'<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:14px">'+
      img.lifestyle.map((im,i)=>
        '<div class="dz-tile" draggable="true" data-idx="'+i+'" '+
          'ondragstart="onLifeDragStart(event,'+i+')" '+
          'ondragover="event.preventDefault()" '+
          'ondrop="onLifeDrop(event,\''+esc(sku)+'\','+i+')" '+
          'ondragend="onLifeDragEnd(event)" '+
          'style="text-align:center;width:150px">'+
          '<div class="dz" style="cursor:grab">'+
            '<img src="'+esc(im.url||'')+'">'+
            (i===0?'<div class="cover-badge">Cover</div>':'')+
            '<div class="dz-badge">✓</div>'+
          '</div>'+
          '<button class="btn rm small" style="margin-top:6px" onclick="removeProdImage(\''+esc(sku)+'\',\'lifestyle\','+i+')">Remove</button>'+
        '</div>'
      ).join('')+
    '</div>':'')+
  '</div>';

  html+='<div style="margin-bottom:22px"><label class="f" style="margin-bottom:6px">Individual artwork photos <span style="color:var(--muted);font-weight:400">— '+setSize+' needed ('+esc(p.set||'')+')</span></label>'+
    '<div style="display:flex;gap:16px;flex-wrap:wrap">'+
    Array.from({length:setSize}).map((_,i)=>dropzone(sku,'individual',i,'Individual '+(i+1),img.individuals[i],!!UPLOADING[dzKey(sku,'individual',i)])).join('')+
  '</div></div>';

  html+='<div><label class="f" style="margin-bottom:6px">Flat images <span style="color:var(--muted);font-weight:400">— these also show as the variant images in the cart</span></label>'+
    '<div style="display:flex;gap:16px;flex-wrap:wrap">'+
    FLAT_LABELS.map(([slot,label])=>dropzone(sku,slot,0,label,img.flats[slot],!!UPLOADING[dzKey(sku,slot,0)])).join('')+
  '</div></div>';

  if(isStepDone(p,4)){
    html+='<div class="actions" style="margin-top:20px"><button class="btn primary" onclick="closeEdit()">Looks good — continue</button>'+
      (EDIT_STEP===4?'<button class="btn ghost" onclick="closeEdit()">Done</button>':'')+'</div>';
  } else {
    html+='<p class="sub" style="margin-top:18px">Add the lifestyle cover, all '+setSize+' individual photo(s) and the 5 flat images to unlock Send to Shopify.</p>';
  }
  return html;
}
let LIFE_DRAG_FROM=null;
function onLifeDragStart(e, idx){ LIFE_DRAG_FROM=idx; e.currentTarget.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; }
function onLifeDragEnd(e){ e.currentTarget.classList.remove('dragging'); }
async function onLifeDrop(e, sku, toIdx){
  e.preventDefault();
  const from=LIFE_DRAG_FROM; LIFE_DRAG_FROM=null;
  if(from===null || from===toIdx) return;
  const p=PRODUCTS.find(x=>x.sku===sku); if(!p) return;
  const list=(p.images&&p.images.lifestyle)||[];
  const order=list.map((_,i)=>i);
  const [moved]=order.splice(from,1);
  order.splice(toIdx,0,moved);
  try{ const r=await api({action:'reorder-lifestyle-images', sku, order}); PRODUCTS=r.products; renderFlow(); }
  catch(err){ msg('Failed: '+err.message,'err'); }
}
function readFileAsBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{ const m=(reader.result||'').match(/^data:([^;]+);base64,([\s\S]*)$/); if(!m) return reject(new Error('Could not read file')); resolve({mediaType:m[1],data:m[2]}); };
    reader.onerror=()=>reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}
async function uploadOneFile(sku, slot, index, file){
  const key=dzKey(sku,slot,index);
  UPLOADING[key]=true; renderFlow();
  try{
    const {mediaType,data}=await readFileAsBase64(file);
    const r=await api({action:'upload-image', sku, slot, image:data, imageMediaType:mediaType});
    PRODUCTS=r.products;
  }catch(e){ msg('Upload failed: '+e.message,'err'); }
  finally{ delete UPLOADING[key]; renderFlow(); }
}
async function uploadLifestyleFiles(sku, files){
  if(!files.length) return;
  for(const f of files){
    const p=PRODUCTS.find(x=>x.sku===sku);
    const idx=(p&&p.images&&p.images.lifestyle)?p.images.lifestyle.length:0;
    const key=dzKey(sku,'lifestyle',idx);
    UPLOADING[key]=true; renderFlow();
    try{
      const {mediaType,data}=await readFileAsBase64(f);
      const r=await api({action:'upload-image', sku, slot:'lifestyle', image:data, imageMediaType:mediaType});
      PRODUCTS=r.products;
    }catch(e){ msg('Upload failed for '+f.name+': '+e.message,'err'); }
    finally{ delete UPLOADING[key]; renderFlow(); }
  }
}
function onFileInputChosen(inputEl, sku, slot, index){
  const files=[...inputEl.files]; if(!files.length) return;
  if(slot==='lifestyle') uploadLifestyleFiles(sku, files);
  else uploadOneFile(sku, slot, index, files[0]);
  inputEl.value='';
}
function onImageDrop(e, sku, slot, index){
  e.preventDefault(); e.stopPropagation();
  e.currentTarget.classList.remove('over');
  const files=[...(e.dataTransfer.files||[])].filter(f=>f.type && f.type.startsWith('image/'));
  if(!files.length) return;
  if(slot==='lifestyle') uploadLifestyleFiles(sku, files);
  else uploadOneFile(sku, slot, index, files[0]);
}
async function removeProdImage(sku, slot, index){
  if(!confirm('Remove this image?')) return;
  try{ const r=await api({action:'remove-product-image', sku, slot, index}); PRODUCTS=r.products; renderFlow(); msg('Removed.','ok'); }
  catch(e){ msg('Failed: '+e.message,'err'); }
}

/* =====================================================================
   STEP 5 — SEND TO SHOPIFY
   ===================================================================== */
function stepSend(p){
  return '<p class="sub">Creates the product as a Draft with every variant, price, image and metafield filled in.</p>'+
    '<button class="btn primary" id="sendBtn" onclick="runSendToShopify(\''+esc(p.sku)+'\')">Send to Shopify</button>'+
    '<div id="sendResult" style="margin-top:12px"></div>';
}
async function runSendToShopify(sku){
  const btn=document.getElementById('sendBtn');
  const out=document.getElementById('sendResult');
  btn.disabled=true; btn.innerHTML='<span class="spin"></span>Sending…';
  out.innerHTML='';
  try{
    const r=await api({action:'send-to-shopify', sku});
    PRODUCTS=r.products;
    // reset the flow: sent product leaves view
    DRAFT=false; EDIT_STEP=null; KW_RESULTS=null; delete IMAGE_STATE[sku];
    let text='Created — product #'+esc(r.shopifyProductId.split('/').pop())+' ('+esc(r.shopifyHandle)+'), saved as Draft.';
    if((r.warnings||[]).length) text+=' Warnings: '+r.warnings.map(esc).join(' · ');
    renderFlow();
    msg(text,'ok');
  }catch(e){
    out.innerHTML='<div class="msg show err">'+esc(e.message)+'</div>';
    btn.disabled=false; btn.textContent='Send to Shopify';
  }
}

/* ---------- SHARED IMAGES ---------- */
const SHARED_FIXED_KEYS=['frameSizes','pictureFrames','canvasWrapped'];
const SHARED_ROOM_KEYS=['Above Fireplace','Bathroom','Bedroom','Games room','Hallway','Kitchen','Laundry room','Living room','Nursery','Office','Teens Bedroom'];
function renderSharedImagesStatus(data){
  const fixed=data.fixed||{}, rooms=data.rooms||{};
  const doneFixed=SHARED_FIXED_KEYS.filter(k=>fixed[k]&&fixed[k].gid).length;
  const doneRooms=SHARED_ROOM_KEYS.filter(k=>rooms[k]&&rooms[k].gid).length;
  const total=SHARED_FIXED_KEYS.length+SHARED_ROOM_KEYS.length, done=doneFixed+doneRooms;
  const el=document.getElementById('sharedImagesStatus');
  el.textContent = (done>=total) ? ('✅ All '+total+' set up.') : (done+' / '+total+' uploaded so far.');
}
async function loadSharedImagesStatus(){
  try{ const r=await api({action:'get-fixed-images'}); renderSharedImagesStatus(r.images||{}); }
  catch(e){ document.getElementById('sharedImagesStatus').textContent='Could not check: '+e.message; }
}
document.getElementById('sharedImagesBtn').onclick=async()=>{
  const btn=document.getElementById('sharedImagesBtn'); btn.disabled=true; btn.innerHTML='<span class="spin"></span>Uploading…';
  try{ const r=await api({action:'upload-fixed-images'}); renderSharedImagesStatus(r.data||{}); msg('Shared images checked.','ok'); }
  catch(e){ msg('Failed: '+e.message,'err'); }
  finally{ btn.disabled=false; btn.textContent='Check / upload'; }
};

/* ---------- INIT ---------- */
async function init(){
  loadSharedImagesStatus();
  try{ const c=await api({action:'list-collections'}); CUSTOM=c.custom||{}; Object.keys(CUSTOM).forEach(g=>{ if(!GROUPS[g])GROUPS[g]=[]; CUSTOM[g].forEach(n=>{ if(!GROUPS[g].includes(n))GROUPS[g].push(n); }); }); }catch(e){}
  try{ const r=await api({action:'list-products'}); PRODUCTS=r.products||[]; }
  catch(e){ document.getElementById('flow').innerHTML='<div class="empty">Could not load products: '+esc(e.message)+'</div>'; return; }
  renderFlow();
}
init();
</script>
