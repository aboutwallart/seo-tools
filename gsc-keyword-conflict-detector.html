<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSC Keyword Conflict Resolver v2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: #fff;
            padding: 20px 30px;
            border-bottom: 2px solid #e0e0e0;
            text-align: center;
        }
        
        .header h1 { font-size: 28px; margin-bottom: 5px; color: #333; }
        .header p { color: #666; font-size: 14px; }
        
        .setup-section { padding: 20px 30px; border-bottom: 1px solid #e0e0e0; }
        
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #333; }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .btn {
            background: #0969da;
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .btn:hover:not(:disabled) { background: #0860ca; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-export { background: #10b981; margin-left: 10px; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            padding: 30px;
            background: #f8f9fa;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .stat-card .number { font-size: 36px; font-weight: 700; color: #0969da; margin-bottom: 8px; }
        .stat-card .label { color: #666; font-size: 14px; }
        
        .conflicts-section { padding: 30px; }
        
        .conflict-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            border-left: 5px solid #0969da;
        }
        
        .conflict-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .conflict-keyword {
            font-size: 22px;
            font-weight: 700;
            color: #333;
        }
        
        .conflict-meta {
            display: flex;
            gap: 15px;
            font-size: 14px;
            color: #666;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .conflict-meta span {
            background: white;
            padding: 6px 12px;
            border-radius: 6px;
        }
        
        .page-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            position: relative;
        }
        
        .page-card.winner {
            border-color: #10b981;
            background: #f0fdf4;
        }
        
        .page-card.locked {
            border-color: #dc2626;
            background: #fef2f2;
            opacity: 0.7;
        }
        
        .page-card.done {
            opacity: 0.6;
            background: #f9fafb;
        }
        
        .winner-badge {
            position: absolute;
            top: -15px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
            text-transform: uppercase;
        }
        
        .locked-badge {
            position: absolute;
            top: -15px;
            right: 20px;
            background: #dc2626;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.4);
            text-transform: uppercase;
        }
        
        .page-header {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .page-checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
            margin-top: 3px;
        }
        
        .page-url {
            flex: 1;
            color: #0969da;
            text-decoration: none;
            word-break: break-all;
            font-size: 15px;
            font-weight: 500;
        }
        
        .page-url:hover { text-decoration: underline; }
        
        .page-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
            font-size: 13px;
        }
        
        .stat-item {
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 6px;
        }
        
        .stat-item strong { color: #333; }
        .stat-item span { color: #666; }
        
        .action-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .action-btn {
            padding: 12px 24px;
            border: 3px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .action-btn:hover {
            border-color: #0969da;
            background: #f0f9ff;
            transform: translateY(-2px);
        }
        
        .action-btn.selected {
            border-color: #0969da;
            background: #0969da;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(9, 105, 218, 0.3);
        }
        
        .action-btn.keep { border-color: #10b981; color: #10b981; }
        .action-btn.keep.selected { background: #10b981; border-color: #10b981; color: white; }
        
        .action-btn.link { border-color: #f59e0b; color: #f59e0b; }
        .action-btn.link.selected { background: #f59e0b; border-color: #f59e0b; color: white; }
        
        .action-btn.repurpose { border-color: #8b5cf6; color: #8b5cf6; }
        .action-btn.repurpose.selected { background: #8b5cf6; border-color: #8b5cf6; color: white; }
        
        .action-btn.redirect { border-color: #ef4444; color: #ef4444; }
        .action-btn.redirect.selected { background: #ef4444; border-color: #ef4444; color: white; }
        
        .loading { text-align: center; padding: 40px; color: #666; }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0969da;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error { background: #fee; color: #c00; padding: 15px; border-radius: 8px; margin: 20px 30px; }
        .hidden { display: none; }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 15px;
        }
        .progress-fill {
            height: 100%;
            background: #0969da;
            width: 0%;
            transition: width 0.3s;
        }
        
        .filter-section {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .filter-section input {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
        }
        
        .progress-badge {
            background: #10b981;
            color: white;
            padding: 6px 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Keyword Conflict Resolver</h1>
            <p>🤖 Auto-locks winners & removes from other conflicts</p>
        </div>
        
        <div class="setup-section">
            <h2 style="font-size: 24px; margin-bottom: 10px; color: #333;">GitHub Authentication</h2>
            
            <div class="input-group">
                <label>GitHub Personal Access Token</label>
                <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" value="">
            </div>
            
            <p style="color: #666; font-size: 14px; margin-bottom: 20px;">
                Token stored locally. Never sent anywhere except GitHub API.
            </p>
            
            <button class="btn" id="analyzeBtn" onclick="startAnalysis()">🚀 Start Analysis</button>
            <button class="btn btn-export hidden" id="exportBtn" onclick="exportRegistry()">📥 Download Excel</button>
            <button class="btn btn-export hidden" id="saveGithubBtn" onclick="saveRegistryToGitHub()" style="background:#10b981">💾 Save to GitHub</button>
            <button class="btn" style="background:#f59e0b" onclick="cleanupDuplicateURLs()">🔧 Fix Duplicate URLs</button>
            <button class="btn" style="background:#ef4444" onclick="resetAll()">🔄 Reset All Decisions</button>
            
            <label id="hideResolvedControl" class="hidden" style="display: inline-flex; align-items: center; gap: 8px; cursor: pointer; margin-left: 20px; padding: 10px 20px; background: #f3f4f6; border-radius: 8px;">
                <input type="checkbox" id="hideResolved" onchange="filterConflicts()" style="width: 18px; height: 18px; cursor: pointer;">
                <span style="font-weight: 600;">Hide Resolved</span>
            </label>
        </div>
        
        <div id="loadingSection" class="loading hidden">
            <div class="spinner"></div>
            <p id="loadingMessage">Loading data...</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>
        </div>
        
        <div id="errorSection" class="error hidden"></div>
        
        <div id="statsSection" class="stats hidden"></div>
        
        <div id="filterSection" class="filter-section hidden">
            <input type="text" id="searchFilter" placeholder="🔎 Search keywords or URLs..." oninput="filterConflicts()">
            <div class="progress-badge" id="progressBadge">0 / 0 resolved</div>
        </div>
        
        <div id="conflictsSection" class="conflicts-section hidden"></div>
    </div>

    <script>
        let queriesData = [];
        let pagesData = [];
        let conflictsData = [];
        let allConflictPages = {}; // Store ALL pages per keyword, not just top 5
        let resolutionRegistry = {};
        let lockedKeywords = {};
        let repurposeKeywords = {}; // Keywords saved for repurpose
        let deletedConflicts = new Set(); // Keywords marked as deleted
        let unresolvableConflicts = new Set(); // Keywords marked as unresolvable

        // Hardcoded blog keywords
        const hardcodedBlogs = [
            { keyword: "botanical themed bedroom", title: "Master Botanical Themed Bedroom Like a Professional Designer" },
            { keyword: "boho wall art", title: "Boho Wall Art Trends: Which Styles Are Trending Now?" },
            { keyword: "boho art design", title: "Boho Art Design: How to Master Bohemian Wall Decor" },
            // ... (keeping all your blog entries)
        ];

        // Pre-load locked keywords from optimized pages
        const preOptimizedPages = [
            { url: 'https://aboutwallart.com/', keyword: 'wall art decor' },
            { url: 'https://aboutwallart.com/pages/unique-wall-art', keyword: 'unique wall art' },
            { url: 'https://aboutwallart.com/pages/home-decor-items', keyword: 'home decor unique' },
            { url: 'https://aboutwallart.com/pages/modern-art-wall-decoration-shop-by-room', keyword: 'modern wall art' },
            { url: 'https://aboutwallart.com/pages/wall-hanging-pictures-shop-by-style', keyword: 'framed wall art' },
            { url: 'https://aboutwallart.com/pages/gallery-wall-art-shop-by-colour-scheme', keyword: 'wall art by colour' },
            { url: 'https://aboutwallart.com/pages/celebration-gifts-shop-by-occasion', keyword: 'celebration gifts' }
        ];

        preOptimizedPages.forEach(page => {
            lockedKeywords[page.keyword.toLowerCase()] = {
                url: page.url,
                source: 'Pre-Optimized Page',
                locked: true
            };
        });

        // Load hardcoded blog keywords
        hardcodedBlogs.forEach(blog => {
            const handle = blog.title.toLowerCase()
                .replace(/[^a-z0-9\s-]/g, '')
                .replace(/\s+/g, '-')
                .substring(0, 60);
            
            const url = `https://aboutwallart.com/blogs/news-articles-home-decor-inspiration/${handle}`;
            
            lockedKeywords[blog.keyword] = {
                url: url,
                source: 'Published Blog',
                fullTitle: blog.title,
                locked: true
            };
        });

        window.addEventListener('DOMContentLoaded', async () => {
            const savedToken = localStorage.getItem('github_token');
            if (savedToken) {
                document.getElementById('githubToken').value = savedToken;
            }
            
            const savedRegistry = localStorage.getItem('resolution_registry');
            if (savedRegistry) resolutionRegistry = JSON.parse(savedRegistry);
            
            const savedRepurpose = localStorage.getItem('repurpose_keywords');
            if (savedRepurpose) repurposeKeywords = JSON.parse(savedRepurpose);
            
            const savedDeleted = localStorage.getItem('deleted_conflicts');
            if (savedDeleted) deletedConflicts = new Set(JSON.parse(savedDeleted));
            
            const savedUnresolvable = localStorage.getItem('unresolvable_conflicts');
            if (savedUnresolvable) unresolvableConflicts = new Set(JSON.parse(savedUnresolvable));
        });

        async function fetchGitHubFile(owner, repo, path, token) {
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
            const headers = { 'Accept': 'application/vnd.github.v3.raw' };
            if (token) headers['Authorization'] = `token ${token}`;
            
            const response = await fetch(url, { headers });
            if (!response.ok) throw new Error(`GitHub error: ${response.status}`);
            return await response.text();
        }

        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            
            return lines.slice(1).map(line => {
                const values = [];
                let current = '';
                let inQuotes = false;
                
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        values.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                values.push(current.trim());
                
                const obj = {};
                headers.forEach((header, i) => obj[header] = values[i] || '');
                return obj;
            });
        }

        function normalizeText(text) {
            return text.toLowerCase().replace(/[^\w\s-]/g, ' ').replace(/\s+/g, ' ').trim();
        }

        function getKeywords(text) {
            return normalizeText(text).split(' ').filter(w => w.length > 2);
        }

        async function startAnalysis() {
            document.getElementById('analyzeBtn').disabled = true;
            try {
                await analyzeConflicts();
            } finally {
                document.getElementById('analyzeBtn').disabled = false;
            }
        }

        async function analyzeConflicts() {
            const token = document.getElementById('githubToken').value.trim();
            if (!token) {
                showError('Please enter your GitHub Personal Access Token');
                return;
            }
            
            localStorage.setItem('github_token', token);
            
            try {
                showLoading(true);
                hideError();
                updateProgress(0, 'Fetching data from GitHub...');
                
                const queriesCsv = await fetchGitHubFile('aboutwallart', 'seo-tools', 'data/Queries.csv', token);
                updateProgress(20, 'Parsing queries...');
                
                const pagesCsv = await fetchGitHubFile('aboutwallart', 'seo-tools', 'data/Pages.csv', token);
                updateProgress(30, 'Parsing pages...');
                
                queriesData = parseCSV(queriesCsv);
                pagesData = parseCSV(pagesCsv);
                
                updateProgress(50, 'Finding conflicts...');
                await new Promise(r => setTimeout(r, 100));
                
                findAllConflicts();
                
                updateProgress(100, 'Done!');
                
                displayStats();
                displayConflicts();
                updateProgressBadge();
                
                showLoading(false);
                document.getElementById('statsSection').classList.remove('hidden');
                document.getElementById('filterSection').classList.remove('hidden');
                document.getElementById('conflictsSection').classList.remove('hidden');
                document.getElementById('exportBtn').classList.remove('hidden');
                document.getElementById('saveGithubBtn').classList.remove('hidden');
                document.getElementById('hideResolvedControl').classList.remove('hidden');
                
            } catch (error) {
                showLoading(false);
                showError(`Error: ${error.message}`);
            }
        }

        function findAllConflicts() {
            allConflictPages = {};
            const topQueries = queriesData.slice(0, 250);
            
            const filteredPages = pagesData.filter(p => {
                const url = p['Top pages'] || '';
                return !url.includes('/es/') && !url.includes('/fr/');
            });
            
            const urlIndex = filteredPages.map(p => ({
                url: p['Top pages'],
                keywords: getKeywords(p['Top pages']),
                clicks: parseInt(p['Clicks']) || 0,
                impressions: parseInt(p['Impressions']) || 0,
                ctr: p['CTR'],
                position: parseFloat(p['Position']) || 0
            }));
            
            topQueries.forEach(query => {
                const keyword = query['Top queries'];
                const queryWords = getKeywords(keyword);
                if (queryWords.length === 0) return;
                
                const matches = [];
                
                for (const page of urlIndex) {
                    const matchCount = queryWords.filter(w => 
                        page.keywords.some(pw => pw.includes(w) || w.includes(pw))
                    ).length;
                    
                    const score = (matchCount / queryWords.length) * 100;
                    
                    if (score >= 50) {
                        matches.push({ ...page, matchScore: score });
                    }
                }
                
                if (matches.length >= 2) {
                    // Calculate AI scores for matches
                    matches.forEach(page => {
                        const relevanceScore = page.matchScore;
                        const clicksScore = Math.min((page.clicks / 100) * 100, 100);
                        const positionScore = Math.max(0, 100 - (page.position * 5));
                        page.aiScore = (relevanceScore * 0.5) + (clicksScore * 0.3) + (positionScore * 0.2);
                    });
                    
                    // Sort by AI score
                    matches.sort((a, b) => b.aiScore - a.aiScore);
                    
                    // Store top 10 pages (for backup when URLs get locked)
                    allConflictPages[keyword] = {
                        keyword,
                        clicks: parseInt(query['Clicks']) || 0,
                        impressions: parseInt(query['Impressions']) || 0,
                        ctr: query['CTR'],
                        position: parseFloat(query['Position']) || 0,
                        allPages: matches.slice(0, 10) // Store 10 as backup
                    };
                    
                    // AI PRE-SELECT ONLY TOP 5 (the ones we'll actually display initially)
                    matches.slice(0, 5).forEach((page, idx) => {
                        const key = `${keyword}|||${page.url}`;
                        
                        // Only set if not already set by user
                        if (!resolutionRegistry[key]) {
                            resolutionRegistry[key] = {};
                            
                            if (idx === 0) {
                                // Winner - KEEP
                                resolutionRegistry[key].action = 'keep';
                                resolutionRegistry[key].aiReason = `AI Winner: Best relevance (${page.matchScore.toFixed(0)}%), ${page.clicks} clicks, position ${page.position.toFixed(1)}`;
                            } else {
                                // Losers - decide action based on metrics
                                const relevance = page.matchScore;
                                const clicks = page.clicks;
                                const position = page.position;
                                
                                if (relevance >= 80 && clicks >= 20 && position <= 10) {
                                    resolutionRegistry[key].action = 'repurpose';
                                    resolutionRegistry[key].aiReason = `High relevance (${relevance.toFixed(0)}%) & traffic (${clicks} clicks). Optimize for different keyword.`;
                                } else if (relevance < 60 && clicks < 10 && position > 15) {
                                    resolutionRegistry[key].action = 'redirect';
                                    resolutionRegistry[key].aiReason = `Low relevance (${relevance.toFixed(0)}%), ${clicks} clicks. Redirect to winner.`;
                                } else {
                                    resolutionRegistry[key].action = 'link';
                                    resolutionRegistry[key].aiReason = `Moderate match (${relevance.toFixed(0)}% relevance, ${clicks} clicks). Add internal link to winner.`;
                                }
                            }
                        }
                    });
                }
            });
            
            saveRegistry();
            
            // Now filter out locked URLs and create display data
            rebuildConflictsData();
        }

        function rebuildConflictsData() {
            conflictsData = [];
            
            Object.values(allConflictPages).forEach(conflict => {
                const keyword = conflict.keyword;
                const keywordLower = keyword.toLowerCase();
                
                // Skip deleted conflicts
                if (deletedConflicts.has(keyword)) {
                    return;
                }
                
                // Skip unresolvable conflicts
                if (unresolvableConflicts.has(keyword)) {
                    return;
                }
                
                // Check if this keyword already has a locked winner
                const hasLockedWinner = conflict.allPages.some(page => {
                    const key = `${keyword}|||${page.url}`;
                    const reg = resolutionRegistry[key] || {};
                    return reg.locked === 'LOCKED' && reg.done === true;
                });
                
                // If keyword has a locked winner, skip this entire conflict (it's resolved)
                if (hasLockedWinner) {
                    return; // Don't add this conflict to the display
                }
                
                // Also check if keyword is in pre-locked keywords
                if (lockedKeywords[keywordLower] && lockedKeywords[keywordLower].locked) {
                    return; // Skip this conflict
                }
                
                // Filter out locked URLs (URLs locked to OTHER keywords)
                const availablePages = conflict.allPages.filter(page => {
                    // Check if this URL is locked to a DIFFERENT keyword
                    for (const [otherKey, data] of Object.entries(resolutionRegistry)) {
                        const [otherKeyword, otherUrl] = otherKey.split('|||');
                        if (otherUrl === page.url && 
                            otherKeyword !== keyword && 
                            data.locked === 'LOCKED' && 
                            data.done === true) {
                            return false; // This URL is locked to another keyword
                        }
                    }
                    
                    // Check pre-locked keywords
                    for (const [lockedKw, info] of Object.entries(lockedKeywords)) {
                        if (info.url === page.url && lockedKw !== keywordLower && info.locked === true) {
                            return false;
                        }
                    }
                    
                    return true; // URL is available
                });
                
                // Only show conflicts with 2+ remaining pages
                if (availablePages.length >= 2) {
                    const topAvailable = availablePages.slice(0, 5);
                    
                    // AI pre-select any newly visible pages (positions 6-10 moving up)
                    topAvailable.forEach((page, idx) => {
                        const key = `${keyword}|||${page.url}`;
                        
                        // If this page doesn't have a pre-selection yet, add it now
                        if (!resolutionRegistry[key] || !resolutionRegistry[key].action) {
                            if (!resolutionRegistry[key]) resolutionRegistry[key] = {};
                            
                            if (idx === 0) {
                                // New winner (should rarely happen)
                                resolutionRegistry[key].action = 'keep';
                                resolutionRegistry[key].aiReason = `AI Winner: Best remaining option`;
                            } else {
                                // New loser moved up from position 6-10
                                const relevance = page.matchScore;
                                const clicks = page.clicks;
                                const position = page.position;
                                
                                if (relevance >= 80 && clicks >= 20 && position <= 10) {
                                    resolutionRegistry[key].action = 'repurpose';
                                } else if (relevance < 60 && clicks < 10 && position > 15) {
                                    resolutionRegistry[key].action = 'redirect';
                                } else {
                                    resolutionRegistry[key].action = 'link';
                                }
                            }
                        }
                    });
                    
                    conflictsData.push({
                        keyword: conflict.keyword,
                        clicks: conflict.clicks,
                        impressions: conflict.impressions,
                        ctr: conflict.ctr,
                        position: conflict.position,
                        pages: topAvailable // Show top 5 available
                    });
                }
            });
            
            saveRegistry();
        }

        function isUrlLocked(url) {
            // First check if this URL is locked in the resolution registry
            for (const [key, data] of Object.entries(resolutionRegistry)) {
                const [keyword, pageUrl] = key.split('|||');
                if (pageUrl === url && data.locked === 'LOCKED' && data.done === true) {
                    return true;
                }
            }
            
            // Also check pre-locked keywords
            for (const info of Object.values(lockedKeywords)) {
                if (info.url === url && info.locked === true) {
                    return true;
                }
            }
            
            return false;
        }

        function updateAction(key, action) {
            const [keyword, url] = key.split('|||');
            
            // Check if this URL is already locked to a different keyword
            const existingLock = findExistingLockForUrl(url);
            if (existingLock && existingLock !== keyword.toLowerCase()) {
                const existingKey = Object.keys(resolutionRegistry).find(k => {
                    const [kw, u] = k.split('|||');
                    return u === url && resolutionRegistry[k].locked === 'LOCKED';
                });
                
                if (existingKey) {
                    const [lockedKeyword] = existingKey.split('|||');
                    if (confirm(`⚠️ This URL is already locked to "${lockedKeyword}".\n\nDo you want to UNLOCK it from "${lockedKeyword}" and update it here for "${keyword}"?`)) {
                        // Unlock from previous keyword
                        resolutionRegistry[existingKey].done = false;
                        delete resolutionRegistry[existingKey].locked;
                        delete resolutionRegistry[existingKey].status;
                        resolutionRegistry[existingKey].action = 'keep';
                        delete lockedKeywords[lockedKeyword.toLowerCase()];
                        
                        // Update for new keyword
                        if (!resolutionRegistry[key]) resolutionRegistry[key] = {};
                        resolutionRegistry[key].action = action;
                        
                        rebuildConflictsData();
                        saveRegistry();
                        displayConflicts();
                        return;
                    } else {
                        return; // User cancelled
                    }
                }
            }
            
            // Normal action update
            if (!resolutionRegistry[key]) resolutionRegistry[key] = {};
            resolutionRegistry[key].action = action;
            saveRegistry();
            displayConflicts();
        }
        
        function findExistingLockForUrl(url) {
            // Check if this URL is locked to any keyword
            for (const [keyword, data] of Object.entries(lockedKeywords)) {
                if (data.url === url) {
                    return keyword;
                }
            }
            return null;
        }

        function toggleDone(keyword, url, checkbox) {
            const key = `${keyword}|||${url}`;
            if (!resolutionRegistry[key]) resolutionRegistry[key] = { action: 'pending', done: false };
            
            const currentAction = resolutionRegistry[key].action;
            const wasDone = resolutionRegistry[key].done;
            
            resolutionRegistry[key].done = checkbox.checked;
            
            if (checkbox.checked) {
                resolutionRegistry[key].timestamp = new Date().toISOString();
                
                // If action is KEEP and now marked as done → LOCK IT
                if (currentAction === 'keep') {
                    // Set the exact format requested: LOCKED=LOCKED, Status=PENDING, Action=TO_OPTIMIZE
                    resolutionRegistry[key].locked = 'LOCKED';
                    resolutionRegistry[key].status = 'PENDING';
                    resolutionRegistry[key].action = 'TO_OPTIMIZE';
                    
                    // Add to locked keywords IMMEDIATELY
                    lockedKeywords[keyword.toLowerCase()] = {
                        url: url,
                        source: 'User Resolved',
                        locked: true,
                        timestamp: new Date().toISOString()
                    };
                    
                    // Save to localStorage immediately
                    saveRegistry();
                    
                    // Rebuild conflicts to remove this URL from everywhere RIGHT NOW
                    rebuildConflictsData();
                    
                    // Update UI immediately
                    updateProgressBadge();
                    displayStats();
                    displayConflicts();
                    
                    // Show confirmation after UI updates
                    setTimeout(() => {
                        alert(`✅ Page locked to "${keyword}"!\n\n📋 Registry updated:\n• LOCKED: LOCKED\n• Status: PENDING\n• Action: TO_OPTIMIZE\n\nThis URL has been removed from all other conflicts.`);
                    }, 100);
                    
                    return; // Stop here to prevent double refresh
                }
            } else {
                resolutionRegistry[key].timestamp = null;
                
                // If unlocking a KEEP action, remove from locked keywords and reset registry
                if (currentAction === 'TO_OPTIMIZE' && wasDone) {
                    delete lockedKeywords[keyword.toLowerCase()];
                    delete resolutionRegistry[key].locked;
                    delete resolutionRegistry[key].status;
                    resolutionRegistry[key].action = 'keep'; // Reset back to keep
                    
                    saveRegistry();
                    rebuildConflictsData();
                    updateProgressBadge();
                    displayStats();
                    displayConflicts();
                    return;
                }
            }
            
            // Normal checkbox toggle (not a lock action)
            saveRegistry();
            updateProgressBadge();
            displayConflicts();
        }

        function saveRegistry() {
            localStorage.setItem('resolution_registry', JSON.stringify(resolutionRegistry));
        }

        function updateProgressBadge() {
            const total = Object.keys(resolutionRegistry).length;
            const done = Object.values(resolutionRegistry).filter(r => r.done).length;
            document.getElementById('progressBadge').textContent = `${done} / ${total} resolved`;
        }

        function displayStats() {
            const total = Object.keys(resolutionRegistry).length;
            const done = Object.values(resolutionRegistry).filter(r => r.done).length;
            const pending = total - done;
            const lockedCount = Object.keys(lockedKeywords).length;
            const repurposeCount = Object.keys(repurposeKeywords).length;
            const deletedCount = deletedConflicts.size;
            const unresolvableCount = unresolvableConflicts.size;
            
            document.getElementById('statsSection').innerHTML = `
                <div class="stat-card"><div class="number">${conflictsData.length}</div><div class="label">Active Conflicts</div></div>
                <div class="stat-card"><div class="number">${total}</div><div class="label">Pages Affected</div></div>
                <div class="stat-card"><div class="number" style="color:#10b981">${done}</div><div class="label">Resolved</div></div>
                <div class="stat-card"><div class="number" style="color:#f59e0b">${pending}</div><div class="label">Pending</div></div>
                <div class="stat-card"><div class="number" style="color:#dc2626">🔒 ${lockedCount}</div><div class="label">Locked URLs</div></div>
                <div class="stat-card"><div class="number" style="color:#8b5cf6">💾 ${repurposeCount}</div><div class="label">Keywords Saved</div></div>
                <div class="stat-card"><div class="number" style="color:#6b7280">❌ ${unresolvableCount}</div><div class="label">Unresolvable</div></div>
                <div class="stat-card"><div class="number" style="color:#6b7280">🗑️ ${deletedCount}</div><div class="label">Deleted</div></div>
            `;
        }

        function filterConflicts() {
            const searchFilter = document.getElementById('searchFilter').value.toLowerCase();
            const hideResolved = document.getElementById('hideResolved').checked;
            
            const filtered = conflictsData.filter(c => {
                const matchesSearch = !searchFilter || 
                    c.keyword.toLowerCase().includes(searchFilter) ||
                    c.pages.some(p => p.url.toLowerCase().includes(searchFilter));
                
                if (!matchesSearch) return false;
                
                if (hideResolved) {
                    const allDone = c.pages.every(p => {
                        const key = `${c.keyword}|||${p.url}`;
                        const reg = resolutionRegistry[key] || {};
                        return reg.done === true;
                    });
                    return !allDone;
                }
                
                return true;
            });
            
            displayConflicts(filtered);
        }

        function displayConflicts(filteredData) {

                                    <input type="checkbox" 
                                           class="page-checkbox"

                                </div>
                                <div class="action-selector">

                                            onclick="updateAction('${key.replace(/'/g, "\\'")}', 'keep')">

                                    <button class="action-btn repurpose ${currentAction === 'repurpose' ? 'selected' : ''}" 
                                            onclick="updateAction('${key.replace(/'/g, "\\'")}', 'repurpose')">
                                        ♻️ REPURPOSE
                                    </button>
                                    <button class="action-btn redirect ${currentAction === 'redirect' ? 'selected' : ''}"

        function toggleConflictDone(keyword, checked) {
            // Find all pages for this keyword and mark them all as done/undone
            const conflict = conflictsData.find(c => c.keyword === keyword);
            if (!conflict) return;
            
            conflict.pages.forEach(p => {
                const key = `${keyword}|||${p.url}`;
                if (!resolutionRegistry[key]) resolutionRegistry[key] = {};
                
                const currentAction = resolutionRegistry[key].action;
                
                if (checked) {
                    // Mark as done
                    resolutionRegistry[key].done = true;
                    resolutionRegistry[key].timestamp = new Date().toISOString();
                    
                    // If this is a KEEP action, lock it
                    if (currentAction === 'keep') {
                        resolutionRegistry[key].locked = 'LOCKED';
                        resolutionRegistry[key].status = 'PENDING';
                        resolutionRegistry[key].action = 'TO_OPTIMIZE';
                        
                        // Add to locked keywords
                        lockedKeywords[keyword.toLowerCase()] = {
                            url: p.url,
                            source: 'User Resolved',
                            locked: true,
                            timestamp: new Date().toISOString()
                        };
                    }
                } else {
                    // Unmark
                    resolutionRegistry[key].done = false;
                    resolutionRegistry[key].timestamp = null;
                    
                    // If unlocking a KEEP action
                    if (currentAction === 'TO_OPTIMIZE') {
                        delete lockedKeywords[keyword.toLowerCase()];
                        delete resolutionRegistry[key].locked;
                        delete resolutionRegistry[key].status;
                        resolutionRegistry[key].action = 'keep';
                    }
                }
            });
            
            saveRegistry();
            rebuildConflictsData();
            updateProgressBadge();
            displayStats();
            displayConflicts();
        }
        
        function markConflictUnresolvable(keyword) {
            if (confirm(`Mark "${keyword}" as UNRESOLVABLE?\n\nThis means none of the URLs are suitable for this keyword.\nThe conflict will be removed from the list and no keyword will be locked.`)) {
                unresolvableConflicts.add(keyword);
                localStorage.setItem('unresolvable_conflicts', JSON.stringify([...unresolvableConflicts]));
                rebuildConflictsData();
                displayStats();
                displayConflicts();
            }
        }
        
        function deleteConflict(keyword) {
            if (confirm(`Delete conflict for "${keyword}"?\n\nThis will remove it from the list permanently.\nNo keyword will be locked.`)) {
                deletedConflicts.add(keyword);
                localStorage.setItem('deleted_conflicts', JSON.stringify([...deletedConflicts]));
                rebuildConflictsData();
                displayStats();
                displayConflicts();
            }
        }
        
        function saveKeywordForRepurpose(keyword, clicks, impressions, ctr, position) {
            repurposeKeywords[keyword] = {
                keyword: keyword,
                clicks: clicks,
                impressions: impressions,
                ctr: ctr,
                position: position,
                savedDate: new Date().toISOString(),
                source: 'Conflict - No suitable URL'
            };
            localStorage.setItem('repurpose_keywords', JSON.stringify(repurposeKeywords));
            
            // Also remove from visible conflicts
            deletedConflicts.add(keyword);
            localStorage.setItem('deleted_conflicts', JSON.stringify([...deletedConflicts]));
            
            // AUTO-SAVE to GitHub immediately
            saveRepurposeKeywordsToGitHub();
            
            rebuildConflictsData();
            displayStats();
            displayConflicts();
        }
        
        async function saveRepurposeKeywordsToGitHub() {
            const token = document.getElementById('githubToken').value.trim();
            if (!token) {
                console.warn('GitHub token missing - repurpose keywords saved locally only');
                return;
            }
            
            if (Object.keys(repurposeKeywords).length === 0) {
                return;
            }
            
            try {
                // Fetch the existing file from GitHub
                const checkResponse = await fetch(
                    'https://api.github.com/repos/aboutwallart/seo-tools/contents/data/keywords-for-repurpose.csv',
                    {
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    }
                );
                
                let existingCSV = '';
                let sha = null;
                
                if (checkResponse.ok) {
                    const fileData = await checkResponse.json();
                    sha = fileData.sha;
                    // Decode the base64 content
                    existingCSV = decodeURIComponent(escape(atob(fileData.content)));
                } else {
                    // File doesn't exist, start with headers
                    existingCSV = 'Keyword,Clicks,Impressions,CTR,Position,Saved Date,Source\n';
                }
                
                // Parse existing CSV to avoid duplicates
                const existingKeywords = new Set();
                const lines = existingCSV.trim().split('\n');
                for (let i = 1; i < lines.length; i++) { // Skip header
                    const firstComma = lines[i].indexOf(',');
                    if (firstComma > 0) {
                        const keyword = lines[i].substring(0, firstComma).replace(/^"|"$/g, '');
                        existingKeywords.add(keyword);
                    }
                }
                
                // Append only NEW keywords
                let newRows = '';
                let addedCount = 0;
                
                Object.values(repurposeKeywords).forEach(kw => {
                    if (!existingKeywords.has(kw.keyword)) {
                        const position = typeof kw.position === 'number' ? kw.position.toFixed(2) : kw.position;
                        const savedDate = kw.savedDate.split('T')[0];
                        
                        // Escape keyword if it contains commas or quotes
                        let keyword = kw.keyword;
                        if (keyword.includes(',') || keyword.includes('"')) {
                            keyword = `"${keyword.replace(/"/g, '""')}"`;
                        }
                        
                        newRows += `${keyword},${kw.clicks},${kw.impressions},${kw.ctr},${position},${savedDate},${kw.source}\n`;
                        addedCount++;
                    }
                });
                
                if (addedCount === 0) {
                    console.log('No new keywords to add - all already in GitHub');
                    return;
                }
                
                // Combine existing + new
                const updatedCSV = existingCSV.trim() + '\n' + newRows;
                
                // Upload back to GitHub
                const uploadData = {
                    message: `Add ${addedCount} keyword(s) for repurpose - ${new Date().toISOString()}`,
                    content: btoa(unescape(encodeURIComponent(updatedCSV))),
                    branch: 'main'
                };
                
                if (sha) {
                    uploadData.sha = sha;
                }
                
                const response = await fetch(
                    'https://api.github.com/repos/aboutwallart/seo-tools/contents/data/keywords-for-repurpose.csv',
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(uploadData)
                    }
                );
                
                if (response.ok) {
                    console.log(`✅ ${addedCount} keyword(s) auto-saved to GitHub`);
                } else {
                    const error = await response.json();
                    console.error('GitHub save failed:', error.message);
                }
                
            } catch (error) {
                console.error('Auto-save error:', error);
            }
        }

        function exportRegistry() {
            const data = [];
            const processedKeywords = new Set();
            
            // Process all conflicts
            Object.values(allConflictPages).forEach(conflict => {
                const keyword = conflict.keyword;
                const keywordLower = keyword.toLowerCase();
                processedKeywords.add(keywordLower);
                
                conflict.allPages.forEach(page => {
                    const key = `${keyword}|||${page.url}`;
                    const reg = resolutionRegistry[key] || {};
                    
                    // Determine lock status for export
                    let lockStatus = '';
                    let status = '';
                    let action = '';
                    
                    if (reg.locked === 'LOCKED') {
                        // This is a locked page
                        lockStatus = 'LOCKED';
                        status = reg.status || 'PENDING';
                        action = reg.action || 'TO_OPTIMIZE';
                    } else if (reg.done) {
                        // Done but not locked
                        status = 'DONE';
                        action = (reg.action || 'pending').toUpperCase();
                    } else {
                        // Pending
                        status = 'PENDING';
                        action = (reg.action || 'pending').toUpperCase();
                    }
                    
                    data.push({
                        'Keyword': keyword,
                        'Page URL': page.url,
                        'LOCKED': lockStatus,
                        'Status': status,
                        'Action': action,
                        'Clicks': page.clicks,
                        'Position': page.position.toFixed(1),
                        'Match Score': page.matchScore.toFixed(0) + '%',
                        'AI Score': page.aiScore ? page.aiScore.toFixed(1) : 'N/A'
                    });
                });
            });
            
            // Add pre-locked keywords that don't have conflicts
            Object.entries(lockedKeywords).forEach(([keyword, info]) => {
                if (!processedKeywords.has(keyword)) {
                    data.push({
                        'Keyword': keyword,
                        'Page URL': info.url,
                        'LOCKED': 'LOCKED',
                        'Status': 'PENDING',
                        'Action': 'TO_OPTIMIZE',
                        'Clicks': 'N/A',
                        'Position': 'N/A',
                        'Match Score': 'N/A',
                        'AI Score': 'N/A'
                    });
                }
            });
            
            // Create Excel workbook
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Keyword Master Registry');
            
            XLSX.writeFile(wb, `Keyword_Master_Registry_${new Date().toISOString().split('T')[0]}.xlsx`);
        }

                );
                
                if (response.ok) {
                    alert('✅ Registry saved to GitHub!\n\nFormat:\n• LOCKED: LOCKED (for locked pages)\n• Status: PENDING/DONE\n• Action: TO_OPTIMIZE/KEEP/LINK/REPURPOSE/REDIRECT\n\nFile: keyword-master-registry.csv');
                } else {
                    const error = await response.json();
                    alert(`Failed to save: ${error.message}`);
                }
                
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        function updateProgress(percent, message) {
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('loadingMessage').textContent = message;
        }

        function showLoading(show) {
            document.getElementById('loadingSection').classList.toggle('hidden', !show);
        }

        function showError(msg) {
            const el = document.getElementById('errorSection');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('errorSection').classList.add('hidden');
        }

        async function cleanupDuplicateURLs() {
            const token = document.getElementById('githubToken').value.trim();
            if (!token) {
                alert('Please enter your GitHub token first');
                return;
            }
            
            try {
                showLoading(true);
                updateProgress(0, 'Fetching registry from GitHub...');
                
                // Fetch the keyword-master-registry.csv from GitHub
                const response = await fetch(
                    'https://api.github.com/repos/aboutwallart/seo-tools/contents/data/keyword-master-registry.csv',
                    {
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    }
                );
                
                if (!response.ok) {
                    throw new Error('Could not fetch registry file from GitHub');
                }
                
                const fileData = await response.json();
                const sha = fileData.sha;
                const csvContent = decodeURIComponent(escape(atob(fileData.content)));
                
                updateProgress(30, 'Analyzing duplicate URLs...');
                
                // Parse CSV
                const lines = csvContent.trim().split('\n');
                const headers = lines[0].split(',');
                
                const entries = [];
                for (let i = 1; i < lines.length; i++) {
                    const values = parseCSVLine(lines[i]);
                    if (values.length >= 9) {
                        entries.push({
                            keyword: values[0],
                            url: values[1],
                            locked: values[2],
                            status: values[3],
                            action: values[4],
                            clicks: parseInt(values[5]) || 0,
                            position: parseFloat(values[6]) || 0,
                            matchScore: values[7],
                            aiScore: parseFloat(values[8]) || 0
                        });
                    }
                }
                
                updateProgress(50, 'Finding duplicates...');
                
                // Find URLs that are LOCKED to multiple keywords
                const urlToKeywords = {};
                entries.forEach(entry => {
                    if (entry.locked === 'LOCKED') {
                        if (!urlToKeywords[entry.url]) {
                            urlToKeywords[entry.url] = [];
                        }
                        urlToKeywords[entry.url].push(entry);
                    }
                });
                
                const duplicates = Object.entries(urlToKeywords).filter(([url, entries]) => entries.length > 1);
                
                if (duplicates.length === 0) {
                    showLoading(false);
                    alert('✅ No duplicate URLs found!\n\nAll URLs are locked to only one keyword.');
                    return;
                }
                
                updateProgress(70, 'Scoring keywords...');
                
                // For each duplicate, score and pick winner
                const changes = [];
                duplicates.forEach(([url, entries]) => {
                    // Score each keyword: clicks (40%) + position (30%) + AI score (30%)
                    entries.forEach(entry => {
                        const clicksScore = Math.min((entry.clicks / 100) * 100, 100);
                        const positionScore = Math.max(0, 100 - (entry.position * 5));
                        const aiScoreNormalized = entry.aiScore || 50;
                        
                        entry.opportunityScore = (clicksScore * 0.4) + (positionScore * 0.3) + (aiScoreNormalized * 0.3);
                    });
                    
                    // Sort by opportunity score
                    entries.sort((a, b) => b.opportunityScore - a.opportunityScore);
                    
                    const winner = entries[0];
                    const losers = entries.slice(1);
                    
                    changes.push({
                        url,
                        winner: {
                            keyword: winner.keyword,
                            clicks: winner.clicks,
                            position: winner.position,
                            score: winner.opportunityScore.toFixed(1)
                        },
                        losers: losers.map(l => ({
                            keyword: l.keyword,
                            clicks: l.clicks,
                            position: l.position,
                            score: l.opportunityScore.toFixed(1)
                        }))
                    });
                });
                
                showLoading(false);
                
                // Show approval dialog
                displayDuplicateReport(changes, entries, sha, csvContent);
                
            } catch (error) {
                showLoading(false);
                alert(`Error: ${error.message}`);
            }
        }
        
        function parseCSVLine(line) {
            const values = [];
            let current = '';
            let inQuotes = false;
            
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    values.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            values.push(current.trim());
            return values;
        }
        
        function displayDuplicateReport(changes, allEntries, sha, originalCSV) {
            const reportHTML = `
                <div style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 9999; overflow-y: auto; padding: 20px;">
                    <div style="max-width: 1200px; margin: 0 auto; background: white; border-radius: 12px; padding: 30px;">
                        <h2 style="margin-bottom: 20px;">🔧 Duplicate URL Cleanup Report</h2>
                        <p style="margin-bottom: 20px; color: #666;">Found <strong>${changes.length} URLs</strong> locked to multiple keywords. Review the recommended changes:</p>
                        
                        ${changes.map((change, idx) => `
                            <div style="background: #f8f9fa; border-radius: 8px; padding: 20px; margin-bottom: 20px; border-left: 4px solid #0969da;">
                                <div style="font-weight: 600; margin-bottom: 10px;">URL #${idx + 1}</div>
                                <div style="font-size: 14px; color: #0969da; word-break: break-all; margin-bottom: 15px;">${change.url}</div>
                                
                                <div style="background: #dcfce7; padding: 15px; border-radius: 6px; margin-bottom: 10px;">
                                    <div style="font-weight: 700; color: #16a34a; margin-bottom: 8px;">✅ KEEP (Winner)</div>
                                    <div><strong>Keyword:</strong> ${change.winner.keyword}</div>
                                    <div style="display: flex; gap: 20px; margin-top: 8px; font-size: 13px;">
                                        <span><strong>Score:</strong> ${change.winner.score}</span>
                                        <span><strong>Clicks:</strong> ${change.winner.clicks}</span>
                                        <span><strong>Position:</strong> ${change.winner.position}</span>
                                    </div>
                                </div>
                                
                                ${change.losers.map(loser => `
                                    <div style="background: #fef3c7; padding: 15px; border-radius: 6px; margin-bottom: 8px;">
                                        <div style="font-weight: 700; color: #ca8a04; margin-bottom: 8px;">♻️ CHANGE TO REPURPOSE</div>
                                        <div><strong>Keyword:</strong> ${loser.keyword}</div>
                                        <div style="display: flex; gap: 20px; margin-top: 8px; font-size: 13px;">
                                            <span><strong>Score:</strong> ${loser.score}</span>
                                            <span><strong>Clicks:</strong> ${loser.clicks}</span>
                                            <span><strong>Position:</strong> ${loser.position}</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `).join('')}
                        
                        <div style="display: flex; gap: 15px; margin-top: 30px;">
                            <button onclick="applyDuplicateCleanup(${JSON.stringify(changes).replace(/"/g, '&quot;')}, ${JSON.stringify(allEntries).replace(/"/g, '&quot;')}, '${sha}', \`${originalCSV.replace(/`/g, '\\`')}\`)" 
                                    style="padding: 14px 32px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 16px;">
                                ✅ Approve & Update GitHub
                            </button>
                            <button onclick="closeDuplicateReport()" 
                                    style="padding: 14px 32px; background: #6b7280; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 16px;">
                                ❌ Cancel
                            </button>
                        </div>
                    </div>
                </div>
            `;
            
            document.body.insertAdjacentHTML('beforeend', reportHTML);
        }
        
        function closeDuplicateReport() {
            const report = document.querySelector('[style*="position: fixed"]');
            if (report) report.remove();
        }
        
        async function applyDuplicateCleanup(changes, allEntries, sha, originalCSV) {
            try {
                closeDuplicateReport();
                showLoading(true);
                updateProgress(0, 'Applying changes...');
                
                // Create set of keywords to change
                const keywordsToRepurpose = new Set();
                changes.forEach(change => {
                    change.losers.forEach(loser => {
                        keywordsToRepurpose.add(loser.keyword);
                    });
                });
                
                // Update entries
                allEntries.forEach(entry => {
                    if (keywordsToRepurpose.has(entry.keyword)) {
                        entry.locked = '';
                        entry.status = 'PENDING';
                        entry.action = 'REPURPOSE';
                    }
                });
                
                updateProgress(50, 'Generating updated CSV...');
                
                // Rebuild CSV
                let newCSV = 'Keyword,Page URL,LOCKED,Status,Action,Clicks,Position,Match Score,AI Score\n';
                allEntries.forEach(entry => {
                    const keyword = entry.keyword.includes(',') ? `"${entry.keyword}"` : entry.keyword;
                    const url = entry.url.includes(',') ? `"${entry.url}"` : entry.url;
                    newCSV += `${keyword},${url},${entry.locked},${entry.status},${entry.action},${entry.clicks},${entry.position},${entry.matchScore},${entry.aiScore}\n`;
                });
                
                updateProgress(80, 'Uploading to GitHub...');
                
                const token = document.getElementById('githubToken').value.trim();
                const response = await fetch(
                    'https://api.github.com/repos/aboutwallart/seo-tools/contents/data/keyword-master-registry.csv',
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `Fix duplicate URLs - ${changes.length} URLs cleaned up`,
                            content: btoa(unescape(encodeURIComponent(newCSV))),
                            sha: sha,
                            branch: 'main'
                        })
                    }
                );
                
                if (response.ok) {
                    showLoading(false);
                    alert(`✅ Success!\n\n${changes.length} duplicate URLs fixed.\n\nLosing keywords changed to REPURPOSE.`);
                } else {
                    const error = await response.json();
                    throw new Error(error.message);
                }
                
            } catch (error) {
                showLoading(false);
                alert(`Error updating GitHub: ${error.message}`);
            }
        }

        function resetAll() {
            if (confirm('Are you sure? This will clear ALL your decisions and checkboxes. You cannot undo this.')) {
                localStorage.removeItem('resolution_registry');
                resolutionRegistry = {};
                // Don't clear lockedKeywords - keep pre-optimized and blog keywords
                alert('Reset complete! Refresh the page to see clean data.');
                location.reload();
            }
        }
    </script>
