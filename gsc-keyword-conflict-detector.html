<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSC Keyword Conflict Detector</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: #fff;
            color: #333;
            padding: 30px;
            text-align: center;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 16px;
        }
        
        .setup-section {
            padding: 30px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #0969da;
        }
        
        .btn {
            background: #0969da;
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .btn:hover:not(:disabled) {
            background: #0860ca;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-export {
            background: #10b981;
            margin-left: 10px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 30px;
            background: #f8f9fa;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .stat-card .number {
            font-size: 36px;
            font-weight: 700;
            color: #0969da;
            margin-bottom: 8px;
        }
        
        .stat-card .label {
            color: #666;
            font-size: 14px;
        }
        
        .conflicts-section {
            padding: 30px;
            max-height: 600px;
            overflow-y: auto;
        }
        
        .conflict-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #0969da;
        }
        
        .conflict-keyword {
            font-size: 20px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }
        
        .conflict-stats {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #666;
            flex-wrap: wrap;
        }
        
        .conflict-stats span {
            background: white;
            padding: 6px 12px;
            border-radius: 6px;
        }
        
        .pages-list {
            margin-top: 15px;
        }
        
        .page-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 15px;
            align-items: center;
        }
        
        .page-url {
            color: #0969da;
            text-decoration: none;
            word-break: break-all;
            font-size: 14px;
        }
        
        .page-url:hover {
            text-decoration: underline;
        }
        
        .page-stats {
            display: flex;
            gap: 10px;
            font-size: 13px;
            color: #666;
        }
        
        .action-select {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            background: white;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0969da;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #fee;
            color: #c00;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 30px;
        }
        
        .filter-section {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .filter-section input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
        }
        
        .hidden {
            display: none;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 15px;
        }
        
        .progress-fill {
            height: 100%;
            background: #0969da;
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Keyword Conflict Detector</h1>
            <p>Detect and resolve keyword cannibalization across your content</p>
        </div>
        
        <div class="setup-section">
            <h2 style="font-size: 24px; margin-bottom: 10px; color: #333;">GitHub Authentication</h2>
            
            <div class="input-group">
                <label>GitHub Personal Access Token</label>
                <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx">
            </div>
            
            <p style="color: #666; font-size: 14px; margin-bottom: 20px;">
                Your token is stored locally in your browser and never sent anywhere except GitHub API.
            </p>
            
            <button class="btn" id="analyzeBtn" onclick="startAnalysis()">Start Analysis</button>
            <button class="btn btn-export hidden" id="exportBtn" onclick="exportToExcel()">📥 Export to Excel</button>
        </div>
        
        <div id="loadingSection" class="loading hidden">
            <div class="spinner"></div>
            <p id="loadingMessage">Loading data...</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>
        </div>
        
        <div id="errorSection" class="error hidden"></div>
        
        <div id="statsSection" class="stats hidden"></div>
        
        <div id="filterSection" class="filter-section hidden">
            <input type="text" id="searchFilter" placeholder="🔎 Search keywords or URLs..." oninput="filterConflicts()">
        </div>
        
        <div id="conflictsSection" class="conflicts-section hidden"></div>
    </div>

    <script>
        let queriesData = [];
        let pagesData = [];
        let conflictsData = [];
        let resolutionRegistry = {};

        window.addEventListener('DOMContentLoaded', () => {
            const savedToken = localStorage.getItem('github_token');
            if (savedToken) {
                document.getElementById('githubToken').value = savedToken;
            }
        });

        async function fetchGitHubFile(owner, repo, path, token) {
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
            const headers = { 'Accept': 'application/vnd.github.v3.raw' };
            if (token) headers['Authorization'] = `token ${token}`;
            
            const response = await fetch(url, { headers });
            if (!response.ok) throw new Error(`GitHub API error: ${response.status}`);
            return await response.text();
        }

        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            
            return lines.slice(1).map(line => {
                const values = [];
                let current = '';
                let inQuotes = false;
                
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        values.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                values.push(current.trim());
                
                const obj = {};
                headers.forEach((header, i) => {
                    obj[header] = values[i] || '';
                });
                return obj;
            });
        }

        function normalizeText(text) {
            return text.toLowerCase().replace(/[^\w\s-]/g, ' ').replace(/\s+/g, ' ').trim();
        }

        function getKeywords(text) {
            return normalizeText(text).split(' ').filter(w => w.length > 2);
        }

        async function startAnalysis() {
            const btn = document.getElementById('analyzeBtn');
            btn.disabled = true;
            
            try {
                await analyzeConflicts();
            } finally {
                btn.disabled = false;
            }
        }

        async function analyzeConflicts() {
            const token = document.getElementById('githubToken').value.trim();
            
            if (!token) {
                showError('Please enter your GitHub Personal Access Token');
                return;
            }
            
            localStorage.setItem('github_token', token);
            
            try {
                showLoading(true);
                hideError();
                updateProgress(0, 'Fetching data from GitHub...');
                
                const queriesCsv = await fetchGitHubFile('aboutwallart', 'seo-tools', 'data/Queries.csv', token);
                updateProgress(30, 'Parsing queries...');
                
                const pagesCsv = await fetchGitHubFile('aboutwallart', 'seo-tools', 'data/Pages.csv', token);
                updateProgress(40, 'Parsing pages...');
                
                queriesData = parseCSV(queriesCsv);
                pagesData = parseCSV(pagesCsv);
                
                updateProgress(50, 'Finding conflicts (top 250 queries)...');
                await new Promise(r => setTimeout(r, 100));
                
                conflictsData = findConflicts();
                
                updateProgress(90, 'Preparing results...');
                
                resolutionRegistry = {};
                conflictsData.forEach(conflict => {
                    conflict.pages.forEach(page => {
                        resolutionRegistry[`${conflict.keyword}|||${page.url}`] = 'internal-link';
                    });
                });
                
                displayStats();
                displayConflicts();
                
                updateProgress(100, 'Done!');
                
                showLoading(false);
                document.getElementById('statsSection').classList.remove('hidden');
                document.getElementById('filterSection').classList.remove('hidden');
                document.getElementById('conflictsSection').classList.remove('hidden');
                document.getElementById('exportBtn').classList.remove('hidden');
                
            } catch (error) {
                showLoading(false);
                showError(`Error: ${error.message}`);
            }
        }

        function findConflicts() {
            const conflicts = {};
            const topQueries = queriesData.slice(0, 250);
            const topPages = pagesData.slice(0, 250);
            
            const urlIndex = topPages.map(p => ({
                url: p['Top pages'],
                keywords: getKeywords(p['Top pages']),
                clicks: parseInt(p['Clicks']) || 0,
                impressions: parseInt(p['Impressions']) || 0,
                ctr: p['CTR'],
                position: parseFloat(p['Position']) || 0
            }));
            
            topQueries.forEach(query => {
                const keyword = query['Top queries'];
                const queryWords = getKeywords(keyword);
                if (queryWords.length === 0) return;
                
                const matches = [];
                
                for (const page of urlIndex) {
                    const matchCount = queryWords.filter(w => 
                        page.keywords.some(pw => pw.includes(w) || w.includes(pw))
                    ).length;
                    
                    const score = (matchCount / queryWords.length) * 100;
                    
                    if (score >= 50) {
                        matches.push({ ...page, matchScore: score });
                        if (matches.length >= 4) break;
                    }
                }
                
                if (matches.length >= 2) {
                    conflicts[keyword] = {
                        keyword,
                        clicks: parseInt(query['Clicks']) || 0,
                        impressions: parseInt(query['Impressions']) || 0,
                        ctr: query['CTR'],
                        position: parseFloat(query['Position']) || 0,
                        pages: matches.sort((a, b) => b.clicks - a.clicks)
                    };
                }
            });
            
            return Object.values(conflicts);
        }

        function updateProgress(percent, message) {
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('loadingMessage').textContent = message;
        }

        function displayStats() {
            document.getElementById('statsSection').innerHTML = `
                <div class="stat-card"><div class="number">${queriesData.length}</div><div class="label">Total Queries</div></div>
                <div class="stat-card"><div class="number">${pagesData.length}</div><div class="label">Total Pages</div></div>
                <div class="stat-card"><div class="number">${conflictsData.length}</div><div class="label">Conflicts Found</div></div>
                <div class="stat-card"><div class="number">${conflictsData.reduce((s, c) => s + c.pages.length, 0)}</div><div class="label">Affected Pages</div></div>
            `;
        }

        function displayConflicts(filter = '') {
            const filtered = filter ? 
                conflictsData.filter(c => 
                    c.keyword.toLowerCase().includes(filter.toLowerCase()) ||
                    c.pages.some(p => p.url.toLowerCase().includes(filter.toLowerCase()))
                ) : conflictsData;
            
            if (!filtered.length) {
                document.getElementById('conflictsSection').innerHTML = '<p style="text-align:center;color:#666;padding:40px;">No conflicts found</p>';
                return;
            }
            
            document.getElementById('conflictsSection').innerHTML = filtered.map(c => `
                <div class="conflict-item">
                    <div class="conflict-keyword">🔑 ${c.keyword}</div>
                    <div class="conflict-stats">
                        <span><strong>Clicks:</strong> ${c.clicks}</span>
                        <span><strong>Impressions:</strong> ${c.impressions}</span>
                        <span><strong>CTR:</strong> ${c.ctr}</span>
                        <span><strong>Position:</strong> ${c.position.toFixed(2)}</span>
                        <span><strong>Pages:</strong> ${c.pages.length}</span>
                    </div>
                    <div class="pages-list">
                        ${c.pages.map(p => {
                            const key = `${c.keyword}|||${p.url}`;
                            return `
                                <div class="page-item">
                                    <a href="${p.url}" target="_blank" class="page-url">${p.url}</a>
                                    <div class="page-stats">
                                        <span>Clicks: ${p.clicks}</span>
                                        <span>Pos: ${p.position.toFixed(1)}</span>
                                        <span>Match: ${p.matchScore.toFixed(0)}%</span>
                                    </div>
                                    <select class="action-select" onchange="updateResolution('${key.replace(/'/g, "\\'")}', this.value)">
                                        <option value="internal-link">Internal Link</option>
                                        <option value="find-later">Find Later</option>
                                        <option value="redirect">Redirect</option>
                                        <option value="keep">Keep</option>
                                    </select>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('');
        }

        function updateResolution(key, action) {
            resolutionRegistry[key] = action;
        }

        function filterConflicts() {
            displayConflicts(document.getElementById('searchFilter').value);
        }

        function exportToExcel() {
            const data = [];
            conflictsData.forEach(c => {
                c.pages.forEach(p => {
                    data.push({
                        'Keyword': c.keyword,
                        'Keyword Clicks': c.clicks,
                        'Keyword Impressions': c.impressions,
                        'Keyword CTR': c.ctr,
                        'Keyword Position': c.position,
                        'Page URL': p.url,
                        'Page Clicks': p.clicks,
                        'Page Position': p.position,
                        'Match Score': p.matchScore.toFixed(1) + '%',
                        'Resolution': resolutionRegistry[`${c.keyword}|||${p.url}`] || 'internal-link'
                    });
                });
            });
            
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Conflicts');
            XLSX.writeFile(wb, `GSC_Conflicts_${new Date().toISOString().split('T')[0]}.xlsx`);
        }

        function showLoading(show) {
            document.getElementById('loadingSection').classList.toggle('hidden', !show);
        }

        function showError(msg) {
            const el = document.getElementById('errorSection');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('errorSection').classList.add('hidden');
        }
    </script>
</body>
</html>
