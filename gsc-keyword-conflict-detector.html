        async function fetchGitHubFile(owner, repo, path, token) {
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
            const headers = { 'Accept': 'application/vnd.github.v3.raw' };
            if (token) headers['Authorization'] = `token ${token}`;
            
            const response = await fetch(url, { headers });
            if (!response.ok) throw new Error(`GitHub error: ${response.status}`);
            return await response.text();
        }

        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            
            return lines.slice(1).map(line => {
                const values = [];
                let current = '';
                let inQuotes = false;
                
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        values.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                values.push(current.trim());
                
                const obj = {};
                headers.forEach((header, i) => obj[header] = values[i] || '');
                return obj;
            });
        }

        function parseBlogCSV(csv) {
            // Remove BOM and normalize line endings
            csv = csv.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n');
            const lines = csv.trim().split('\n');
            
            let startLine = 0;
            
            // Check if first line is a title row - it should have "Main Keyword" in it
            const firstLine = lines[0].toLowerCase();
            if (!firstLine.includes('main keyword') && !firstLine.includes('keyword')) {
                // First line doesn't have proper headers, skip it
                startLine = 1;
            }
            
            const headers = lines[startLine].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            
            return lines.slice(startLine + 1).map(line => {
                const values = [];
                let current = '';
                let inQuotes = false;
                
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        values.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                values.push(current.trim());
                
                const obj = {};
                headers.forEach((header, i) => obj[header] = values[i] || '');
                return obj;
            });
        }

        function normalizeText(text) {
            return text.toLowerCase().replace(/[^\w\s-]/g, ' ').replace(/\s+/g, ' ').trim();

        function getKeywords(text) {

        function findConflicts() {
            const conflicts = {};
            const topQueries = queriesData.slice(0, 250);
            
            // Filter out /es/ and /fr/ language URLs before processing
            const filteredPages = pagesData.filter(p => {
                const url = p['Top pages'] || '';
                return !url.includes('/es/') && !url.includes('/fr/');
            });
            
            const topPages = filteredPages.slice(0, 250);
            
            const urlIndex = topPages.map(p => ({
                url: p['Top pages'],
                keywords: getKeywords(p['Top pages']),
                clicks: parseInt(p['Clicks']) || 0,
                impressions: parseInt(p['Impressions']) || 0,
                ctr: p['CTR'],
                position: parseFloat(p['Position']) || 0
            }));
            
            topQueries.forEach(query => {
                const keyword = query['Top queries'];
                const queryWords = getKeywords(keyword);
                if (queryWords.length === 0) return;
                
                const matches = [];
                
                for (const page of urlIndex) {
                    const matchCount = queryWords.filter(w => 
                        page.keywords.some(pw => pw.includes(w) || w.includes(pw))
                    ).length;
                    
                    const score = (matchCount / queryWords.length) * 100;
                    
                    if (score >= 50) {
                        matches.push({ ...page, matchScore: score });
                        if (matches.length >= 5) break;
                    }
                }
                
                if (matches.length >= 2) {
                    conflicts[keyword] = {
                        keyword,
                        clicks: parseInt(query['Clicks']) || 0,
                        impressions: parseInt(query['Impressions']) || 0,
                        ctr: query['CTR'],
                        position: parseFloat(query['Position']) || 0,
                        pages: matches // Don't sort yet - AI will sort by relevance score
                    };
                }
            });
            
            return Object.values(conflicts);
        }

        function analyzeAndRecommend() {
            conflictsData.forEach(conflict => {
                const pages = conflict.pages;
                
                // Calculate AI score for each page: Relevance (50%) + Clicks (30%) + Position (20%)
                pages.forEach(page => {
                    const relevanceScore = page.matchScore; // Already 0-100
                    const clicksScore = Math.min((page.clicks / 100) * 100, 100); // Normalize to 100
                    const positionScore = Math.max(0, 100 - (page.position * 5)); // Lower position = higher score
                    
                    page.aiScore = (relevanceScore * 0.5) + (clicksScore * 0.3) + (positionScore * 0.2);
                });
                
                // Sort by AI score (highest first)
                pages.sort((a, b) => b.aiScore - a.aiScore);
                
                const winner = pages[0];
                
                pages.forEach((page, idx) => {
                    const key = `${conflict.keyword}|||${page.url}`;
                    
                    if (!resolutionRegistry[key]) {
                        let action, reason;
                        
                        if (idx === 0) {
                            // Winner - highest AI score
                            action = 'keep';
                            reason = `🤖 AI Winner: Best relevance (${page.matchScore.toFixed(0)}%), ${page.clicks} clicks, position ${page.position.toFixed(1)}. This page should own this keyword.`;
                        } else {
                            // Decide action for losers based on their profile
                            const relevance = page.matchScore;
                            const clicks = page.clicks;
                            const position = page.position;
                            
                            if (relevance >= 80 && clicks >= 20 && position <= 10) {
                                // High relevance + good traffic = repurpose to different keyword
                                action = 'repurpose';
                                reason = `🤖 High relevance (${relevance.toFixed(0)}%) & traffic (${clicks} clicks). Good page - optimize for different keyword to avoid competing with winner.`;
                            } else if (relevance < 60 && clicks < 10 && position > 15) {
                                // Low relevance + low performance = redirect
                                action = 'redirect';
                                reason = `🤖 Low relevance (${relevance.toFixed(0)}%), ${clicks} clicks, position ${position.toFixed(1)}. Redirect to winner to consolidate authority.`;
                            } else {
                                // Middle ground = internal link
                                action = 'link';
                                reason = `🤖 Moderate match (${relevance.toFixed(0)}% relevance, ${clicks} clicks). Add internal link to winner to support its authority.`;
                            }
                        }
                        
                        resolutionRegistry[key] = {
                            action,
                            reason,
                            done: false,
                            timestamp: null
                        };
                    }
                });
            });
            
            saveRegistry();
        }

        function updateAction(key, action) {
            if (!resolutionRegistry[key]) resolutionRegistry[key] = {};
            resolutionRegistry[key].action = action;
            saveRegistry();
            filterConflicts();
        }

        function toggleDone(key) {
            if (!resolutionRegistry[key]) resolutionRegistry[key] = { done: false };
            resolutionRegistry[key].done = !resolutionRegistry[key].done;
            if (resolutionRegistry[key].done) {
                resolutionRegistry[key].timestamp = new Date().toISOString();
            } else {
                resolutionRegistry[key].timestamp = null;
            }
            saveRegistry();
            updateProgressBadge();
            filterConflicts(); // Use filterConflicts to respect Hide Resolved checkbox
        }

        function toggleConflictDone(keyword, checked) {
            // Find all pages for this keyword and mark them all as done/undone
            const conflict = conflictsData.find(c => c.keyword === keyword);
            if (!conflict) return;
            
            conflict.pages.forEach(p => {
                const key = `${keyword}|||${p.url}`;
                if (!resolutionRegistry[key]) resolutionRegistry[key] = {};
                resolutionRegistry[key].done = checked;
                if (checked) {
                    resolutionRegistry[key].timestamp = new Date().toISOString();
                } else {
                    resolutionRegistry[key].timestamp = null;
                }
            });
            
            saveRegistry();
            updateProgressBadge();
            filterConflicts();
        }

        function filterConflicts() {
            const searchFilter = document.getElementById('searchFilter').value.toLowerCase();
            const hideResolved = document.getElementById('hideResolved').checked;
            
            const filtered = conflictsData.filter(c => {
                // Apply search filter
                const matchesSearch = !searchFilter || 
                    c.keyword.toLowerCase().includes(searchFilter) ||
                    c.pages.some(p => p.url.toLowerCase().includes(searchFilter));
                
                if (!matchesSearch) return false;
                
                // Apply hide resolved filter - hide entire conflict if all pages are done
                if (hideResolved) {
                    const allDone = c.pages.every(p => {
                        const key = `${c.keyword}|||${p.url}`;
                        const reg = resolutionRegistry[key] || {};
                        return reg.done === true;
                    });
                    return !allDone; // Hide if all done
                }
                
                return true;
            });
            
            displayConflicts('', filtered);
        }

        function exportRegistry() {
            const data = [];
            const processedKeywords = new Set();
            
            // First add all conflicts
            conflictsData.forEach(c => {
                const keyword = c.keyword;
                const keywordLower = keyword.toLowerCase();
                const lockInfo = lockedKeywords[keywordLower];
                processedKeywords.add(keywordLower);
                
                c.pages.forEach((p, idx) => {
                    const key = `${keyword}|||${p.url}`;
                    const reg = resolutionRegistry[key] || {};
                    
                    // Check if this page owns the keyword
                    const ownsKeyword = lockInfo && lockInfo.url === p.url;
                    const isWinner = idx === 0;
                    
                    // Determine lock status
                    let lockStatus = '';
                    if (ownsKeyword) {
                        lockStatus = 'LOCKED';
                    } else if (reg.action === 'keep' && reg.done) {
                        lockStatus = 'LOCKED';
                    } else {
                        lockStatus = '';
                    }
                    
                    data.push({
                        'Keyword': keyword,
                        'Page URL': p.url,
                        'LOCKED': lockStatus,
                        'Status': reg.done ? 'DONE' : 'PENDING',
                        'Action': (reg.action || 'pending').toUpperCase(),
                        'Clicks': p.clicks,
                        'Position': p.position.toFixed(1),
                        'Match Score': p.matchScore.toFixed(0) + '%',
                        'AI Score': p.aiScore ? p.aiScore.toFixed(1) : 'N/A',
                        'Is Winner': isWinner ? 'YES' : 'NO',
                        'Source': lockStatus === 'LOCKED' && ownsKeyword ? lockInfo.source : ''
                    });
                });
            });
            
            // NOW ADD ALL PRE-LOCKED KEYWORDS THAT DON'T HAVE CONFLICTS
            Object.entries(lockedKeywords).forEach(([keyword, info]) => {
                if (!processedKeywords.has(keyword)) {
                    data.push({
                        'Keyword': keyword,
                        'Page URL': info.url,
                        'LOCKED': 'LOCKED',
                        'Status': 'NO CONFLICT',
                        'Action': 'KEEP',
                        'Clicks': 'N/A',
                        'Position': 'N/A',
                        'Match Score': 'N/A',
                        'AI Score': 'N/A',
                        'Is Winner': 'YES',
                        'Source': info.source
                    });
                }
            });
            
            // Count URL occurrences to identify duplicates (pages ranking for multiple keywords)
            const urlCounts = {};
            data.forEach(row => {
                const url = row['Page URL'];
                urlCounts[url] = (urlCounts[url] || 0) + 1;
            });
            
            // Mark which URLs are duplicates for yellow highlighting
            data.forEach(row => {
                const url = row['Page URL'];
                row['Multiple Keywords'] = urlCounts[url] > 1 ? 'YES' : 'NO';
            });
            
            // Create second sheet with all locked keywords for easy reference
            const lockedData = [];
            Object.entries(lockedKeywords).forEach(([keyword, info]) => {
                lockedData.push({
                    'Keyword': keyword,
                    'Locked To URL': info.url,
                    'Source': info.source,
                    'Full Title': info.fullTitle || 'N/A'
                });
            });
            
            const ws1 = XLSX.utils.json_to_sheet(data);
            
            // Apply yellow highlighting to rows where URL appears multiple times
            const range = XLSX.utils.decode_range(ws1['!ref']);
            for (let R = range.s.r + 1; R <= range.e.r; ++R) {
                const multiCell = XLSX.utils.encode_cell({ r: R, c: range.e.c }); // Last column (Multiple Keywords)
                
                if (ws1[multiCell] && ws1[multiCell].v === 'YES') {
                    // Highlight the entire row in yellow
                    for (let C = range.s.c; C <= range.e.c; ++C) {
                        const cellAddress = XLSX.utils.encode_cell({ r: R, c: C });
                        if (ws1[cellAddress]) {
                            if (!ws1[cellAddress].s) ws1[cellAddress].s = {};
                            ws1[cellAddress].s.fill = { fgColor: { rgb: "FFFF00" } };
                        }
                    }
                }
            }
            
            const ws2 = XLSX.utils.json_to_sheet(lockedData);
            
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws1, 'All Keywords Registry');
            XLSX.utils.book_append_sheet(wb, ws2, 'Locked Keywords List');
            
            XLSX.writeFile(wb, `Keyword_Master_Registry_${new Date().toISOString().split('T')[0]}.xlsx`);
        }

                            'Match Score': 'N/A',
                            'AI Score': 'N/A',
                            'Is Winner': 'YES',
                            'Source': info.source
                        });
                    }
                });
                
                // Convert to CSV
                const headers = Object.keys(data[0]);
                let csv = headers.join(',') + '\n';
                data.forEach(row => {
                    csv += headers.map(h => {
                        const val = row[h];
                        // Escape commas and quotes
                        if (typeof val === 'string' && (val.includes(',') || val.includes('"'))) {
                            return `"${val.replace(/"/g, '""')}"`;
                        }
                        return val;
                    }).join(',') + '\n';
                });
                
                // Get current file SHA (needed to update existing file)
                let sha = null;
                try {
                    const checkResponse = await fetch(
                        'https://api.github.com/repos/aboutwallart/seo-tools/contents/data/keyword-master-registry.csv',
                        {
                            headers: {
                                'Authorization': `token ${token}`,
                                'Accept': 'application/vnd.github.v3+json'
                            }
                        }
                    );
                    if (checkResponse.ok) {
                        const fileData = await checkResponse.json();
                        sha = fileData.sha;
                    }
                } catch (e) {
                    // File doesn't exist yet, that's fine
                }
                
                // Upload to GitHub
                const uploadData = {
                    message: `Update keyword registry - ${new Date().toISOString()}`,
                    content: btoa(unescape(encodeURIComponent(csv))), // Base64 encode
                    branch: 'main'
                };
                
                if (sha) {
                    uploadData.sha = sha; // Required for updates
                }
                
                const response = await fetch(
                    'https://api.github.com/repos/aboutwallart/seo-tools/contents/data/keyword-master-registry.csv',
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(uploadData)
                    }
                );
                
                if (response.ok) {
                    alert('✅ Registry saved to GitHub!\n\nOther tools can now access:\nhttps://raw.githubusercontent.com/aboutwallart/seo-tools/main/data/keyword-master-registry.csv');
                } else {
                    const error = await response.json();
                    alert(`Failed to save: ${error.message}`);
                }
                
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        function updateProgress(percent, message) {
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('loadingMessage').textContent = message;
        }

        function showLoading(show) {
            document.getElementById('loadingSection').classList.toggle('hidden', !show);
        }

        function showError(msg) {
            const el = document.getElementById('errorSection');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('errorSection').classList.add('hidden');
        }

        function resetAll() {
            if (confirm('Are you sure? This will clear ALL your decisions and checkboxes. You cannot undo this.')) {
                localStorage.removeItem('resolution_registry');
                resolutionRegistry = {};
                alert('Reset complete! Refresh the page to see clean data.');
                location.reload();
            }
        }
    </script>
</body>
</html>
