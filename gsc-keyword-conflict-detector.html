<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSC Keyword Conflict Resolver - Fixed Auto-Save</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: #fff;
            padding: 20px 30px;
            border-bottom: 2px solid #e0e0e0;
            text-align: center;
        }
        
        .header h1 { font-size: 28px; margin-bottom: 5px; color: #333; }
        .header p { color: #666; font-size: 14px; }
        
        .setup-section { padding: 20px 30px; border-bottom: 1px solid #e0e0e0; }
        
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #333; }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .btn {
            background: #0969da;
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .btn:hover:not(:disabled) { background: #0860ca; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-export { background: #10b981; margin-left: 10px; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            padding: 30px;
            background: #f8f9fa;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .stat-card .number { font-size: 36px; font-weight: 700; color: #0969da; margin-bottom: 8px; }
        .stat-card .label { color: #666; font-size: 14px; }
        
        .conflicts-section { padding: 30px; }
        
        .conflict-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            border-left: 5px solid #0969da;
        }
        
        .conflict-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .conflict-keyword {
            font-size: 22px;
            font-weight: 700;
            color: #333;
        }
        
        .conflict-meta {
            display: flex;
            gap: 15px;
            font-size: 14px;
            color: #666;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .conflict-meta span {
            background: white;
            padding: 6px 12px;
            border-radius: 6px;
        }
        
        .page-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            position: relative;
        }
        
        .page-card.winner {
            border-color: #10b981;
            background: #f0fdf4;
        }
        
        .page-card.locked {
            border-color: #dc2626;
            background: #fef2f2;
            opacity: 0.7;
        }
        
        .page-card.done {
            opacity: 0.6;
            background: #f9fafb;
        }
        
        .winner-badge {
            position: absolute;
            top: -15px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
            text-transform: uppercase;
        }
        
        .locked-badge {
            position: absolute;
            top: -15px;
            right: 20px;
            background: #dc2626;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.4);
            text-transform: uppercase;
        }
        
        .page-header {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .page-checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
            margin-top: 3px;
        }
        
        .page-url {
            flex: 1;
            color: #0969da;
            text-decoration: none;
            word-break: break-all;
            font-size: 15px;
            font-weight: 500;
        }
        
        .page-url:hover { text-decoration: underline; }
        
        .page-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
            font-size: 13px;
        }
        
        .stat-item {
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 6px;
        }
        
        .stat-item strong { color: #333; }
        .stat-item span { color: #666; }
        
        .action-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .action-btn {
            padding: 12px 24px;
            border: 3px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .action-btn:hover {
            border-color: #0969da;
            background: #f0f9ff;
            transform: translateY(-2px);
        }
        
        .action-btn.selected {
            border-color: #0969da;
            background: #0969da;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(9, 105, 218, 0.3);
        }
        
        .action-btn.keep { border-color: #10b981; color: #10b981; }
        .action-btn.keep.selected { background: #10b981; border-color: #10b981; color: white; }
        
        .action-btn.link { border-color: #f59e0b; color: #f59e0b; }
        .action-btn.link.selected { background: #f59e0b; border-color: #f59e0b; color: white; }
        
        .action-btn.repurpose { border-color: #8b5cf6; color: #8b5cf6; }
        .action-btn.repurpose.selected { background: #8b5cf6; border-color: #8b5cf6; color: white; }
        
        .action-btn.redirect { border-color: #ef4444; color: #ef4444; }
        .action-btn.redirect.selected { background: #ef4444; border-color: #ef4444; color: white; }
        
        .loading { text-align: center; padding: 40px; color: #666; }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0969da;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error { background: #fee; color: #c00; padding: 15px; border-radius: 8px; margin: 20px 30px; }
        .hidden { display: none; }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 15px;
        }
        .progress-fill {
            height: 100%;
            background: #0969da;
            width: 0%;
            transition: width 0.3s;
        }
        
        .filter-section {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .filter-section input {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
        }
        
        .progress-badge {
            background: #10b981;
            color: white;
            padding: 6px 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
        }
        
        .auto-save-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
            z-index: 10000;
            display: none;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .auto-save-indicator.saving { background: #f59e0b; }
        .auto-save-indicator.error { background: #ef4444; }
    </style>
</head>
<body>
    <div id="autoSaveIndicator" class="auto-save-indicator"></div>
    
    <div class="container">
        <div class="header">
            <h1>🎯 Keyword Conflict Resolver</h1>
            <p>✨ Auto-saves to GitHub • Ignores URL variants</p>
        </div>
        
        <div class="setup-section">
            <h2 style="font-size: 24px; margin-bottom: 10px; color: #333;">GitHub Authentication</h2>
            
            <div class="input-group">
                <label>GitHub Personal Access Token</label>
                <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" value="">
            </div>
            
            <p style="color: #666; font-size: 14px; margin-bottom: 20px;">
                Token stored locally. Auto-saves registry to GitHub when conflicts are resolved.
            </p>
            
            <button class="btn" id="analyzeBtn" onclick="startAnalysis()">🚀 Start Analysis</button>
            <button class="btn btn-export hidden" id="exportBtn" onclick="exportRegistry()">📥 Download Excel</button>
            <button class="btn" style="background:#ef4444; margin-left: 10px;" onclick="resetAll()">🔄 Reset All</button>
            
            <label id="hideResolvedControl" class="hidden" style="display: inline-flex; align-items: center; gap: 8px; cursor: pointer; margin-left: 20px; padding: 10px 20px; background: #f3f4f6; border-radius: 8px;">
                <input type="checkbox" id="hideResolved" onchange="filterConflicts()" style="width: 18px; height: 18px; cursor: pointer;">
                <span style="font-weight: 600;">Hide Resolved</span>
            </label>
        </div>
        
        <div id="loadingSection" class="loading hidden">
            <div class="spinner"></div>
            <p id="loadingMessage">Loading data...</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>
        </div>
        
        <div id="errorSection" class="error hidden"></div>
        
        <div id="statsSection" class="stats hidden"></div>
        
        <div id="filterSection" class="filter-section hidden">
            <input type="text" id="searchFilter" placeholder="🔎 Search keywords or URLs..." oninput="filterConflicts()">
            <div class="progress-badge" id="progressBadge">0 / 0 resolved</div>
        </div>
        
        <div id="conflictsSection" class="conflicts-section hidden"></div>
    </div>

    <script>
        let queriesData = [];
        let pagesData = [];
        let conflictsData = [];
        let allConflictPages = {}; // ALL conflicts, including resolved ones
        let resolutionRegistry = {};
        let lockedKeywords = {};
        let currentGitHubSHA = null;
        
        // Auto-save queue to prevent race conditions
        let saveQueue = [];
        let isSaving = false;

        // Load saved data
        window.addEventListener('DOMContentLoaded', () => {
            const savedToken = localStorage.getItem('github_token');
            if (savedToken) {
                document.getElementById('githubToken').value = savedToken;
            }
            
            const savedRegistry = localStorage.getItem('resolution_registry');
            if (savedRegistry) resolutionRegistry = JSON.parse(savedRegistry);
        });

        // Normalize URL - remove query parameters and trailing slashes
        function normalizeURL(url) {
            try {
                const urlObj = new URL(url);
                return (urlObj.protocol + '//' + urlObj.hostname + urlObj.pathname).replace(/\/$/, '');
            } catch (e) {
                return url.split('?')[0].split('#')[0].replace(/\/$/, '');
            }
        }

        async function fetchGitHubFile(owner, repo, path, token) {
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
            const headers = { 'Accept': 'application/vnd.github.v3.raw' };
            if (token) headers['Authorization'] = `token ${token}`;
            
            const response = await fetch(url, { headers });
            if (!response.ok) throw new Error(`GitHub error: ${response.status}`);
            return await response.text();
        }
        
        async function getGitHubFileSHA(owner, repo, path, token) {
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
            const headers = { 'Accept': 'application/vnd.github.v3+json' };
            if (token) headers['Authorization'] = `token ${token}`;
            
            const response = await fetch(url, { headers });
            if (!response.ok) return null;
            const data = await response.json();
            return data.sha;
        }

        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            
            return lines.slice(1).map(line => {
                const values = [];
                let current = '';
                let inQuotes = false;
                
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        values.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                values.push(current.trim());
                
                const obj = {};
                headers.forEach((header, i) => obj[header] = values[i] || '');
                return obj;
            });
        }

        function normalizeText(text) {
            return text.toLowerCase().replace(/[^\w\s-]/g, ' ').replace(/\s+/g, ' ').trim();
        }

        function getKeywords(text) {
            return normalizeText(text).split(' ').filter(w => w.length > 2);
        }

        async function startAnalysis() {
            document.getElementById('analyzeBtn').disabled = true;
            try {
                await analyzeConflicts();
            } finally {
                document.getElementById('analyzeBtn').disabled = false;
            }
        }

        async function analyzeConflicts() {
            const token = document.getElementById('githubToken').value.trim();
            if (!token) {
                showError('Please enter your GitHub Personal Access Token');
                return;
            }
            
            localStorage.setItem('github_token', token);
            
            try {
                showLoading(true);
                hideError();
                updateProgress(0, 'Fetching data from GitHub...');
                
                const queriesCsv = await fetchGitHubFile('aboutwallart', 'seo-tools', 'data/Queries.csv', token);
                updateProgress(20, 'Parsing queries...');
                
                const pagesCsv = await fetchGitHubFile('aboutwallart', 'seo-tools', 'data/Pages.csv', token);
                updateProgress(30, 'Parsing pages...');
                
                // Get SHA for keyword-master-registry.csv
                currentGitHubSHA = await getGitHubFileSHA('aboutwallart', 'seo-tools', 'data/keyword-master-registry.csv', token);
                
                queriesData = parseCSV(queriesCsv);
                pagesData = parseCSV(pagesCsv);
                
                updateProgress(50, 'Finding conflicts...');
                await new Promise(r => setTimeout(r, 100));
                
                findAllConflicts();
                
                updateProgress(100, 'Done!');
                
                displayStats();
                displayConflicts();
                updateProgressBadge();
                
                showLoading(false);
                document.getElementById('statsSection').classList.remove('hidden');
                document.getElementById('filterSection').classList.remove('hidden');
                document.getElementById('conflictsSection').classList.remove('hidden');
                document.getElementById('exportBtn').classList.remove('hidden');
                document.getElementById('hideResolvedControl').classList.remove('hidden');
                
            } catch (error) {
                showLoading(false);
                showError(`Error: ${error.message}`);
            }
        }

        function findAllConflicts() {
            allConflictPages = {}; // This will store ALL conflicts permanently
            const topQueries = queriesData.slice(0, 250);
            
            const filteredPages = pagesData.filter(p => {
                const url = p['Top pages'] || '';
                return !url.includes('/es/') && !url.includes('/fr/');
            });
            
            // Deduplicate pages by normalized URL (group variants together)
            const urlMap = new Map();
            
            filteredPages.forEach(p => {
                const originalUrl = p['Top pages'];
                const normalizedUrl = normalizeURL(originalUrl);
                
                if (!urlMap.has(normalizedUrl)) {
                    urlMap.set(normalizedUrl, {
                        url: originalUrl,
                        normalizedUrl: normalizedUrl,
                        keywords: getKeywords(normalizedUrl),
                        clicks: parseInt(p['Clicks']) || 0,
                        impressions: parseInt(p['Impressions']) || 0,
                        ctr: p['CTR'],
                        position: parseFloat(p['Position']) || 0
                    });
                } else {
                    const existing = urlMap.get(normalizedUrl);
                    existing.clicks += parseInt(p['Clicks']) || 0;
                    existing.impressions += parseInt(p['Impressions']) || 0;
                    const newPosition = parseFloat(p['Position']) || 0;
                    if (newPosition > 0) {
                        existing.position = (existing.position + newPosition) / 2;
                    }
                }
            });
            
            const urlIndex = Array.from(urlMap.values());
            
            topQueries.forEach(query => {
                const keyword = query['Top queries'];
                const queryWords = getKeywords(keyword);
                if (queryWords.length === 0) return;
                
                const matches = [];
                
                for (const page of urlIndex) {
                    const matchCount = queryWords.filter(w => 
                        page.keywords.some(pw => pw.includes(w) || w.includes(pw))
                    ).length;
                    
                    const score = (matchCount / queryWords.length) * 100;
                    
                    if (score >= 50) {
                        matches.push({ ...page, matchScore: score });
                    }
                }
                
                if (matches.length >= 2) {
                    matches.forEach(page => {
                        const relevanceScore = page.matchScore;
                        const clicksScore = Math.min((page.clicks / 100) * 100, 100);
                        const positionScore = Math.max(0, 100 - (page.position * 5));
                        page.aiScore = (relevanceScore * 0.5) + (clicksScore * 0.3) + (positionScore * 0.2);
                    });
                    
                    matches.sort((a, b) => b.aiScore - a.aiScore);
                    
                    // STORE ALL CONFLICTS PERMANENTLY - never remove them
                    allConflictPages[keyword] = {
                        keyword,
                        clicks: parseInt(query['Clicks']) || 0,
                        impressions: parseInt(query['Impressions']) || 0,
                        ctr: query['CTR'],
                        position: parseFloat(query['Position']) || 0,
                        allPages: matches.slice(0, 10)
                    };
                    
                    matches.slice(0, 5).forEach((page, idx) => {
                        const key = `${keyword}|||${page.url}`;
                        
                        if (!resolutionRegistry[key]) {
                            resolutionRegistry[key] = {};
                            
                            if (idx === 0) {
                                resolutionRegistry[key].action = 'keep';
                            } else {
                                const relevance = page.matchScore;
                                const clicks = page.clicks;
                                const position = page.position;
                                
                                if (relevance >= 80 && clicks >= 20 && position <= 10) {
                                    resolutionRegistry[key].action = 'repurpose';
                                } else if (relevance < 60 && clicks < 10 && position > 15) {
                                    resolutionRegistry[key].action = 'redirect';
                                } else {
                                    resolutionRegistry[key].action = 'link';
                                }
                            }
                        }
                    });
                }
            });
            
            saveRegistry();
            rebuildConflictsData();
        }

        function rebuildConflictsData() {
            // This only builds the DISPLAY list (active conflicts)
            // but allConflictPages still contains everything for GitHub export
            conflictsData = [];
            
            Object.values(allConflictPages).forEach(conflict => {
                const keyword = conflict.keyword;
                
                const hasLockedWinner = conflict.allPages.some(page => {
                    const key = `${keyword}|||${page.url}`;
                    const reg = resolutionRegistry[key] || {};
                    return reg.locked === 'LOCKED' && reg.done === true;
                });
                
                if (hasLockedWinner) {
                    return; // Skip from DISPLAY only
                }
                
                const availablePages = conflict.allPages.filter(page => {
                    for (const [otherKey, data] of Object.entries(resolutionRegistry)) {
                        const [otherKeyword, otherUrl] = otherKey.split('|||');
                        if (otherUrl === page.url && 
                            otherKeyword !== keyword && 
                            data.locked === 'LOCKED' && 
                            data.done === true) {
                            return false;
                        }
                    }
                    return true;
                });
                
                if (availablePages.length >= 2) {
                    const topAvailable = availablePages.slice(0, 5);
                    
                    conflictsData.push({
                        keyword: conflict.keyword,
                        clicks: conflict.clicks,
                        impressions: conflict.impressions,
                        ctr: conflict.ctr,
                        position: conflict.position,
                        pages: topAvailable
                    });
                }
            });
            
            saveRegistry();
        }

        function updateAction(key, action) {
            if (!resolutionRegistry[key]) resolutionRegistry[key] = {};
            resolutionRegistry[key].action = action;
            saveRegistry();
            displayConflicts();
        }

        async function toggleDone(keyword, url, checkbox) {
            const key = `${keyword}|||${url}`;
            if (!resolutionRegistry[key]) resolutionRegistry[key] = { action: 'pending', done: false };
            
            const currentAction = resolutionRegistry[key].action;
            const wasDone = resolutionRegistry[key].done;
            
            resolutionRegistry[key].done = checkbox.checked;
            
            if (checkbox.checked) {
                resolutionRegistry[key].timestamp = new Date().toISOString();
                
                if (currentAction === 'keep') {
                    resolutionRegistry[key].locked = 'LOCKED';
                    resolutionRegistry[key].status = 'PENDING';
                    resolutionRegistry[key].action = 'TO_OPTIMIZE';
                    
                    lockedKeywords[keyword.toLowerCase()] = {
                        url: url,
                        source: 'User Resolved',
                        locked: true,
                        timestamp: new Date().toISOString()
                    };
                    
                    saveRegistry();
                    
                    // AUTO-SAVE TO GITHUB
                    await queueGitHubSave(keyword, url);
                    
                    rebuildConflictsData();
                    updateProgressBadge();
                    displayStats();
                    displayConflicts();
                    
                    return;
                }
            } else {
                resolutionRegistry[key].timestamp = null;
                
                if (currentAction === 'TO_OPTIMIZE' && wasDone) {
                    delete lockedKeywords[keyword.toLowerCase()];
                    delete resolutionRegistry[key].locked;
                    delete resolutionRegistry[key].status;
                    resolutionRegistry[key].action = 'keep';
                    
                    saveRegistry();
                    
                    // AUTO-SAVE TO GITHUB (unlock)
                    await queueGitHubSave(keyword, url);
                    
                    rebuildConflictsData();
                    updateProgressBadge();
                    displayStats();
                    displayConflicts();
                    return;
                }
            }
            
            saveRegistry();
            updateProgressBadge();
            displayConflicts();
        }

        async function queueGitHubSave(keyword, url) {
            saveQueue.push({ keyword, url, timestamp: Date.now() });
            
            if (!isSaving) {
                await processGitHubSaveQueue();
            }
        }

        async function processGitHubSaveQueue() {
            if (saveQueue.length === 0) {
                isSaving = false;
                return;
            }
            
            isSaving = true;
            const token = document.getElementById('githubToken').value.trim();
            
            if (!token) {
                console.warn('Cannot auto-save: GitHub token missing');
                saveQueue = [];
                isSaving = false;
                return;
            }
            
            showAutoSaveIndicator('💾 Saving to GitHub...', 'saving');
            
            try {
                // Build CSV from ALL conflicts (including resolved ones)
                const data = [];
                const processedKeywords = new Set();
                
                // IMPORTANT: Use allConflictPages which contains EVERYTHING
                Object.values(allConflictPages).forEach(conflict => {
                    const keyword = conflict.keyword;
                    const keywordLower = keyword.toLowerCase();
                    processedKeywords.add(keywordLower);
                    
                    conflict.allPages.forEach(page => {
                        const key = `${keyword}|||${page.url}`;
                        const reg = resolutionRegistry[key] || {};
                        
                        let lockStatus = '';
                        let status = '';
                        let action = '';
                        
                        if (reg.locked === 'LOCKED') {
                            lockStatus = 'LOCKED';
                            status = reg.status || 'PENDING';
                            action = reg.action || 'TO_OPTIMIZE';
                        } else if (reg.done) {
                            status = 'DONE';
                            action = (reg.action || 'pending').toUpperCase();
                        } else {
                            status = 'PENDING';
                            action = (reg.action || 'pending').toUpperCase();
                        }
                        
                        data.push({
                            'Keyword': keyword,
                            'Page URL': page.url,
                            'LOCKED': lockStatus,
                            'Status': status,
                            'Action': action,
                            'Clicks': page.clicks,
                            'Position': page.position.toFixed(1),
                            'Match Score': page.matchScore.toFixed(0) + '%',
                            'AI Score': page.aiScore ? page.aiScore.toFixed(1) : 'N/A'
                        });
                    });
                });
                
                // Also add locked keywords that don't have conflicts
                Object.entries(lockedKeywords).forEach(([keyword, info]) => {
                    if (!processedKeywords.has(keyword)) {
                        data.push({
                            'Keyword': keyword,
                            'Page URL': info.url,
                            'LOCKED': 'LOCKED',
                            'Status': 'PENDING',
                            'Action': 'TO_OPTIMIZE',
                            'Clicks': 'N/A',
                            'Position': 'N/A',
                            'Match Score': 'N/A',
                            'AI Score': 'N/A'
                        });
                    }
                });
                
                // Convert to CSV
                if (data.length === 0) {
                    throw new Error('No data to save');
                }
                
                const headers = Object.keys(data[0]);
                let csv = headers.join(',') + '\n';
                data.forEach(row => {
                    csv += headers.map(h => {
                        const val = row[h];
                        if (typeof val === 'string' && (val.includes(',') || val.includes('"'))) {
                            return `"${val.replace(/"/g, '""')}"`;
                        }
                        return val;
                    }).join(',') + '\n';
                });
                
                // Get fresh SHA
                const sha = await getGitHubFileSHA('aboutwallart', 'seo-tools', 'data/keyword-master-registry.csv', token);
                
                const uploadData = {
                    message: `Auto-save: Locked keyword "${saveQueue[0].keyword}" - ${new Date().toISOString()}`,
                    content: btoa(unescape(encodeURIComponent(csv))),
                    branch: 'main'
                };
                
                if (sha) {
                    uploadData.sha = sha;
                }
                
                const response = await fetch(
                    'https://api.github.com/repos/aboutwallart/seo-tools/contents/data/keyword-master-registry.csv',
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(uploadData)
                    }
                );
                
                if (response.ok) {
                    showAutoSaveIndicator('✅ Saved to GitHub!', 'success');
                    saveQueue.shift();
                    
                    setTimeout(() => processGitHubSaveQueue(), 1000);
                } else {
                    const error = await response.json();
                    throw new Error(error.message);
                }
                
            } catch (error) {
                console.error('GitHub save error:', error);
                showAutoSaveIndicator('❌ Save failed: ' + error.message, 'error');
                saveQueue = [];
                isSaving = false;
            }
        }

        function showAutoSaveIndicator(message, type) {
            const indicator = document.getElementById('autoSaveIndicator');
            indicator.textContent = message;
            indicator.className = 'auto-save-indicator ' + type;
            indicator.style.display = 'block';
            
            if (type === 'success' || type === 'error') {
                setTimeout(() => {
                    indicator.style.display = 'none';
                }, 3000);
            }
        }

        function saveRegistry() {
            localStorage.setItem('resolution_registry', JSON.stringify(resolutionRegistry));
        }

        function updateProgressBadge() {
            const total = Object.keys(resolutionRegistry).length;
            const done = Object.values(resolutionRegistry).filter(r => r.done).length;
            document.getElementById('progressBadge').textContent = `${done} / ${total} resolved`;
        }

        function displayStats() {
            const total = Object.keys(resolutionRegistry).length;
            const done = Object.values(resolutionRegistry).filter(r => r.done).length;
            const pending = total - done;
            const lockedCount = Object.keys(lockedKeywords).length;
            
            document.getElementById('statsSection').innerHTML = `
                <div class="stat-card"><div class="number">${conflictsData.length}</div><div class="label">Active Conflicts</div></div>
                <div class="stat-card"><div class="number">${total}</div><div class="label">Pages Affected</div></div>
                <div class="stat-card"><div class="number" style="color:#10b981">${done}</div><div class="label">Resolved</div></div>
                <div class="stat-card"><div class="number" style="color:#f59e0b">${pending}</div><div class="label">Pending</div></div>
                <div class="stat-card"><div class="number" style="color:#dc2626">🔒 ${lockedCount}</div><div class="label">Locked URLs</div></div>
            `;
        }

        function filterConflicts() {
            const searchFilter = document.getElementById('searchFilter').value.toLowerCase();
            const hideResolved = document.getElementById('hideResolved').checked;
            
            const filtered = conflictsData.filter(c => {
                const matchesSearch = !searchFilter || 
                    c.keyword.toLowerCase().includes(searchFilter) ||
                    c.pages.some(p => p.url.toLowerCase().includes(searchFilter));
                
                if (!matchesSearch) return false;
                
                if (hideResolved) {
                    const allDone = c.pages.every(p => {
                        const key = `${c.keyword}|||${p.url}`;
                        const reg = resolutionRegistry[key] || {};
                        return reg.done === true;
                    });
                    return !allDone;
                }
                
                return true;
            });
            
            displayConflicts(filtered);
        }

        function displayConflicts(filteredData) {
            const dataToShow = filteredData || conflictsData;
            
            if (!dataToShow.length) {
                document.getElementById('conflictsSection').innerHTML = '<p style="text-align:center;color:#666;padding:40px;">No conflicts found</p>';
                return;
            }
            
            document.getElementById('conflictsSection').innerHTML = dataToShow.map(c => {
                return `
                <div class="conflict-item">
                    <div class="conflict-header">
                        <div class="conflict-keyword">🔑 ${c.keyword}</div>
                    </div>
                    <div class="conflict-meta">
                        <span><strong>Clicks:</strong> ${c.clicks}</span>
                        <span><strong>Impressions:</strong> ${c.impressions}</span>
                        <span><strong>CTR:</strong> ${c.ctr}</span>
                        <span><strong>Position:</strong> ${c.position.toFixed(2)}</span>
                        <span><strong>Pages:</strong> ${c.pages.length}</span>
                    </div>
                    ${c.pages.map((p, idx) => {
                        const key = `${c.keyword}|||${p.url}`;
                        const reg = resolutionRegistry[key] || {};
                        const isWinner = idx === 0;
                        const isDone = reg.done;
                        const isLocked = reg.locked === 'LOCKED';
                        
                        const currentAction = reg.action || (isWinner ? 'keep' : 'link');
                        
                        return `
                            <div class="page-card ${isWinner ? 'winner' : ''} ${isDone ? 'done' : ''} ${isLocked ? 'locked' : ''}">
                                ${isWinner ? '<div class="winner-badge">⭐ KEEP THIS</div>' : ''}
                                ${isLocked ? '<div class="locked-badge">🔒 LOCKED</div>' : ''}
                                <div class="page-header">
                                    <input type="checkbox" 
                                           class="page-checkbox" 
                                           ${isDone ? 'checked' : ''} 
                                           onchange="toggleDone('${c.keyword.replace(/'/g, "\\'")}', '${p.url.replace(/'/g, "\\'")}', this)">
                                    <a href="${p.url}" target="_blank" class="page-url">${p.url}</a>
                                </div>
                                <div class="page-stats">
                                    <div class="stat-item"><strong>AI Score:</strong> <span>${p.aiScore ? p.aiScore.toFixed(1) : 'N/A'}</span></div>
                                    <div class="stat-item"><strong>Relevance:</strong> <span>${p.matchScore.toFixed(0)}%</span></div>
                                    <div class="stat-item"><strong>Clicks:</strong> <span>${p.clicks}</span></div>
                                    <div class="stat-item"><strong>Position:</strong> <span>${p.position.toFixed(1)}</span></div>
                                </div>
                                <div class="action-selector">
                                    <button class="action-btn keep ${currentAction === 'keep' || currentAction === 'TO_OPTIMIZE' ? 'selected' : ''}" 
                                            onclick="updateAction('${key.replace(/'/g, "\\'")}', 'keep')">
                                        ⭐ KEEP
                                    </button>
                                    <button class="action-btn link ${currentAction === 'link' ? 'selected' : ''}" 
                                            onclick="updateAction('${key.replace(/'/g, "\\'")}', 'link')">
                                        🔗 INTERNAL LINK
                                    </button>
                                    <button class="action-btn repurpose ${currentAction === 'repurpose' ? 'selected' : ''}" 
                                            onclick="updateAction('${key.replace(/'/g, "\\'")}', 'repurpose')">
                                        ♻️ REPURPOSE
                                    </button>
                                    <button class="action-btn redirect ${currentAction === 'redirect' ? 'selected' : ''}" 
                                            onclick="updateAction('${key.replace(/'/g, "\\'")}', 'redirect')">
                                        ➡️ REDIRECT
                                    </button>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `}).join('');
        }

        function exportRegistry() {
            const data = [];
            const processedKeywords = new Set();
            
            Object.values(allConflictPages).forEach(conflict => {
                const keyword = conflict.keyword;
                const keywordLower = keyword.toLowerCase();
                processedKeywords.add(keywordLower);
                
                conflict.allPages.forEach(page => {
                    const key = `${keyword}|||${page.url}`;
                    const reg = resolutionRegistry[key] || {};
                    
                    let lockStatus = '';
                    let status = '';
                    let action = '';
                    
                    if (reg.locked === 'LOCKED') {
                        lockStatus = 'LOCKED';
                        status = reg.status || 'PENDING';
                        action = reg.action || 'TO_OPTIMIZE';
                    } else if (reg.done) {
                        status = 'DONE';
                        action = (reg.action || 'pending').toUpperCase();
                    } else {
                        status = 'PENDING';
                        action = (reg.action || 'pending').toUpperCase();
                    }
                    
                    data.push({
                        'Keyword': keyword,
                        'Page URL': page.url,
                        'LOCKED': lockStatus,
                        'Status': status,
                        'Action': action,
                        'Clicks': page.clicks,
                        'Position': page.position.toFixed(1),
                        'Match Score': page.matchScore.toFixed(0) + '%',
                        'AI Score': page.aiScore ? page.aiScore.toFixed(1) : 'N/A'
                    });
                });
            });
            
            Object.entries(lockedKeywords).forEach(([keyword, info]) => {
                if (!processedKeywords.has(keyword)) {
                    data.push({
                        'Keyword': keyword,
                        'Page URL': info.url,
                        'LOCKED': 'LOCKED',
                        'Status': 'PENDING',
                        'Action': 'TO_OPTIMIZE',
                        'Clicks': 'N/A',
                        'Position': 'N/A',
                        'Match Score': 'N/A',
                        'AI Score': 'N/A'
                    });
                }
            });
            
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Keyword Master Registry');
            
            XLSX.writeFile(wb, `Keyword_Master_Registry_${new Date().toISOString().split('T')[0]}.xlsx`);
        }

        function updateProgress(percent, message) {
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('loadingMessage').textContent = message;
        }

        function showLoading(show) {
            document.getElementById('loadingSection').classList.toggle('hidden', !show);
        }

        function showError(msg) {
            const el = document.getElementById('errorSection');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('errorSection').classList.add('hidden');
        }

        function resetAll() {
            if (confirm('Are you sure? This will clear ALL your decisions and checkboxes. You cannot undo this.')) {
                localStorage.removeItem('resolution_registry');
                resolutionRegistry = {};
                alert('Reset complete! Refresh the page to see clean data.');
                location.reload();
            }
        }
    </script>
</body>
</html>
