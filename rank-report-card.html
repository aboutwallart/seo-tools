<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rank Report Card - SEO Audit Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #212529;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 48px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #212529;
            margin-bottom: 12px;
        }

        .header .version {
            font-size: 0.9rem;
            color: #adb5bd;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .header p {
            font-size: 1.1rem;
            color: #6c757d;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Card styling */
        .card {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 32px;
            margin-bottom: 24px;
        }

        /* Input Section */
        .input-section {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .url-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
        }

        .url-input:focus {
            outline: none;
            border-color: #0066ff;
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.1);
        }

        .url-input.error {
            border-color: #c62828;
        }

        .btn-primary {
            padding: 12px 32px;
            background-color: #0066ff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: #0052cc;
        }

        .btn-primary:disabled {
            background-color: #adb5bd;
            cursor: not-allowed;
        }

        /* Error Message */
        .error-message {
            display: none;
            color: #c62828;
            font-size: 0.9rem;
            margin-top: 8px;
        }

        .error-message.active {
            display: block;
        }

        /* Loading State */
        .loading-message {
            display: none;
            text-align: center;
            padding: 24px;
            color: #6c757d;
            font-size: 1rem;
        }

        .loading-message.active {
            display: block;
        }

        /* Results Section */
        .results-section {
            display: none;
        }

        .results-section.active {
            display: block;
        }

        /* Grade and Score */
        .score-header {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 32px;
        }

        /* Two Score Cards Layout */
        .scores-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        .score-card {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 24px;
        }

        .score-card-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .score-card .grade-badge {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
        }

        .score-card .score-display {
            flex: 1;
        }

        .score-card .score-number {
            font-size: 2rem;
            font-weight: 700;
            color: #212529;
        }

        .score-card .score-label {
            font-size: 0.95rem;
            color: #6c757d;
            margin-top: 2px;
        }

        .score-card .summary-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

        .score-card .stat-box {
            text-align: center;
            padding: 16px 12px;
            border-radius: 6px;
        }

        .score-card .stat-number {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .score-card .stat-label {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .grade-badge {
            width: 120px;
            height: 120px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            font-weight: 700;
            color: white;
        }

        .score-display {
            flex: 1;
        }

        .score-number {
            font-size: 3rem;
            font-weight: 700;
            color: #212529;
        }

        .score-label {
            font-size: 1.1rem;
            color: #6c757d;
            margin-top: 4px;
        }

        /* Summary Stats */
        .summary-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-box {
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box.passes {
            background-color: #d4edda;
        }

        .stat-box.warnings {
            background-color: #fff3cd;
        }

        .stat-box.issues {
            background-color: #f8d7da;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stat-box.passes .stat-number {
            color: #2E7D32;
        }

        .stat-box.warnings .stat-number {
            color: #f57c00;
        }

        .stat-box.issues .stat-number {
            color: #c62828;
        }

        .stat-label {
            font-size: 0.95rem;
            color: #495057;
            font-weight: 600;
        }

        /* Audit Details */
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #212529;
        }

        .audit-item {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 12px;
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        .audit-item.pass {
            background-color: #f1f8f4;
            border-left: 4px solid #2E7D32;
        }

        .audit-item.warning {
            background-color: #fffbf0;
            border-left: 4px solid #f57c00;
        }

        .audit-item.fail {
            background-color: #fef5f5;
            border-left: 4px solid #c62828;
        }

        .audit-icon {
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .audit-item.pass .audit-icon {
            color: #2E7D32;
        }

        .audit-item.warning .audit-icon {
            color: #f57c00;
        }

        .audit-item.fail .audit-icon {
            color: #c62828;
        }

        .audit-content {
            flex: 1;
        }

        .audit-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .audit-item.pass .audit-name {
            color: #2E7D32;
        }

        .audit-item.warning .audit-name {
            color: #f57c00;
        }

        .audit-item.fail .audit-name {
            color: #c62828;
        }

        .audit-detail {
            color: #6c757d;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        .audit-fix {
            font-size: 0.9rem;
            margin-top: 8px;
        }

        .audit-fix strong {
            font-weight: 600;
        }

        .audit-item.warning .audit-fix strong {
            color: #f57c00;
        }

        .audit-item.fail .audit-fix strong {
            color: #c62828;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid #dee2e6;
        }

        .disclaimer {
            font-size: 0.85rem;
            color: #6c757d;
            max-width: 700px;
            margin: 0 auto;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .input-section {
                flex-direction: column;
            }

            .btn-primary {
                width: 100%;
            }

            .score-header {
                flex-direction: column;
                text-align: center;
            }

            .summary-stats {
                grid-template-columns: 1fr;
            }
        }

        /* Watch Video Button */
        .btn-video {
            margin-top: 12px;
            padding: 8px 20px;
            background-color: #0066ff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-video:hover {
            background-color: #0052cc;
        }

        /* Read Guide Button */
        .btn-guide {
            margin-top: 12px;
            margin-left: 8px;
            padding: 8px 20px;
            background-color: white;
            color: #6c757d;
            border: 2px solid #6c757d;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-guide:hover {
            background-color: #6c757d;
            color: white;
        }

        /* AI Guide Button (for AI Optimization tab) */
        .btn-ai-guide {
            margin-top: 12px;
            margin-left: 8px;
            padding: 8px 20px;
            background-color: white;
            color: #6c757d;
            border: 2px solid #6c757d;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-ai-guide:hover {
            background-color: #6c757d;
            color: white;
        }

        /* Generate Fix Button (for AI Optimization tab) */
        .btn-generate-fix {
            margin-top: 12px;
            margin-left: 8px;
            padding: 8px 20px;
            background-color: #0066ff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-generate-fix:hover {
            background-color: #0052cc;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            overflow-y: auto;
            padding: 40px 20px;
        }

        .modal.active {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 800px;
            width: 100%;
            margin: auto;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 24px 32px;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: white;
            z-index: 1;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #212529;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 2rem;
            color: #6c757d;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .modal-close:hover {
            background-color: #f8f9fa;
        }

        .modal-body {
            padding: 32px;
            line-height: 1.8;
        }

        .modal-body h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #212529;
            margin-top: 24px;
            margin-bottom: 12px;
        }

        .modal-body h3:first-child {
            margin-top: 0;
        }

        .modal-body p {
            margin-bottom: 16px;
            color: #495057;
        }

        .modal-body strong {
            font-weight: 600;
            color: #212529;
        }

        .modal-body ol, .modal-body ul {
            margin-left: 24px;
            margin-bottom: 16px;
        }

        .modal-body li {
            margin-bottom: 8px;
            color: #495057;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 2px solid #dee2e6;
        }

        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            font-size: 1rem;
            font-weight: 600;
            color: #6c757d;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab:hover {
            color: #212529;
        }

        .tab.active {
            color: #0066ff;
            border-bottom-color: #0066ff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .page-type-badge {
            display: inline-block;
            padding: 4px 12px;
            background-color: #e3f2fd;
            color: #1976d2;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <script src="/auth-check.js"></script>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Rank Report Card</h1>
            <div class="version">v6.7</div>
            <p>Get an SEO audit with scores for technical health, speed, on-page optimization, and AI readiness.</p>
        </div>

        <!-- Input Section -->
        <div class="card">
            <div class="input-section">
                <input type="text" class="url-input" placeholder="www.example.com or https://example.com" id="urlInput">
                <button class="btn-primary" id="runAuditBtn">Run Audit</button>
            </div>
            <div class="error-message" id="errorMessage"></div>
        </div>

        <!-- Recent Audits -->
        <div class="card" id="recentAuditsCard" style="display: none;">
            <h3 style="margin-bottom: 16px; font-size: 1.1rem; color: #495057;">Recent Audits</h3>
            <div id="recentAuditsList" style="display: flex; flex-direction: column; gap: 8px;">
                <!-- Recent audits will be inserted here -->
            </div>
        </div>

        <!-- Loading Message -->
        <div class="loading-message" id="loadingMessage">
            Running SEO audit... This may take 30-60 seconds.
        </div>

        <!-- Results Section -->
        <div class="results-section" id="resultsSection">
            <!-- Two Score Cards Side by Side -->
            <div class="scores-grid">
                <!-- SEO Score Card -->
                <div class="score-card">
                    <div class="score-card-header">
                        <div class="grade-badge" id="gradeBadge">-</div>
                        <div class="score-display">
                            <div class="score-number" id="scoreNumber">-<span style="color: #adb5bd; font-size: 1.5rem;">/100</span></div>
                            <div class="score-label">SEO Score</div>
                        </div>
                    </div>
                    <div class="summary-stats">
                        <div class="stat-box passes">
                            <div class="stat-number" id="passCount">0</div>
                            <div class="stat-label">Passes</div>
                        </div>
                        <div class="stat-box warnings">
                            <div class="stat-number" id="warningCount">0</div>
                            <div class="stat-label">Warnings</div>
                        </div>
                        <div class="stat-box issues">
                            <div class="stat-number" id="issueCount">0</div>
                            <div class="stat-label">Issues</div>
                        </div>
                    </div>
                </div>

                <!-- AI Score Card -->
                <div class="score-card">
                    <div class="score-card-header">
                        <div class="grade-badge" id="aiGradeBadge">-</div>
                        <div class="score-display">
                            <div class="score-number" id="aiScoreNumber">-<span style="color: #adb5bd; font-size: 1.5rem;">/100</span></div>
                            <div class="score-label">AI Score</div>
                        </div>
                    </div>
                    <div class="summary-stats">
                        <div class="stat-box passes">
                            <div class="stat-number" id="aiPassCount">0</div>
                            <div class="stat-label">Passes</div>
                        </div>
                        <div class="stat-box warnings">
                            <div class="stat-number" id="aiWarningCount">0</div>
                            <div class="stat-label">Warnings</div>
                        </div>
                        <div class="stat-box issues">
                            <div class="stat-number" id="aiIssueCount">0</div>
                            <div class="stat-label">Issues</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Audit Details -->
            <div class="card">
                <h2 class="section-title">Audit Details</h2>
                
                <!-- Tabs -->
                <div class="tabs">
                    <button class="tab active" id="seoTab">SEO</button>
                    <button class="tab" id="aiTab">AI Optimization</button>
                </div>

                <!-- SEO Tab Content -->
                <div class="tab-content active" id="seoContent">
                    <div id="auditDetailsList"></div>
                </div>

                <!-- AI Optimization Tab Content -->
                <div class="tab-content" id="aiContent">
                    <div class="page-type-badge" id="pageTypeBadge"></div>
                    <div id="aiAuditList"></div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer" style="display: none;">
        </div>
    </div>

    <!-- Guide Modal -->
    <div class="modal" id="guideModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle"></h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
        // Phase 4 - All 22 SEO Checks (8 PageSpeed + 14 HTML-based)

        const urlInput = document.getElementById('urlInput');
        const runAuditBtn = document.getElementById('runAuditBtn');
        const errorMessage = document.getElementById('errorMessage');
        const loadingMessage = document.getElementById('loadingMessage');
        const resultsSection = document.getElementById('resultsSection');
        const auditDetailsList = document.getElementById('auditDetailsList');
        const gradeBadge = document.getElementById('gradeBadge');
        const scoreNumber = document.getElementById('scoreNumber');
        const passCount = document.getElementById('passCount');
        const warningCount = document.getElementById('warningCount');
        const issueCount = document.getElementById('issueCount');

        const API_ENDPOINT = '/api/pagespeed';
        const FETCH_HTML_ENDPOINT = '/api/fetch-html';

        // Store current audit data globally for Generate Fix
        let currentPageHTML = '';
        let currentURL = '';
        let currentPageType = '';

        // VIDEO URLs - YouTube IDs
        const VIDEO_URLS = {
            'Analytics': 'VWBtmmAK3-w',
            'Meta Tags': 'kllEIIhdZvo',
            'Image Alt Tags': 'pe9xeFbGK_E',
            'LCP (Mobile)': '8Owj9LkPgdA',
            'LCP (Desktop)': '8Owj9LkPgdA',
            'SSL Certificate': 'IMdWlyWvBWk',
            'XML Sitemap': 'x1dTCLdWs94',
            'Robots.txt': 'KrNu3c12pwY',
            'H1 Heading': 'IUNKEyZej6E',
            'Open Graph Tags': 'b7VMRGtsR_8',
            'Schema Markup': 'iDYMUy-2vzs',
            'Mobile Viewport': 'dz6TPKF9eDI',
            'Internal Links': 'qEYaWZdiV5w',
            'HTTPS Redirect': 'OlhMBY6DosE',
            'Favicon': 'p3U5Q9ZQYVY',
            'Canonical Tag': '4xOaKJPijx8',
            'Performance Score (Mobile)': '8Owj9LkPgdA',
            'Performance Score (Desktop)': '8Owj9LkPgdA',
            'CLS (Mobile)': 'Z6WiGWDU0nU',
            'CLS (Desktop)': 'Z6WiGWDU0nU',
            'TBT (Mobile)': 'iSybVqAyASk',
            'TBT (Desktop)': 'iSybVqAyASk'
        };

        const guideModal = document.getElementById('guideModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const modalClose = document.getElementById('modalClose');

        const seoTab = document.getElementById('seoTab');
        const aiTab = document.getElementById('aiTab');
        const seoContent = document.getElementById('seoContent');
        const aiContent = document.getElementById('aiContent');
        const pageTypeBadge = document.getElementById('pageTypeBadge');
        const aiAuditList = document.getElementById('aiAuditList');

        // GUIDE TEXTS - Shopify-only
        const GUIDE_TEXTS = {
            'Analytics': `
<h3>What is this?</h3>
<p>Google Analytics (GA4) tracks who visits your website — how many people, where they came from, what pages they looked at, and whether they bought anything.</p>

<h3>Why does it matter?</h3>
<p>Without analytics, you don't know which pages get traffic, which products people look at without buying, or whether your SEO improvements work.</p>

<h3>How to set it up on Shopify:</h3>
<ol>
<li>Go to analytics.google.com and sign in</li>
<li>Click "Start measuring" → name your account</li>
<li>Create a property → select "Web" → enter your URL</li>
<li>Google gives you a GA4 Measurement ID</li>
<li>Shopify admin → Online Store → Preferences → paste your GA4 ID in Google Analytics section</li>
<li>Wait 24–48 hours for data to appear</li>
</ol>
            `,

            'Meta Tags': `
<h3>What is this?</h3>
<p>Title tags are the clickable headlines in Google search results. Meta descriptions are the short summaries beneath them. Both must be unique, the right length (50–60 characters for titles, 120–160 for descriptions), and compelling.</p>

<h3>Why does it matter?</h3>
<p>Your title tag is often the first thing people see in Google. If it's missing, too long, or poorly written, fewer people click. Google also uses title tags as a major ranking signal.</p>

<h3>How to fix on Shopify:</h3>
<ol>
<li>Go to Shopify admin</li>
<li>Products → Click product → scroll to "Search engine listing preview"</li>
<li>Click "Edit website SEO"</li>
<li>Write unique title (50–60 chars) and description (120–160 chars)</li>
<li>Include main keyword naturally in both</li>
</ol>
            `,

            'Image Alt Tags': `
<h3>What is this?</h3>
<p>Alt text is a short description you add to every image that tells Google and screen readers what the image shows.</p>

<h3>Why does it matter?</h3>
<p>Images without alt text are invisible to Google. Good alt text helps your images appear in Google Image Search, which is significant traffic for visual products.</p>

<h3>How to fix on Shopify:</h3>
<ol>
<li>When uploading a product image, click it → "Add alt text" field</li>
<li>Write a descriptive phrase (e.g., "Black and white canvas print of New York City skyline")</li>
<li>Include product keywords naturally, but don't stuff</li>
<li>Compress images before uploading using TinyPNG or Squoosh</li>
<li>Use JPEG for photos, PNG for logos with transparent backgrounds</li>
</ol>
            `,

                detail = `${value.toFixed(1)}s (target < 2.5s)`;
                fix = 'Optimize largest visible element. Consider compressing images and using lazy loading.';
            } else {
                status = 'fail';
                detail = `${value.toFixed(1)}s (target < 2.5s)`;
                fix = 'Critical: Largest element loads too slowly. Compress images, optimize CSS, and use a CDN.';
            }
            return { name: `LCP (${device})`, status, detail, fix };
        }

        function checkPerformance(score, device) {
            let status, detail, fix;
            if (score >= 90) {
                status = 'pass';
                detail = `Score: ${score}/100`;
                fix = null;
            } else if (score >= 50) {
                status = 'warning';
                detail = `Score: ${score}/100 (target ≥ 90)`;
                fix = 'Improve overall performance. Focus on image optimization and reducing JavaScript.';
            } else {
                status = 'fail';
                detail = `Score: ${score}/100 (target ≥ 90)`;
                fix = 'Critical performance issues. Optimize images, minimize CSS/JS, and enable caching.';
            }
            return { name: `Performance Score (${device})`, status, detail, fix };
        }

        function checkCLS(value, device) {
            let status, detail, fix;
            if (value < 0.1) {
                status = 'pass';
                detail = `${value.toFixed(3)} (target < 0.1)`;
                fix = null;
            } else if (value <= 0.25) {
                status = 'warning';
                detail = `${value.toFixed(3)} (target < 0.1)`;
                fix = 'Reduce layout shifts. Set image dimensions and avoid inserting content above existing content.';
            } else {
                status = 'fail';
                detail = `${value.toFixed(3)} (target < 0.1)`;
                fix = 'Severe layout shifts. Reserve space for images/ads and avoid dynamic content insertion.';
            }
            return { name: `CLS (${device})`, status, detail, fix };
        }

        function checkTBT(value, device) {
            let status, detail, fix;
            if (value < 200) {
                status = 'pass';
                detail = `${Math.round(value)}ms (target < 200ms)`;
                fix = null;
            } else if (value <= 600) {
                status = 'warning';
                detail = `${Math.round(value)}ms (target < 200ms)`;
                fix = 'Reduce JavaScript execution time. Break up long tasks and defer non-critical scripts.';
            } else {
                status = 'fail';
                detail = `${Math.round(value)}ms (target < 200ms)`;
                fix = 'Excessive blocking time. Minimize JavaScript, remove unused code, and optimize third-party scripts.';
            }
            return { name: `TBT (${device})`, status, detail, fix };
        }

        // Display results
        function displayResults(checks) {
            auditResults = checks;
            auditDetailsList.innerHTML = '';

            // STEP 1: Sort by urgency (fail → warning → pass)
            const sortOrder = { 'fail': 0, 'warning': 1, 'pass': 2 };
            checks.sort((a, b) => sortOrder[a.status] - sortOrder[b.status]);

            let passes = 0, warnings = 0, issues = 0;
            checks.forEach(check => {
                if (check.status === 'pass') passes++;
                else if (check.status === 'warning') warnings++;
                else if (check.status === 'fail') issues++;
            });

            passCount.textContent = passes;
            warningCount.textContent = warnings;
            issueCount.textContent = issues;

            // Calculate weighted score (passes = 1, warnings = 0.5, fails = 0)
            const score = Math.round(((passes + (warnings * 0.5)) / checks.length) * 100);
            scoreNumber.innerHTML = `${score}<span style="color: #adb5bd; font-size: 1.5rem;">/100</span>`;

            const grade = getGrade(score);
            gradeBadge.textContent = grade.letter;
            gradeBadge.style.background = grade.gradient;

            checks.forEach(check => {
                const item = document.createElement('div');
                item.className = `audit-item ${check.status}`;
                
                const icon = check.status === 'pass' ? '✓' : check.status === 'warning' ? '⚠' : '✗';
                
                // STEP 2: Watch Video button for warnings/failures
                const videoButton = (check.status !== 'pass' && VIDEO_URLS[check.name]) ? 
                    `<button class="btn-video" onclick="window.open('https://www.youtube.com/watch?v=${VIDEO_URLS[check.name]}', '_blank')">Watch Video</button>` : '';
                
                // STEP 3: Read Guide button for warnings/failures
                const guideButton = (check.status !== 'pass' && GUIDE_TEXTS[check.name]) ? 
                    `<button class="btn-guide" onclick="openGuide('${check.name}')">Read Guide</button>` : '';
                
                item.innerHTML = `
                    <div class="audit-icon">${icon}</div>
                    <div class="audit-content">
                        <div class="audit-name">${check.name}</div>
                        <div class="audit-detail">${check.detail}</div>
                        ${check.fix ? `<div class="audit-fix"><strong>Fix:</strong> ${check.fix}</div>` : ''}
                        ${videoButton}${guideButton}
                    </div>
                `;
                
                auditDetailsList.appendChild(item);
            });
            
            return score;
        }

        function displayAIResults(checks, pageType) {
            aiAuditList.innerHTML = '';
            pageTypeBadge.textContent = `Page Type: ${pageType}`;

            // Calculate AI score
            let aiPasses = 0;
            let aiWarnings = 0;
            let aiFails = 0;

            checks.forEach(check => {
                if (check.status === 'pass') aiPasses++;
                else if (check.status === 'warning') aiWarnings++;
                else if (check.status === 'fail') aiFails++;

                const item = document.createElement('div');
                item.className = `audit-item ${check.status}`;
                
                const icon = check.status === 'pass' ? '✓' : check.status === 'warning' ? '⚠' : '✗';
                
                // Add Read Guide and Generate Fix buttons for warnings/failures
                const guideButton = (check.status === 'warning' || check.status === 'fail') && AI_GUIDE_TEXTS[check.name]
                    ? `<button class="btn-ai-guide" onclick="showAIGuideModal('${check.name}')">Read Guide</button>`
                    : '';
                
                const generateFixButton = (check.status === 'warning' || check.status === 'fail')
                    ? `<button class="btn-generate-fix" onclick="showGenerateFixModal('${check.name}')">Generate Fix</button>`
                    : '';
                
                item.innerHTML = `
                    <div class="audit-icon">${icon}</div>

                        ${guideButton}${generateFixButton}
                    </div>
                `;
                
                aiAuditList.appendChild(item);
            });

            // Calculate AI score (warnings count as 0.5)
            const aiTotal = checks.length;
            const aiScore = Math.round(((aiPasses + (aiWarnings * 0.5)) / aiTotal) * 100);
            const aiGrade = getGrade(aiScore);

            // Update AI score display
            document.getElementById('aiScoreNumber').innerHTML = `${aiScore}<span style="color: #adb5bd; font-size: 1.5rem;">/100</span>`;
            document.getElementById('aiGradeBadge').textContent = aiGrade.letter;
            document.getElementById('aiGradeBadge').style.background = aiGrade.gradient;
            document.getElementById('aiPassCount').textContent = aiPasses;
            document.getElementById('aiWarningCount').textContent = aiWarnings;
            document.getElementById('aiIssueCount').textContent = aiFails;
            
            return aiScore;
        }

        function getGrade(score) {
            if (score >= 90) return { letter: 'A', gradient: 'linear-gradient(135deg, #4CAF50, #2E7D32)' };
            if (score >= 80) return { letter: 'B', gradient: 'linear-gradient(135deg, #2196F3, #1565C0)' };
            if (score >= 70) return { letter: 'C', gradient: 'linear-gradient(135deg, #FF9800, #F57C00)' };
            if (score >= 60) return { letter: 'D', gradient: 'linear-gradient(135deg, #FF5722, #E64A19)' };
            return { letter: 'F', gradient: 'linear-gradient(135deg, #F44336, #C62828)' };
        }

        async function runAudit() {
            const rawInput = urlInput.value;
            
            errorMessage.classList.remove('active');
            urlInput.classList.remove('error');
            
            const normalizedURL = normalizeURL(rawInput);
            
            if (!normalizedURL) {
                showError('Please enter a URL');
                return;
            }

            if (!isValidURL(normalizedURL)) {
                showError('Please enter a valid URL (e.g., www.example.com or https://example.com)');
                return;
            }

            urlInput.value = normalizedURL;

            runAuditBtn.disabled = true;
            runAuditBtn.textContent = 'Running...';
            loadingMessage.classList.add('active');
            resultsSection.classList.remove('active');

            try {
                const checks = await runAllChecks(normalizedURL);
                
                // Run AI checks
                const pageType = detectPageType(normalizedURL);
                const pageHTML = await fetchPageHTML(normalizedURL);
                const aiChecks = runAIChecks(pageHTML, pageType);
                
                // Store globally for Generate Fix
                currentPageHTML = pageHTML;
                currentURL = normalizedURL;
                currentPageType = pageType;
                
                loadingMessage.classList.remove('active');
                const seoScore = displayResults(checks);
                const aiScore = displayAIResults(aiChecks, pageType);
                
                // Save to recent audits
                saveRecentAudit(normalizedURL, seoScore, aiScore);
                
                resultsSection.classList.add('active');
                resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            } catch (error) {
                loadingMessage.classList.remove('active');
                showError(`Audit failed: ${error.message}`);
            } finally {
                runAuditBtn.disabled = false;
                runAuditBtn.textContent = 'Run Audit';
            }
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('active');
            urlInput.classList.add('error');
        }

        // Recent Audits Management
        async function saveRecentAudit(url, seoScore, aiScore) {
            let audits = [];
            try {
                const res = await fetch('/api/blogs?action=get-rank-audits');
                const data = await res.json();
                audits = data.audits || [];
            } catch(e) {}
            const newAudit = {
                url: url,
                seoScore: seoScore,
                aiScore: aiScore,
                date: new Date().toISOString()
            };

            // Remove duplicate URLs
            const filtered = audits.filter(a => a.url !== url);

            // Add new audit at the beginning
            filtered.unshift(newAudit);

            // Keep only last 3
            const recent = filtered.slice(0, 3);

            try {
                await fetch('/api/blogs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'save-rank-audits', audits: recent }) });
            } catch(e) {}
            displayRecentAudits();
        }
