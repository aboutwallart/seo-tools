rner Sofa, Real Leather","img":"https://cdn.shopify.com/s/files/1/0710/7693/8014/files/hebe-three-seater-four-seater-corner-sofa-real-leather-2330074.jpg?v=1774703342"},{"id":"gid://shopify/Product/15757021086076","title":"Phillips Two Seater Sofa, Three Seater Sofa, Linen","img":"https://cdn.shopify.com/s/files/1/0710/7693/8014/files/phillips-two-seater-sofa-three-seater-sofa-linen-2764594.jpg?v=1774703217"},{"id":"gid://shopify/Product/15757021118844","title":"Graham Three Seater Curved Sofa, Velvet","img":"https://cdn.shopify.com/s/files/1/0710/7693/8014/files/graham-three-seater-curved-sofa-velvet-5094906.jpg?v=1774703281"},{"id":"gid://shopify/Product/15757021151612","title":"Glover Three Seater Sofa, Black Leather","img":"https://cdn.shopify.com/s/files/1/0710/7693/8014/files/glover-three-seater-sofa-black-leather-5219457.jpg?v=1774699204"},{"id":"gid://shopify/Product/15757021184380","title":"Marquez Two Seater Sofa, Three Seater Sofa, Linen","img":"https://cdn.shopify.com/s/files/1/0710/7693/8014/files/marquez-two-seater-sofa-three-seater-sofa-linen-6264166.jpg?v=1774703227"},{"id":"gid://shopify/Product/15757021217148","title":"Aidan Two Seater Sofa, Three Seater Sofa / Four Seater Sofa, Linen","img":"https://cdn.shopify.com/s/files/1/0710/7693/8014/files/aidan-two-seater-sofa-three-seater-sofa-four-seater-sofa-linen-8198591.jpg?v=1774703212"}]};
const KEY='dc-picker-matches-v1';
let matches=JSON.parse(localStorage.getItem(KEY)||'{}');
const termById={};
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function firstWord(s){return (s||'').toLowerCase().split('\n')[0].replace(/[^a-z0-9 ]/g,' ').trim().split(/\s+/)[0]||'';}
function stockLine(v){if(v.s>0)return '<span class=in>'+esc(v.n)+' — '+v.s+' in stock</span>';if(v.d)return '<span class=disp>'+esc(v.n)+' — dispatch in '+v.d+'d</span>';return '<span class=cus>'+esc(v.n)+' — custom made</span>';}
function candidates(term){term=(term||'').toLowerCase().trim();const a=term?DATA.store.filter(p=>p.title.toLowerCase().includes(term)):DATA.store;return a.slice(0,60);}
function save(){localStorage.setItem(KEY,JSON.stringify(matches));updateProg();}
function candsHTML(s){
  const m=matches[s.id];const list=candidates(termById[s.id]);
  if(!list.length)return '<div class=hint>Nothing matches that word — try another (sofa, table, desk, bed…).</div>';
  return list.map(p=>{const on=m&&m.storeId===p.id;
    return '<label class="opt'+(on?' sel':'')+'"><input type=checkbox class=cb data-sid="'+s.id+'" data-pid="'+p.id+'"'+(on?' checked':'')+'>'+
      (p.img?'<img loading=lazy src="'+esc(p.img)+'">':'')+'<span class=t>'+esc(p.title)+'</span></label>';}).join('');
}
function savedHTML(s){const m=matches[s.id];if(!m)return '';if(m.none)return '<span class=no>✕ Not in my store</span>';return '<span class=ok>✓ Matched: '+esc(m.storeTitle)+'</span>';}
function itemHTML(s,idx){const m=matches[s.id];
  return '<div class="item'+(m?(m.none?' none':' done'):'')+'" id="it-'+s.id+'">'+
    '<div><div class=tag>SUPPLIER '+(idx+1)+' / '+DATA.supplier.length+'</div>'+
      (s.img?'<img class=ph src="'+esc(s.img)+'">':'')+'<div class=nm>'+esc(s.name)+'</div>'+
      s.vars.map(v=>'<div class=st>'+stockLine(v)+'</div>').join('')+'</div>'+
    '<div><div class=saved data-saved="'+s.id+'">'+savedHTML(s)+'</div>'+
      '<label class=nostore><input type=checkbox class=cbnone data-sid="'+s.id+'"'+(m&&m.none?' checked':'')+'> Not in my store</label>'+
      '<input class=search data-sid="'+s.id+'" value="'+esc(termById[s.id])+'" placeholder="search your products…">'+
      '<div class=cands data-cands="'+s.id+'">'+candsHTML(s)+'</div></div></div>';
}
function refresh(sid){const s=DATA.supplier.find(x=>x.id===sid);
  document.querySelector('[data-saved="'+sid+'"]').innerHTML=savedHTML(s);
  document.querySelector('[data-cands="'+sid+'"]').innerHTML=candsHTML(s);
  const el=document.getElementById('it-'+sid);const m=matches[sid];
  el.classList.toggle('done',!!(m&&!m.none));el.classList.toggle('none',!!(m&&m.none));
  el.querySelector('.cbnone').checked=!!(m&&m.none);
  save();}
function updateProg(){const total=DATA.supplier.length,done=Object.keys(matches).length,matched=Object.values(matches).filter(x=>!x.none).length;
  document.getElementById('prog').textContent=done+' / '+total+' reviewed · '+matched+' matched';
  document.getElementById('barfill').style.width=(done/total*100)+'%';}
function render(){DATA.supplier.forEach(s=>{if(termById[s.id]===undefined)termById[s.id]=firstWord(s.name);});
  document.getElementById('list').innerHTML=DATA.supplier.map(itemHTML).join('');updateProg();}
const list=document.getElementById('list');
list.addEventListener('change',e=>{
  if(e.target.classList.contains('cb')){const sid=e.target.dataset.sid,pid=e.target.dataset.pid;
    if(e.target.checked){const p=DATA.store.find(x=>x.id===pid);matches[sid]={storeId:pid,storeTitle:p.title,supplierName:DATA.supplier.find(x=>x.id===sid).name};}
    else{delete matches[sid];}refresh(sid);}
  else if(e.target.classList.contains('cbnone')){const sid=e.target.dataset.sid;
    if(e.target.checked)matches[sid]={none:true,supplierName:DATA.supplier.find(x=>x.id===sid).name};else delete matches[sid];refresh(sid);}
});
list.addEventListener('input',e=>{if(e.target.classList.contains('search')){const sid=e.target.dataset.sid;termById[sid]=e.target.value;
  document.querySelector('[data-cands="'+sid+'"]').innerHTML=candsHTML(DATA.supplier.find(x=>x.id===sid));}});
function exportText(){return JSON.stringify(DATA.supplier.map(s=>{const m=matches[s.id];return{supplierId:s.id,supplierName:s.name,storeId:m&&!m.none?m.storeId:null,storeTitle:m&&!m.none?m.storeTitle:null,notInStore:!!(m&&m.none)};}),null,2);}
document.getElementById('bCopy').onclick=()=>{navigator.clipboard.writeText(exportText());alert('Matches copied.');};
document.getElementById('bDl').onclick=()=>{const b=new Blob([exportText()],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dc-concepts-matches.json';a.click();};
render();
</script></body></html>
