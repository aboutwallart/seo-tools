<!doctype html><html lang=en><head><meta charset=utf8>
<meta name=viewport content="width=device-width,initial-scale=1"><title>DC Concepts Picker</title>
<style>
*{box-sizing:border-box}
body{font:16px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;margin:0;background:#f3f4f6;color:#1c1c1e}
.top{position:sticky;top:0;z-index:20;background:#111827;color:#fff;padding:12px 18px}
.top .r{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;max-width:1180px;margin:0 auto}
.top h1{font-size:18px;margin:0}.prog{font-size:13px;color:#c7cbd3}
.bar{height:6px;background:#374151;border-radius:6px;margin:8px auto 0;overflow:hidden;max-width:1180px}
.bar>i{display:block;height:100%;background:#34d399;width:0;transition:.2s}
button{font:inherit;border:0;border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:700}
.b-save{background:#34d399;color:#062a1c;margin-left:6px}.b-save:disabled{opacity:.5;cursor:default}
.b-dl{background:#374151;color:#fff;margin-left:6px}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.item{display:grid;grid-template-columns:260px 1fr;gap:18px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin:14px 0}
@media(max-width:740px){.item{grid-template-columns:1fr}}
.item.done{border-color:#34d399;background:#f2fdf8}
.item.none{border-color:#fca5a5;background:#fff6f6}
.tag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;display:inline-block;margin-bottom:8px;color:#0b62c9;background:#e3eefb}
.draft{font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px;background:#fef3c7;color:#92400e;margin-left:6px}
img.ph{width:100%;aspect-ratio:1/1;object-fit:contain;background:#f6f6f8;border-radius:10px;display:block}
.nm{font-weight:700;margin:8px 0 6px;font-size:15px}
.saved{font-size:14px;font-weight:700;min-height:22px;margin-bottom:8px}
.saved .ok{color:#15803d}.saved .no{color:#b91c1c}
.search{width:100%;padding:9px 11px;border:1px solid #d1d5db;border-radius:9px;font-size:15px;margin-bottom:8px}
.nostore{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#b91c1c;margin-bottom:10px;cursor:pointer}
.opt{display:flex;align-items:center;gap:12px;padding:8px;border:1px solid #eef0f3;border-radius:10px;margin:6px 0;cursor:pointer}
.opt:hover{background:#f8fafc}.opt.sel{background:#ecfdf5;border-color:#34d399}
.opt input{width:22px;height:22px;flex:0 0 auto;cursor:pointer}
.opt img{width:56px;height:56px;object-fit:contain;background:#f6f6f8;border-radius:8px;flex:0 0 auto}
.opt .t{font-size:14px;font-weight:600}.opt .sub{font-size:12px;color:#6b7280;font-weight:500}
.hint{color:#6b7280;font-size:12.5px;margin:6px 0}
.center{text-align:center;padding:60px 20px;color:#6b7280;font-size:16px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;transition:.2s;z-index:50;pointer-events:none}
.toast.show{opacity:1}
</style></head><body>
<div class=top><div class=r>
  <h1>🪑 DC Concepts Picker</h1><div class=prog id=prog>Loading…</div>
  <div><button class=b-save id=bSave disabled>💾 Save to store</button><button class=b-dl id=bDl>⬇ Backup</button></div>
</div><div class=bar><i id=barfill></i></div></div>
<div class=wrap id=list><div class=center>Loading your products and the supplier list…</div></div>
<div class=toast id=toast></div>
<script>
let DATA = { store: [], supplier: [] };
let matches = {};          // storeId -> {supplierId,supplierName} | {none:true}
const termById = {};
const CACHE = 'dc-picker-cache-v2';

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function firstWord(s){return (s||'').toLowerCase().split('\n')[0].replace(/[^a-z0-9 ]/g,' ').trim().split(/\s+/)[0]||'';}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
function cache(){localStorage.setItem(CACHE,JSON.stringify(matches));}

function stockSub(sp){const inS=sp.vars.filter(v=>v.s>0).length,tot=sp.vars.length;return inS+' / '+tot+' options in stock';}
function candidates(term){term=(term||'').toLowerCase().trim();const a=term?DATA.supplier.filter(p=>p.name.toLowerCase().includes(term)):DATA.supplier;return a.slice(0,60);}
function candsHTML(st){const m=matches[st.id];const list=candidates(termById[st.id]);
  if(!list.length)return '<div class=hint>No supplier item with that word — try another.</div>';
  return list.map(sp=>{const on=m&&m.supplierId===sp.id;
    return '<label class="opt'+(on?' sel':'')+'"><input type=checkbox class=cb data-sid="'+st.id+'" data-supid="'+sp.id+'"'+(on?' checked':'')+'>'+
      (sp.img?'<img loading=lazy src="'+esc(sp.img)+'">':'')+'<span><span class=t>'+esc(sp.name)+'</span><br><span class=sub>'+stockSub(sp)+'</span></span></label>';}).join('');
}
function savedHTML(st){const m=matches[st.id];if(!m)return '';if(m.none)return '<span class=no>✕ Not from this supplier</span>';return '<span class=ok>✓ Linked: '+esc(m.supplierName)+'</span>';}
function itemHTML(st,idx){const m=matches[st.id];
  return '<div class="item'+(m?(m.none?' none':' done'):'')+'" id="it-'+st.id+'">'+
    '<div><div class=tag>MY PRODUCT '+(idx+1)+' / '+DATA.store.length+'</div>'+(st.status==='DRAFT'?'<span class=draft>DRAFT</span>':'')+
      (st.img?'<img class=ph src="'+esc(st.img)+'">':'')+'<div class=nm>'+esc(st.title)+'</div></div>'+
    '<div><div class=saved data-saved="'+st.id+'">'+savedHTML(st)+'</div>'+
      '<label class=nostore><input type=checkbox class=cbnone data-sid="'+st.id+'"'+(m&&m.none?' checked':'')+'> Not from this supplier</label>'+
      '<input class=search data-sid="'+st.id+'" value="'+esc(termById[st.id])+'" placeholder="search supplier list…">'+
      '<div class=cands data-cands="'+st.id+'">'+candsHTML(st)+'</div></div></div>';
}
function refresh(id){const st=DATA.store.find(x=>x.id===id);
  document.querySelector('[data-saved="'+id+'"]').innerHTML=savedHTML(st);
  document.querySelector('[data-cands="'+id+'"]').innerHTML=candsHTML(st);
  const el=document.getElementById('it-'+id);const m=matches[id];
  el.classList.toggle('done',!!(m&&!m.none));el.classList.toggle('none',!!(m&&m.none));
  el.querySelector('.cbnone').checked=!!(m&&m.none);
  cache();updateProg();}
function updateProg(){const total=DATA.store.length,done=Object.keys(matches).length,matched=Object.values(matches).filter(x=>!x.none).length;
  document.getElementById('prog').textContent=done+' / '+total+' of your products done · '+matched+' linked';
  document.getElementById('barfill').style.width=(total?done/total*100:0)+'%';}
function render(){DATA.store.forEach(st=>{if(termById[st.id]===undefined)termById[st.id]=firstWord(st.title);});
  document.getElementById('list').innerHTML=DATA.store.map(itemHTML).join('');updateProg();
  document.getElementById('bSave').disabled=false;}

const list=document.getElementById('list');
list.addEventListener('change',e=>{
  if(e.target.classList.contains('cb')){const id=e.target.dataset.sid,supid=e.target.dataset.supid;
    if(e.target.checked){const sp=DATA.supplier.find(x=>x.id===supid);matches[id]={supplierId:supid,supplierName:sp.name};}else delete matches[id];refresh(id);}
  else if(e.target.classList.contains('cbnone')){const id=e.target.dataset.sid;
    if(e.target.checked)matches[id]={none:true};else delete matches[id];refresh(id);}
});
list.addEventListener('input',e=>{if(e.target.classList.contains('search')){const id=e.target.dataset.sid;termById[id]=e.target.value;
  document.querySelector('[data-cands="'+id+'"]').innerHTML=candsHTML(DATA.store.find(x=>x.id===id));}});

function exportArray(){return DATA.store.map(st=>{const m=matches[st.id];return{storeId:st.id,storeTitle:st.title,supplierId:m&&!m.none?m.supplierId:null,supplierName:m&&!m.none?m.supplierName:null,notFromSupplier:!!(m&&m.none)};});}
document.getElementById('bDl').onclick=()=>{const b=new Blob([JSON.stringify(exportArray(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dc-concepts-matches.json';a.click();};
document.getElementById('bSave').onclick=async()=>{
  const btn=document.getElementById('bSave');btn.disabled=true;btn.textContent='Saving…';
  try{const r=await fetch('/api/dc-picker',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(exportArray())});
    const j=await r.json();if(!j.ok)throw new Error(j.error||'save failed');toast('Saved ✓ — the store updates automatically.');}
  catch(e){toast('Save failed: '+e.message);}
  btn.disabled=false;btn.textContent='💾 Save to store';
};

(async function load(){
  try{
    const r=await fetch('/api/dc-picker');const j=await r.json();
    if(j.error)throw new Error(j.error);
    DATA.store=j.store||[];DATA.supplier=j.supplier||[];
    matches={};
    (j.matches||[]).forEach(m=>{if(m.notFromSupplier)matches[m.storeId]={none:true};else if(m.supplierId)matches[m.storeId]={supplierId:m.supplierId,supplierName:m.supplierName};});
    render();
    if(j.templateMoved)toast(j.templateMoved+' new product(s) set to the DC template.');
  }catch(e){
    document.getElementById('list').innerHTML='<div class=center>Could not load (“'+esc(e.message)+'”). Refresh to try again.</div>';
  }
})();
</script></body></html>
