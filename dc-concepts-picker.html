<!doctype html><html lang=en><head><meta charset=utf8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>DC Concepts Picker</title>
<style>
*{box-sizing:border-box}
body{font:16px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;margin:0;background:#f3f4f6;color:#1c1c1e}
header{background:#111827;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{font-size:18px;margin:0}
.prog{font-size:13px;color:#c7cbd3}
.bar{height:6px;background:#374151;border-radius:6px;flex:1 1 100%;margin-top:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:#34d399;width:0}
.wrap{max-width:1080px;margin:0 auto;padding:18px}
.grid{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.tag{font-size:11px;font-weight:800;letter-spacing:.04em;padding:3px 10px;border-radius:20px;display:inline-block;margin-bottom:10px}
.tag.sup{color:#8a6d1a;background:#fdf3d7}.tag.sto{color:#0b62c9;background:#e3eefb}
img.ph{width:100%;aspect-ratio:1/1;object-fit:contain;background:#f6f6f8;border-radius:10px;display:block}
.nm{font-weight:700;margin:10px 0 8px;font-size:16px}
.st{font-size:13px;margin:2px 0}
.in{color:#15803d;font-weight:700}.disp{color:#b45309;font-weight:700}.cus{color:#b91c1c;font-weight:700}
.search{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;margin-bottom:6px}
.hint{color:#6b7280;font-size:13px;margin:2px 0 14px}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cand{border:2px solid #e5e7eb;border-radius:12px;padding:8px;cursor:pointer;background:#fff;text-align:center;transition:.12s}
.cand:hover{border-color:#0b62c9;transform:translateY(-1px)}
.cand.sel{border-color:#15803d;box-shadow:0 0 0 3px #d1fae5}
.cand img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#f6f6f8;border-radius:8px}
.ct{font-size:12px;font-weight:600;margin-top:6px;line-height:1.3}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button{font:inherit;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:700}
.b-skip{background:#e5e7eb;color:#374151}.b-none{background:#fee2e2;color:#b91c1c}
.b-nav{background:#111827;color:#fff}.b-save{background:#15803d;color:#fff}
.small{font-size:13px;color:#6b7280}
.footer{position:sticky;bottom:0;background:#fff;border-top:1px solid #e5e7eb;padding:10px 18px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.picked{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}
a{color:#0b62c9}
</style></head><body>
<header>
  <h1>🪑 DC Concepts Picker</h1>
  <div class=prog id=prog></div>

</header>
<div class=wrap>
  <div class=grid>
    <div class=panel id=supPanel></div>

      <input class=search id=search placeholder="search your products by word…">
      <div class=hint id=searchHint></div>
      <div id=picked></div>
      <div class=cands id=cands></div>
    </div>
  </div>
  <div class=row>
    <button class=b-none id=bNone>✕ Not in my store</button>
    <button class=b-skip id=bSkip>Skip for now →</button>
  </div>
</div>
<div class=footer>
  <div><button class=b-nav id=bPrev>← Back</button> <button class=b-nav id=bNext>Next →</button></div>
  <div class=small id=count></div>
  <div><button class=b-save id=bCopy>📋 Copy matches</button> <button class=b-save id=bDl>⬇ Download matches</button></div>
</div>

function stockLine(v){
  if(v.s>0)return '<span class=in>'+esc(v.n)+' — '+v.s+' in stock</span>';
  if(v.d)return '<span class=disp>'+esc(v.n)+' — dispatch in '+v.d+'d</span>';
  return '<span class=cus>'+esc(v.n)+' — custom made</span>';
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function candidates(term){
  term=(term||'').toLowerCase().trim();
  if(!term)return DATA.store;
  return DATA.store.filter(p=>p.title.toLowerCase().includes(term));
}
function render(){
  const s=DATA.supplier[i];
  const fw=firstWord(s.name);
  document.getElementById('supPanel').innerHTML=
    '<div class="tag sup">SUPPLIER ITEM '+(i+1)+' / '+DATA.supplier.length+'</div>'+
    (s.img?'<img class=ph src="'+esc(s.img)+'">':'')+
    '<div class=nm>'+esc(s.name)+'</div>'+
    s.vars.map(v=>'<div class=st>'+stockLine(v)+'</div>').join('');
  const m=matches[s.id];
  document.getElementById('picked').innerHTML = m ? (m.none
      ? '<div class=picked>✕ Marked <b>not in your store</b>. <a href="#" onclick="clr();return false">change</a></div>'
      : '<div class=picked>✓ Matched to <b>'+esc(m.storeTitle)+'</b>. <a href="#" onclick="clr();return false">change</a></div>') : '';
  const search=document.getElementById('search');
  if(document.activeElement!==search) search.value=fw;
  document.getElementById('searchHint').textContent='Showing your products with “'+search.value+'”. Not right? Type a category (sofa, table, desk…).';
  drawCands();
  const total=DATA.supplier.length;
  const done=Object.keys(matches).length;
  const matched=Object.values(matches).filter(x=>!x.none).length;
  document.getElementById('prog').textContent=done+' / '+total+' reviewed · '+matched+' matched';
  document.getElementById('barfill').style.width=(done/total*100)+'%';
  document.getElementById('count').textContent='Item '+(i+1)+' of '+total;
}
function drawCands(){
  const s=DATA.supplier[i];
  const term=document.getElementById('search').value;
  const list=candidates(term).slice(0,60);
  const m=matches[s.id];
  document.getElementById('cands').innerHTML=list.map(p=>
    '<div class="cand'+(m&&m.storeId===p.id?' sel':'')+'" onclick="pick(\''+p.id+'\')">'+
    (p.img?'<img src="'+esc(p.img)+'" loading=lazy>':'<div class=ct>(no photo)</div>')+
    '<div class=ct>'+esc(p.title)+'</div></div>').join('') || '<div class=hint>Nothing matches that word — try another.</div>';
}
function pick(storeId){
  const s=DATA.supplier[i];const p=DATA.store.find(x=>x.id===storeId);
  matches[s.id]={storeId:p.id,storeTitle:p.title,supplierName:s.name};
  next();
}
function clr(){delete matches[DATA.supplier[i].id];save();}
function next(){if(i<DATA.supplier.length-1)i++;save();}
function prev(){if(i>0)i--;save();}
document.getElementById('bNext').onclick=next;
document.getElementById('bPrev').onclick=prev;
document.getElementById('bSkip').onclick=next;
document.getElementById('bNone').onclick=()=>{matches[DATA.supplier[i].id]={none:true,supplierName:DATA.supplier[i].name};next();};
document.getElementById('search').oninput=drawCands;
document.getElementById('bCopy').onclick=()=>{navigator.clipboard.writeText(exportText());alert('Matches copied to clipboard.');};
document.getElementById('bDl').onclick=()=>{const b=new Blob([exportText()],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dc-concepts-matches.json';a.click();};
function exportText(){
  const out=DATA.supplier.map(s=>{const m=matches[s.id];return{supplierId:s.id,supplierName:s.name,storeId:m&&!m.none?m.storeId:null,storeTitle:m&&!m.none?m.storeTitle:null,notInStore:!!(m&&m.none)};});
  return JSON.stringify(out,null,2);
}
document.addEventListener('keydown',e=>{if(e.target.id==='search')return;if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();});
render();
</script></body></html>
