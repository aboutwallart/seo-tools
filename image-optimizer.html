<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Optimizer v1 - About Wall Art</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .version {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 6px;
            border-left: 4px solid #007bff;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #333;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        button:hover:not(:disabled) {
            background: #0056b3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007bff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #f8f9fa;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #dee2e6;
            position: sticky;
            top: 0;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #dee2e6;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .image-preview {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-product { background: #e3f2fd; color: #1976d2; }
        .badge-collection { background: #f3e5f5; color: #7b1fa2; }
        .badge-blog { background: #fff3e0; color: #f57c00; }
        .badge-page { background: #e8f5e9; color: #388e3c; }

        .badge-missing { background: #ffebee; color: #c62828; }
        .badge-present { background: #e8f5e9; color: #2e7d32; }

        .file-size {
            font-weight: 500;
        }

        .size-large { color: #d32f2f; }
        .size-medium { color: #f57c00; }
        .size-small { color: #388e3c; }

        .format {
            font-family: monospace;
            font-size: 12px;
            padding: 2px 6px;
            background: #f5f5f5;
            border-radius: 3px;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Image Optimizer</h1>
        <div class="version">Version 1.0 - Image Analysis</div>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-label">Total Images</div>
                <div class="stat-value" id="totalImages">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Missing Alt Text</div>
                <div class="stat-value" id="missingAlt">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Size</div>
                <div class="stat-value" id="totalSize">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Large Images (&gt;500KB)</div>
                <div class="stat-value" id="largeImages">-</div>
            </div>
        </div>

        <div class="controls">
            <button id="scanBtn" onclick="startScan()">Start Scan</button>
            
            <div class="filter-group">
                <label>Filter by Type:</label>
                <select id="typeFilter" onchange="applyFilters()">
                    <option value="all">All Types</option>
                    <option value="product">Products</option>
                    <option value="collection">Collections</option>
                    <option value="blog">Blogs</option>
                    <option value="page">Pages</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Filter by Issue:</label>
                <select id="issueFilter" onchange="applyFilters()">
                    <option value="all">All Images</option>
                    <option value="no-alt">Missing Alt Text</option>
                    <option value="large">Large Files (&gt;500KB)</option>
                    <option value="huge">Huge Files (&gt;1MB)</option>
                </select>
            </div>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <div id="loadingText">Scanning images...</div>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="results" style="display: none;">
            <table>
                <thead>
                    <tr>
                        <th>Preview</th>
                        <th>Source</th>
                        <th>Type</th>
                        <th>Size</th>
                        <th>Dimensions</th>
                        <th>Format</th>
                        <th>Alt Text</th>
                    </tr>
                </thead>
                <tbody id="imageTable">
                </tbody>
            </table>
        </div>

        <div id="empty" class="empty" style="display: none;">
            Click "Start Scan" to analyze all images on your Shopify store
        </div>
    </div>

    <script>
        let allImages = [];
        let filteredImages = [];

        async function startScan() {
            document.getElementById('scanBtn').disabled = true;
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('results').style.display = 'none';
            document.getElementById('empty').style.display = 'none';
            
            allImages = [];
            
            try {
                // Scan products
                updateLoadingText('Scanning products...');
                await scanProducts();
                
                // Scan collections
                updateLoadingText('Scanning collections...');
                await scanCollections();
                
                // Scan blogs (via web scraping)
                updateLoadingText('Scanning blog posts...');
                await scanBlogs();
                
                // Scan homepage and pages (via web scraping)
                updateLoadingText('Scanning homepage and pages...');
                await scanPages();
                
                // Get file sizes
                updateLoadingText('Checking image file sizes...');
                await checkImageSizes();
                
                // Display results
                filteredImages = allImages;
                displayResults();
                updateStats();
                
            } catch (error) {
                showError('Error scanning images: ' + error.message);
                console.error(error);
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('scanBtn').disabled = false;
            }
        }

        function updateLoadingText(text) {
            document.getElementById('loadingText').textContent = text;
        }

        async function scanProducts() {
            const response = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    model: 'claude-sonnet-4-20250514',
                    max_tokens: 1000,
                    mcp_servers: [{
                        type: 'url',
                        url: 'https://setup.shopify.com/mcp',
                        name: 'shopify-mcp'
                    }],
                    messages: [{
                        role: 'user',
                        content: 'Search for all products. Return first 50 products with their images.'
                    }]
                })
            });

            const data = await response.json();
            
            // Extract product data from MCP tool results
            const toolResults = data.content
                .filter(item => item.type === 'mcp_tool_result')
                .map(item => item.content?.[0]?.text || '')
                .join('\n');

            // Parse the tool results to extract image data
            // This is a simplified parser - adjust based on actual Shopify MCP response
            if (toolResults) {
                const products = parseShopifyProducts(toolResults);
                products.forEach(product => {
                    if (product.images && product.images.length > 0) {
                        product.images.forEach(img => {
                            allImages.push({
                                url: img.url,
                                source: product.title,
                                type: 'product',
                                altText: img.altText || '',
                                width: img.width || null,
                                height: img.height || null,
                                format: getFormat(img.url),
                                fileSize: null // Will be checked later
                            });
                        });
                    }
                });
            }
        }

        async function scanCollections() {
            const response = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    model: 'claude-sonnet-4-20250514',
                    max_tokens: 1000,
                    mcp_servers: [{
                        type: 'url',
                        url: 'https://setup.shopify.com/mcp',
                        name: 'shopify-mcp'
                    }],
                    messages: [{
                        role: 'user',
                        content: 'Search for all collections. Return first 50 collections with their images.'
                    }]
                })
            });

            const data = await response.json();
            
            const toolResults = data.content
                .filter(item => item.type === 'mcp_tool_result')
                .map(item => item.content?.[0]?.text || '')
                .join('\n');

            if (toolResults) {
                const collections = parseShopifyCollections(toolResults);
                collections.forEach(collection => {
                    if (collection.image) {
                        allImages.push({
                            url: collection.image.url,
                            source: collection.title,
                            type: 'collection',
                            altText: collection.image.altText || '',
                            width: collection.image.width || null,
                            height: collection.image.height || null,
                            format: getFormat(collection.image.url),
                            fileSize: null
                        });
                    }
                });
            }
        }

        async function scanBlogs() {
            // Scrape blog listing page to find blog posts
            try {
                const blogListUrl = 'https://aboutwallart.com/blogs/news';
                const html = await fetchViaProxy(blogListUrl);
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                // Extract blog post URLs
                const blogLinks = Array.from(doc.querySelectorAll('a[href*="/blogs/"]'))
                    .map(a => a.href)
                    .filter(url => url.includes('/blogs/news/'))
                    .slice(0, 20); // Limit to first 20 blog posts
                
                // Scan each blog post for images
                for (const blogUrl of blogLinks) {
                    const blogHtml = await fetchViaProxy(blogUrl);
                    const blogDoc = parser.parseFromString(blogHtml, 'text/html');
                    const images = blogDoc.querySelectorAll('img');
                    
                    images.forEach(img => {
                        const src = img.src || img.dataset.src;
                        if (src && !src.includes('data:image')) {
                            allImages.push({
                                url: src,
                                source: blogDoc.title || 'Blog Post',
                                type: 'blog',
                                altText: img.alt || '',
                                width: img.naturalWidth || null,
                                height: img.naturalHeight || null,
                                format: getFormat(src),
                                fileSize: null
                            });
                        }
                    });
                }
            } catch (error) {
                console.warn('Could not scan blogs:', error);
            }
        }

        async function scanPages() {
            const pagesToScan = [
                { url: 'https://aboutwallart.com', name: 'Homepage' },
                { url: 'https://aboutwallart.com/pages/about-us', name: 'About Us' },
                { url: 'https://aboutwallart.com/pages/contact', name: 'Contact' }
            ];

            for (const page of pagesToScan) {
                try {
                    const html = await fetchViaProxy(page.url);
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const images = doc.querySelectorAll('img');
                    
                    images.forEach(img => {
                        const src = img.src || img.dataset.src;
                        if (src && !src.includes('data:image')) {
                            allImages.push({
                                url: src,
                                source: page.name,
                                type: 'page',
                                altText: img.alt || '',
                                width: img.naturalWidth || null,
                                height: img.naturalHeight || null,
                                format: getFormat(src),
                                fileSize: null
                            });
                        }
                    });
                } catch (error) {
                    console.warn(`Could not scan ${page.name}:`, error);
                }
            }
        }

        async function checkImageSizes() {
            const batchSize = 10;
            for (let i = 0; i < allImages.length; i += batchSize) {
                const batch = allImages.slice(i, i + batchSize);
                await Promise.all(batch.map(async (img) => {
                    try {
                        const response = await fetch(img.url, { method: 'HEAD' });
                        const size = response.headers.get('content-length');
                        img.fileSize = size ? parseInt(size) : null;
                    } catch (error) {
                        console.warn('Could not get size for:', img.url);
                    }
                }));
            }
        }

        async function fetchViaProxy(url) {
            const proxyUrl = 'https://aboutwallart.com/apps/proxy/';
            const response = await fetch(proxyUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ url })
            });
            
            if (!response.ok) throw new Error('Proxy fetch failed');
            return await response.text();
        }

        function parseShopifyProducts(text) {
            // Simple parser - adjust based on actual MCP response format
            const products = [];
            try {
                // Try to parse as JSON if possible
                const json = JSON.parse(text);
                if (Array.isArray(json)) return json;
                if (json.products) return json.products;
            } catch {
                // If not JSON, parse text representation
                // This is placeholder - adjust based on real response
            }
            return products;
        }

        function parseShopifyCollections(text) {
            const collections = [];
            try {
                const json = JSON.parse(text);
                if (Array.isArray(json)) return json;
                if (json.collections) return json.collections;
            } catch {
                // Parse text format
            }
            return collections;
        }

        function getFormat(url) {
            const match = url.match(/\.(jpg|jpeg|png|gif|webp|svg)(\?|$)/i);
            return match ? match[1].toUpperCase() : 'Unknown';
        }

        function formatFileSize(bytes) {
            if (!bytes) return 'Unknown';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        function getSizeClass(bytes) {
            if (!bytes) return '';
            if (bytes > 1024 * 1024) return 'size-large'; // > 1MB
            if (bytes > 500 * 1024) return 'size-medium'; // > 500KB
            return 'size-small';
        }

        function displayResults() {
            const tbody = document.getElementById('imageTable');
            tbody.innerHTML = '';

            if (filteredImages.length === 0) {
                document.getElementById('empty').style.display = 'block';
                document.getElementById('results').style.display = 'none';
                return;
            }

            document.getElementById('empty').style.display = 'none';
            document.getElementById('results').style.display = 'block';

            filteredImages.forEach(img => {
                const row = tbody.insertRow();
                
                // Preview
                const previewCell = row.insertCell();
                const imgEl = document.createElement('img');
                imgEl.src = img.url;
                imgEl.className = 'image-preview';
                imgEl.alt = img.altText || 'No alt text';
                previewCell.appendChild(imgEl);
                
                // Source
                const sourceCell = row.insertCell();
                sourceCell.textContent = img.source;
                
                // Type
                const typeCell = row.insertCell();
                const typeBadge = document.createElement('span');
                typeBadge.className = `badge badge-${img.type}`;
                typeBadge.textContent = img.type;
                typeCell.appendChild(typeBadge);
                
                // Size
                const sizeCell = row.insertCell();
                const sizeSpan = document.createElement('span');
                sizeSpan.className = `file-size ${getSizeClass(img.fileSize)}`;
                sizeSpan.textContent = formatFileSize(img.fileSize);
                sizeCell.appendChild(sizeSpan);
                
                // Dimensions
                const dimCell = row.insertCell();
                dimCell.textContent = img.width && img.height ? `${img.width} × ${img.height}` : 'Unknown';
                
                // Format
                const formatCell = row.insertCell();
                const formatSpan = document.createElement('span');
                formatSpan.className = 'format';
                formatSpan.textContent = img.format;
                formatCell.appendChild(formatSpan);
                
                // Alt text
                const altCell = row.insertCell();
                const altBadge = document.createElement('span');
                altBadge.className = img.altText ? 'badge badge-present' : 'badge badge-missing';
                altBadge.textContent = img.altText ? '✓ Present' : '✗ Missing';
                altCell.appendChild(altBadge);
            });
        }

        function updateStats() {
            document.getElementById('totalImages').textContent = allImages.length;
            
            const missingAlt = allImages.filter(img => !img.altText).length;
            document.getElementById('missingAlt').textContent = missingAlt;
            
            const totalBytes = allImages.reduce((sum, img) => sum + (img.fileSize || 0), 0);
            document.getElementById('totalSize').textContent = formatFileSize(totalBytes);
            
            const largeImages = allImages.filter(img => img.fileSize > 500 * 1024).length;
            document.getElementById('largeImages').textContent = largeImages;
        }

        function applyFilters() {
            const typeFilter = document.getElementById('typeFilter').value;
            const issueFilter = document.getElementById('issueFilter').value;
            
            filteredImages = allImages.filter(img => {
                // Type filter
                if (typeFilter !== 'all' && img.type !== typeFilter) return false;
                
                // Issue filter
                if (issueFilter === 'no-alt' && img.altText) return false;
                if (issueFilter === 'large' && (!img.fileSize || img.fileSize <= 500 * 1024)) return false;
                if (issueFilter === 'huge' && (!img.fileSize || img.fileSize <= 1024 * 1024)) return false;
                
                return true;
            });
            
            displayResults();
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        // Show empty state on load
        document.getElementById('empty').style.display = 'block';
    </script>
</body>
</html>
