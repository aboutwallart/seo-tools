                if (sim > maxSim) {
                    maxSim = sim;
                    matchPost = existing;
                }
            }
            
            if (maxSim > 0.7) idea.conflict = { level: 'similar', post: matchPost };
            else if (maxSim > 0.4) idea.conflict = { level: 'caution', post: matchPost };
            else idea.conflict = { level: 'new' };
        });
        
        ideas.sort((a, b) => b.opportunityScore - a.opportunityScore);
        
        const html = ideas.map((idea, i) => `
            <div class="idea-card ${idea.conflict.level}">
                <span class="conflict-badge ${idea.conflict.level}">${
                    idea.conflict.level === 'new' ? '🟢 New' : 
                    idea.conflict.level === 'caution' ? '🟡 Caution' : '🔴 Similar'
                }</span>
                <div class="idea-title">${i+1}. ${idea.title}</div>
                <p style="color:#666;margin-bottom:1rem;">${idea.description}</p>
                <div style="display:flex;gap:1.5rem;font-size:0.9rem;">
                    <div><strong>Search:</strong> ${idea.searchVolume}</div>
                    <div><strong>Competition:</strong> ${idea.competition}</div>
                    <div><strong>Score:</strong> ${idea.opportunityScore}/100</div>
                </div>
                ${idea.conflict.level !== 'new' ? `<div style="background:#fff;border:1px solid #f59e0b;border-radius:4px;padding:1rem;margin-top:1rem;font-size:0.9rem;"><strong>⚠️ Similar to:</strong> "${idea.conflict.post}"</div>` : ''}
            </div>
        `).join('');
        
        document.getElementById('results').innerHTML = html;
        
    } catch (error) {
        alert('Error: ' + error.message);
    } finally {
        document.getElementById('loading').classList.add('hidden');
    }
}
    </script>
</body>
</html>
