        // Load existing blogs from database on page load
        async function loadExistingBlogs() {
            try {
                const response = await fetch('/api/blogs');
                const data = await response.json();
                existingBlogs = data.blogs || [];
                
                const published = existingBlogs.filter(b => b.status === 'published').length;
                const planned = existingBlogs.filter(b => b.status === 'planned').length;
                
                document.getElementById('stats').innerHTML = `
                    <strong>Database loaded:</strong> ${published} published blogs, ${planned} planned blogs
                `;

                // Initialize keyword gap analysis
                analyzeKeywordGap();
            } catch (error) {
                console.error('Error loading blogs:', error);
                document.getElementById('stats').innerHTML = `
                    <strong>Error:</strong> Could not load blog database
                `;
            }
        }

        // Analyze keyword gap - filter out keywords already covered
        function analyzeKeywordGap() {
            // Deduplicate keywords by keyword name
            const uniqueKeywords = new Map();
            COMPETITOR_DATA.forEach(item => {
                if (!uniqueKeywords.has(item.keyword)) {
                    uniqueKeywords.set(item.keyword, item);
                } else {
                    // Keep the one with lower difficulty
                    const existing = uniqueKeywords.get(item.keyword);
                    if (item.seo_difficulty < existing.seo_difficulty) {
                        uniqueKeywords.set(item.keyword, item);
                    }
                }
            });

            // Convert back to array
            competitorKeywords = Array.from(uniqueKeywords.values());

            // Filter out keywords already covered by existing blogs
            const uncoveredKeywords = competitorKeywords.filter(kw => {
                const kwExtracted = extractKeyword(kw.keyword);
                
                // Check if any existing blog covers this keyword
                for (const blog of existingBlogs) {
                    const blogKeyword = blog.keyword;
                    const similarity = calculateSimilarity(kwExtracted, blogKeyword);
                    
                    // If similarity >= 40%, consider it covered
                    if (similarity >= 0.4) {
                        return false; // Keyword is covered, exclude it
                    }
                }
                
                return true; // Keyword not covered, include it
            });

            filteredGapKeywords = uncoveredKeywords;
            applyFilters();
        }

        function calculateSimilarity(keyword1, keyword2) {
            const words1 = keyword1.split(' ').filter(w => w.length > 2);
            const words2 = keyword2.split(' ').filter(w => w.length > 2);
            
            const intersection = words1.filter(w => words2.includes(w)).length;
            const union = new Set([...words1, ...words2]).size;
            
            return intersection / union;
        }

        function applyFilters() {
            const minVolume = parseInt(document.getElementById('minVolume').value) || 0;
            const maxDifficulty = parseInt(document.getElementById('maxDifficulty').value) || 100;
            const maxResults = parseInt(document.getElementById('maxResults').value) || 50;

            // Calculate opportunity score for each keyword
            // Higher volume = better, Lower difficulty = better
            // Score = volume / (difficulty * 100)
            const scoredKeywords = filteredGapKeywords.map(kw => ({
                ...kw,
                opportunityScore: kw.volume / (kw.seo_difficulty * 100)
            }));

            // Filter: only show green (≥100) and yellow (≥30) opportunities
            // Exclude red (<30) completely
            const goodOpportunities = scoredKeywords.filter(kw => kw.opportunityScore >= 30);

            // Sort by opportunity score (highest first)
            goodOpportunities.sort((a, b) => b.opportunityScore - a.opportunityScore);

            const filtered = goodOpportunities
                .filter(kw => kw.volume >= minVolume && kw.seo_difficulty <= maxDifficulty)
                .slice(0, maxResults);

            displayGapResults(filtered);
        }

        function displayGapResults(keywords) {
            const total = filteredGapKeywords.length;
            const showing = keywords.length;
            
            document.getElementById('gapStats').innerHTML = `
                Showing <strong>${showing}</strong> of <strong>${total}</strong> uncovered keywords
            `;

            const html = keywords.map((kw, index) => {
                // Determine opportunity level based on score thresholds
                let opportunityClass, opportunityText;
                if (kw.opportunityScore >= 100) {
                    opportunityClass = 'opportunity-high';
                    opportunityText = '🟢 High';
                } else if (kw.opportunityScore >= 30) {
                    opportunityClass = 'opportunity-medium';
                    opportunityText = '🟡 Medium';
                } else {
                    opportunityClass = 'opportunity-low';
                    opportunityText = '🔴 Low';
                }

                return `
                <div class="gap-row">
                    <div>
                        <div class="gap-keyword">
                            ${kw.keyword}
                            <span class="opportunity-badge ${opportunityClass}">${opportunityText}</span>
                        </div>
                        <div class="gap-competitors">${kw.competitor}</div>
                    </div>
                    <div>${kw.volume.toLocaleString()}</div>
                    <div>${kw.seo_difficulty}</div>
                    <div>
                        <button class="secondary" onclick="generateIdeasForKeyword('${kw.keyword.replace(/'/g, "\\'")}')">
                            Use Keyword
                        </button>
                    </div>
                </div>
            `;
            }).join('');

            document.getElementById('gapResults').innerHTML = html;
        }

        async function generateIdeasForKeyword(keyword) {
            // Set the niche input to the keyword
            document.getElementById('niche').value = keyword;
            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            // Don't auto-generate - let user choose quantity and click Generate button
        }

        // Load blogs when page loads
        loadExistingBlogs();

        async function generateIdeas() {
            const niche = document.getElementById('niche').value.trim();
            const ideaCount = parseInt(document.getElementById('ideaCount').value);
            
            if (!niche) {
                alert('Please enter a niche or topic');
                return;
            }

            document.getElementById('generateBtn').disabled = true;
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('results').innerHTML = '';

            try {
                const response = await fetch('/api/claude', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: `Generate exactly ${ideaCount} blog post title ideas for the niche: "${niche}". 

Requirements:
- SEO-focused titles
- Question-based and how-to formats
- Practical, searchable topics
- Mix of beginner and advanced content
- Return ONLY the titles, one per line, numbered 1-${ideaCount}
- No additional text or explanations`
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }

                const ideas = data.response
                    .split('\n')
                    .map(line => line.replace(/^\d+[\.\)]\s*/, '').trim())
                    .filter(line => line.length > 0)
                    .slice(0, ideaCount);

                currentIdeas = ideas.map(title => ({
                    title,
                    keyword: extractKeyword(title),
                    status: 'new'
                }));

                // Check cannibalization
                currentIdeas = currentIdeas.map(idea => {
                    const conflict = checkCannibalization(idea.keyword);
                    return {
                        ...idea,
                        conflict: conflict.status,
                        conflictWith: conflict.title,
                        score: conflict.score
                    };
                });

                // Sort by opportunity score (lowest conflict first)
                currentIdeas.sort((a, b) => a.score - b.score);

                // Generate angle suggestions for yellow/green ideas
                await generateAngleSuggestions();

                displayResults();

            } catch (error) {
                document.getElementById('error').textContent = `Error: ${error.message}`;
                document.getElementById('error').style.display = 'block';
            } finally {
                document.getElementById('generateBtn').disabled = false;
                document.getElementById('loading').style.display = 'none';
            }
        }

        function extractKeyword(title) {
            const questionWords = /\b(how|what|why|when|where|which|who|is|are|can|do|does|should|will)\b/gi;
            const endings = /\b(guide|tips|ideas|ways|steps|tricks|hacks|secrets|benefits|mistakes|examples|like a pro|for beginners|101|explained|ultimate|complete|best|top)\b/gi;
            const fillers = /\b(a|an|the|your|my|our|for|in|on|at|to|of|with|and|or|but)\b/gi;
            
            let keyword = title.toLowerCase()
                .replace(questionWords, '')
                .replace(endings, '')
                .replace(fillers, '')
                .replace(/[^\w\s]/g, '')
                .trim()
                .split(/\s+/)
                .filter(word => word.length > 2)
                .slice(0, 4)
                .join(' ');
            
            return keyword || title.toLowerCase();
        }

        function checkCannibalization(keyword) {
            const keywords = keyword.split(' ').filter(w => w.length > 2);
            
            let maxScore = 0;
            let conflictTitle = null;

            for (const blog of existingBlogs) {
                const blogKeywords = blog.keyword.split(' ').filter(w => w.length > 2);
                
                const intersection = keywords.filter(k => blogKeywords.includes(k)).length;
                const union = new Set([...keywords, ...blogKeywords]).size;
                const score = intersection / union;

                if (score > maxScore) {
                    maxScore = score;
                    conflictTitle = blog.title;
                }
            }

            if (maxScore >= 0.6) {
                return { status: 'similar', title: conflictTitle, score: maxScore };
            } else if (maxScore >= 0.4) {
                return { status: 'caution', title: conflictTitle, score: maxScore };
            } else {
                return { status: 'new', title: null, score: maxScore };
            }
        }

        async function generateAngleSuggestions() {
            const ideasNeedingAngles = currentIdeas.filter(idea => 
                idea.conflict === 'new' || idea.conflict === 'caution'
            );

            if (ideasNeedingAngles.length === 0) return;

            try {
                const response = await fetch('/api/claude', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: `For each of these blog titles, suggest a unique angle or differentiation strategy in ONE concise sentence (max 15 words):

${ideasNeedingAngles.map((idea, i) => `${i + 1}. ${idea.title}`).join('\n')}

Format: Return ONLY numbered suggestions, one per line, matching the input order.`
                    })
                });

                const data = await response.json();
                const suggestions = data.response
                    .split('\n')
                    .map(line => line.replace(/^\d+[\.\)]\s*/, '').trim())
                    .filter(line => line.length > 0);

                ideasNeedingAngles.forEach((idea, index) => {
                    if (suggestions[index]) {
                        idea.angleSuggestion = suggestions[index];
                    }
                });

            } catch (error) {
                console.error('Error generating angle suggestions:', error);
            }
        }

        async function markAsPlanned(index) {
            const idea = currentIdeas[index];
            
            try {
                const response = await fetch('/api/blogs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'save',
                        title: idea.title,
                        keyword: idea.keyword,
                        status: 'planned'
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    // Add to existing blogs list
                    existingBlogs.push({
                        title: idea.title,
                        keyword: idea.keyword,
                        status: 'planned',
                        date: new Date().toISOString().split('T')[0]
                    });

                    // Update UI
                    idea.isPlanned = true;
                    displayResults();

                    // Update stats
                    const published = existingBlogs.filter(b => b.status === 'published').length;
                    const planned = existingBlogs.filter(b => b.status === 'planned').length;
                    document.getElementById('stats').innerHTML = `
                        <strong>Database:</strong> ${published} published blogs, ${planned} planned blogs
                    `;

                    // Re-analyze keyword gap (newly planned blog might cover a keyword)
                    analyzeKeywordGap();
                } else {
                    alert('Error marking as planned: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error marking as planned:', error);
                alert('Error: Could not save to database');
            }
        }

        function displayResults() {
            const resultsDiv = document.getElementById('results');
            
            const html = currentIdeas.map((idea, index) => {
                const statusClass = idea.conflict === 'new' ? 'status-new' : 
                                  idea.conflict === 'caution' ? 'status-caution' : 
                                  'status-similar';
                
                const statusText = idea.conflict === 'new' ? '🟢 New Topic' : 
                                 idea.conflict === 'caution' ? '🟡 Caution' : 
                                 '🔴 Similar';

                const angleSuggestion = idea.angleSuggestion && (idea.conflict === 'new' || idea.conflict === 'caution') ? `
                    <div class="angle-suggestion">
                        <div class="angle-label">Suggested Angle:</div>
                        ${idea.angleSuggestion}
                    </div>
                ` : '';

                const conflictInfo = idea.conflictWith ? `
                    <div class="idea-meta">
                        Similar to: <strong>${idea.conflictWith}</strong> (${Math.round(idea.score * 100)}% overlap)
                    </div>
                ` : '';

                const plannedBtn = idea.isPlanned ? `
                    <button class="mark-planned-btn planned" disabled>✓ Planned</button>
                ` : `
                    <button class="mark-planned-btn" onclick="markAsPlanned(${index})">Mark as Planned</button>
                `;

                return `
                    <div class="idea-card">
                        <div class="idea-header">
                            <div class="idea-title">${idea.title}</div>
                            <div class="status-badge ${statusClass}">${statusText}</div>
                        </div>
                        ${conflictInfo}
                        ${angleSuggestion}
                        ${plannedBtn}
                    </div>
                `;
            }).join('');

            resultsDiv.innerHTML = html;
        }
    </script>
