        function checkCannibalization(newTitle, existingBlogs) {
            // Extract the main keyword/topic from a title
            const extractMainKeyword = (title) => {
                const lower = title.toLowerCase();
                
                // Remove common question patterns
                let cleaned = lower
                    .replace(/^(how to|how|why|what|when|where|which|should|can|do|does|is|are)\s+/i, '')
                    .replace(/\s+(like a pro|professional|guide|tips|ideas|for beginners|101|explained|ultimate|complete|step-by-step|that work)\s*$/i, '')
                    .replace(/:\s*.+$/, ''); // Remove subtitle after colon
                
                // Remove filler words but keep the core topic phrase
                const fillers = /\b(a|an|the|your|my|our|for|in|on|with|at|from|to|of|and|or|that|this|these|those|perfect|best|top|great|good|amazing|beautiful|stunning)\b/g;
                cleaned = cleaned.replace(fillers, ' ').replace(/\s+/g, ' ').trim();
                
                // If we have "wall art" + another word, that's likely the topic
                // Otherwise, take the first 2-3 meaningful words
                const words = cleaned.split(/\s+/).filter(w => w.length > 2);
                
                // Return 2-4 word phrase as the main keyword
                return words.slice(0, 4).join(' ');
            };
            
            const newKeyword = extractMainKeyword(newTitle);
            
            let bestMatch = { similarity: 0, post: '', keyword: '' };
            
            for (const existing of existingBlogs) {
                const existingKeyword = extractMainKeyword(existing);
                
                // Calculate similarity between keywords
                const newWords = new Set(newKeyword.split(/\s+/));
                const existingWords = new Set(existingKeyword.split(/\s+/));
                
                const commonWords = [...newWords].filter(w => existingWords.has(w));
                const totalUniqueWords = new Set([...newWords, ...existingWords]).size;
                
                // Jaccard similarity: intersection / union
                const similarity = commonWords.length / totalUniqueWords;
                
                if (similarity > bestMatch.similarity) {
                    bestMatch = { similarity, post: existing, keyword: existingKeyword };
                }
            }
            
            // Much stricter thresholds since we're comparing extracted keywords
            if (bestMatch.similarity >= 0.6) {
                return { level: 'similar', post: bestMatch.post };
            } else if (bestMatch.similarity >= 0.4) {
                return { level: 'caution', post: bestMatch.post };
            } else {
                return { level: 'new' };
            }
        }

        async function findIdeas() {
            const niche = document.getElementById('niche').value.trim();
            if (!niche) return alert('Please enter your niche');

            const ideaCount = document.getElementById('ideaCount').value;
            const btn = document.getElementById('findBtn');
            btn.disabled = true;
            document.getElementById('loadingText').textContent = `Generating ${ideaCount} blog ideas and angle suggestions...`;
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('results').innerHTML = '';

            try {
                const response = await fetch('/api/claude', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: `Generate ${ideaCount} blog post ideas for: "${niche}". Return ONLY a JSON array:
[{"title":"Blog Title","description":"Short description","searchVolume":"High/Medium/Low","competition":"High/Medium/Low","opportunityScore":85}]
No other text.`
                    })
                });

                if (!response.ok) throw new Error('Failed to generate ideas');

                const data = await response.json();
                let text = data.content[0].text.replace(/```json\n?/g, '').replace(/```/g, '').trim();
                const ideas = JSON.parse(text);

                ideas.forEach(idea => {
                    idea.conflict = checkCannibalization(idea.title, EXISTING_BLOGS);
                });

                ideas.sort((a, b) => b.opportunityScore - a.opportunityScore);
                
                // Generate angle suggestions for caution and new ideas
                await generateAngleSuggestions(ideas, niche);
                
                displayIdeas(ideas);

            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                btn.disabled = false;
                document.getElementById('loading').classList.add('hidden');
            }
        }

        async function generateAngleSuggestions(ideas, niche) {
            // Only generate angles for caution and new ideas (not similar)
            const ideasNeedingAngles = ideas.filter(idea => idea.conflict.level !== 'similar');
            
            if (ideasNeedingAngles.length === 0) return;

            // Build prompt for angle generation
            const ideaList = ideasNeedingAngles.map((idea, i) => 
                `${i+1}. "${idea.title}" (${idea.conflict.level === 'caution' ? 'Similar to: ' + idea.conflict.post : 'New topic'})`
            ).join('\n');

            const prompt = `You are an SEO content strategist for www.aboutwallart.com (wall art and home decor).

For each blog idea below, suggest a unique angle to make it stand out:

${ideaList}

For "caution" ideas (similar to existing): Suggest how to differentiate from the existing blog.
For "new" ideas: Suggest the best angle to maximize uniqueness and value.

Return ONLY a JSON array with this format:
[{"angle": "Focus on X, emphasize Y, include Z"}]

Keep each angle to 1-2 sentences, actionable and specific.`;

            try {
                const response = await fetch('/api/claude', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                if (!response.ok) return; // Fail silently, angles are optional

                const data = await response.json();
                let text = data.content[0].text.replace(/```json\n?/g, '').replace(/```/g, '').trim();
                const angles = JSON.parse(text);

                // Attach angles to ideas
                let angleIndex = 0;
                for (const idea of ideas) {
                    if (idea.conflict.level !== 'similar') {
                        idea.angle = angles[angleIndex]?.angle || '';
                        angleIndex++;
                    }
                }
            } catch (error) {
                console.error('Failed to generate angles:', error);
                // Fail silently - angles are optional enhancement
            }
        }

        function displayIdeas(ideas) {
            const badges = { 'new': '🟢 New', 'caution': '🟡 Caution', 'similar': '🔴 Similar' };
            
            const html = ideas.map((idea, i) => {
                let actionText = '';
                let angleHTML = '';
                
                if (idea.conflict.level === 'similar') {
                    actionText = `<div style="background:#fff;border:1px solid #ef4444;border-radius:4px;padding:1rem;margin-top:1rem;font-size:0.9rem;">
                        <strong>⚠️ Action:</strong> Update existing blog instead<br>
                        <span style="color:#666;font-size:0.85rem;">Similar to: "${idea.conflict.post}"</span>
                    </div>`;
                } else if (idea.conflict.level === 'caution') {
                    actionText = `<div style="background:#fff;border:1px solid #f59e0b;border-radius:4px;padding:1rem;margin-top:1rem;font-size:0.9rem;">
                        <strong>⚠️</strong> Similar to: "${idea.conflict.post}"
                    </div>`;
                    if (idea.angle) {
                        angleHTML = `<div class="angle-suggestion">
                            <strong>💡 Suggested Angle:</strong> ${idea.angle}
                        </div>`;
                    }
                } else {
                    actionText = `<div style="background:#f0fdf4;border:1px solid #22c55e;border-radius:4px;padding:0.75rem;margin-top:1rem;font-size:0.9rem;">
                        <strong>✅ Safe to write</strong> - No significant overlap
                    </div>`;
                    if (idea.angle) {
                        angleHTML = `<div class="angle-suggestion">
                            <strong>💡 Suggested Angle:</strong> ${idea.angle}
                        </div>`;
                    }
                }
                
                return `
                    <div class="idea-card ${idea.conflict.level}">
                        <span class="conflict-badge ${idea.conflict.level}">${badges[idea.conflict.level]}</span>
                        <div class="idea-title">${i+1}. ${idea.title}</div>
                        <p style="color:#666;margin-bottom:1rem;">${idea.description}</p>
                        <div style="display:flex;gap:1.5rem;font-size:0.9rem;">
                            <div><strong>Search:</strong> ${idea.searchVolume}</div>
                            <div><strong>Competition:</strong> ${idea.competition}</div>
                            <div><strong>Score:</strong> ${idea.opportunityScore}/100</div>
                        </div>
                        ${actionText}
                        ${angleHTML}
                    </div>
                `;
            }).join('');
            document.getElementById('results').innerHTML = html;
        }
